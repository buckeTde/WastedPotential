ell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Farbwert"},{"name":"Cipher","cat":"Keyword Ability","cr":"702.99","crtitle":"Cipher","crshort":"Cipher appears on some instants and sorceries. It represents two abilities. The first is a spell ability that functions while the spell with cipher is on the stack. The second is a static ability that functions while the card with cipher is in the exile zone.","reminder":"Cipher (Then you may exile this spell card encoded on a creature you control. Whenever that creature deals combat damage to a player, its controller may cast a copy of the encoded card without paying its mana cost.)","beginner":"After casting, exile this on a creature - when it deals combat damage, cast a copy for free.","desc":"Exile on a creature after casting. When that creature deals combat damage, cast a copy for free.","crfull":"702.99a Cipher appears on some instants and sorceries. It represents two abilities. The first is a spell ability that functions while the spell with cipher is on the stack. The second is a static ability that functions while the card with cipher is in the exile zone. \"Cipher\" means \"If this spell is represented by a card, you may exile this card encoded on a creature you control\" and \"For as long as this card is encoded on that creature, that creature has 'Whenever this creature deals combat damage to a player, you may copy the encoded card and you may cast the copy without paying its mana cost.'\"\n702.99b The term \"encoded\" describes the relationship between the card with cipher while in the exile zone and the creature chosen when the spell represented by that card resolves.\n702.99c The card with cipher remains encoded on the chosen creature as long as the card with cipher remains exiled and the creature remains on the battlefield. The card remains encoded on that object even if it changes controller or stops being a creature, as long as it remains on the battlefield.","de":"Chiffrieren"},{"name":"Clash","cat":"Keyword Action","cr":"701.30","crtitle":"Clash","crshort":"To clash, a player reveals the top card of their library. That player may then put that card on the bottom of their library. \"Clash with an opponent\" means \"Choose an opponent. You and that opponent each clash.\"","reminder":"Clash (Each clashing player reveals the top card of their library, then puts that card on the top or bottom. A player wins if their card had a higher mana value.)","beginner":"Both players reveal top cards - highest mana value wins.","desc":"Each player reveals top card. Winner is whoever reveals highest mana value.","crfull":"701.30a To clash, a player reveals the top card of their library. That player may then put that card on the bottom of their library.\n701.30b \"Clash with an opponent\" means \"Choose an opponent. You and that opponent each clash.\"\n701.30c Each clashing player reveals the top card of their library at the same time. Then those players decide in APNAP order (see rule 101.4) where to put those cards, then those cards move at the same time.\n701.30d A player wins a clash if that player revealed a card with a higher mana value than all other cards revealed in that clash.","de":"Fehde; Befehden"},{"name":"Cleave","cat":"Keyword Ability","cr":"702.148","crtitle":"Cleave","crshort":"Cleave is a keyword that represents two static abilities that function while a spell with cleave is on the stack.","reminder":"Cleave [cost] (You may cast this spell for its cleave cost. If you do, remove the words in square brackets.)","beginner":"Pay extra to remove the bracketed text, making the spell stronger.","desc":"You may cast this spell for its Cleave cost. If you do, remove the bracketed text.","crfull":"702.148a Cleave is a keyword that represents two static abilities that function while a spell with cleave is on the stack. \"Cleave [cost]\" means \"You may cast this spell by paying [cost] rather than paying its mana cost\" and \"If this spell's cleave cost was paid, change its text by removing all text found within square brackets in the spell's rules text.\" Casting a spell for its cleave cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.148b Cleave's second ability is a text-changing effect. See rule 612, \"Text-Changing Effects.\"","de":"Abspalten"},{"name":"Cloak","cat":"Keyword Action","cr":"701.58","crtitle":"Cloak","crshort":"To cloak a card, turn it face down. It becomes a 2/2 face-down creature card with ward {2}, no name, no subtypes, and no mana cost. Put that card onto the battlefield face down. That permanent is a cloaked permanent for as long as it remains face down.","reminder":"Cloak (Put the top card of your library onto the battlefield face down as a 2/2 creature with ward {2}. Turn it face up any time for its mana cost if it's a creature card.)","beginner":"Manifest your top card as a protected 2/2 that can be flipped up later.","desc":"Manifest top card, but it has Ward 2. Turn face up anytime for mana cost.","crfull":"701.58a To cloak a card, turn it face down. It becomes a 2/2 face-down creature card with ward {2}, no name, no subtypes, and no mana cost. Put that card onto the battlefield face down. That permanent is a cloaked permanent for as long as it remains face down. The effect defining its characteristics works while the card is face down and ends when it's turned face up.\n701.58b Any time you have priority, you may turn a cloaked permanent you control face up. This is a special action that doesn't use the stack (see rule 116.2b). To do this, show all players that the card representing that permanent is a creature card and what that card's mana cost is, pay that cost, then turn the permanent face up. The effect defining its characteristics while it was face down ends, and it regains its normal characteristics. (If the card representing that permanent isn't a creature card or it doesn't have a mana cost, it can't be turned face up this way.)\n701.58c If a card with morph is cloaked, its controller may turn that card face up using either the procedure described in rule 702.37e to turn a face-down permanent with morph face up or the procedure described above to turn a cloaked permanent face up.\n701.58d If a card with disguise is cloaked, its controller may turn that card face up using either the procedure described in rule 702.168d to turn a face-down permanent with disguise face up or the procedure described above to turn a cloaked permanent face up.\n701.58e If an effect instructs a player to cloak multiple cards from a single library, those cards are cloaked one at a time.\n701.58f If an effect instructs a player to cloak a card and a rule or effect prohibits the face-down object from entering the battlefield, that card isn't cloaked. Its characteristics remain unmodified and it remains in its previous zone. If it was face up, it remains face up.\n701.58g If a cloaked permanent that's represented by an instant or sorcery card would turn face up, its controller reveals it and leaves it face down. Abilities that trigger whenever a permanent is turned face up won't trigger.\n701.58h See rule 708, \"Face-Down Spells and Permanents,\" for more information.","de":""},{"name":"Clue","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Clue tokens have '{2}, {T}, Sacrifice this artifact: Draw a card.'","beginner":"An artifact token you can sacrifice to pay 2 mana and draw a card.","desc":"Artifact Token. {2}, Sacrifice this: Draw a card.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Hinweis"},{"name":"Cohort","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Cohort  -  Tap this creature and another untapped Ally you control: [Effect].","beginner":"Tap this and another Ally together to activate the ability.","desc":"Ability word. Tap this creature and an untapped Ally you control to activate an ability.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Mitstreiter"},{"name":"Collect Evidence","cat":"Keyword Action","cr":"701.59","crtitle":"Collect Evidence","crshort":"To \"collect evidence N\" means to exile any number of cards from your graveyard with total mana value N or greater.","reminder":"Collect evidence N (Exile cards with total mana value N or greater from your graveyard.)","beginner":"Exile cards from your graveyard that add up to N or more mana value.","desc":"Exile cards from your graveyard with total mana value N or greater.","crfull":"701.59a To \"collect evidence N\" means to exile any number of cards from your graveyard with total mana value N or greater.\n701.59b If a player is given the choice to collect evidence but is unable to exile cards with total mana value N or greater from their graveyard (usually because there aren't enough cards to do so) they can't choose to collect evidence.\n701.59c A spell that has an ability that allows a player to collect evidence as an additional cost to cast it may have another ability that refers to whether evidence was collected. These abilities are linked. See rule 607, \"Linked Abilities.\"","de":"Beweissicherung"},{"name":"Color Identity","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A set of colors that determines what cards may be included in a deck for the Commander casual variant. See rule 903.4.","reminder":"A card's color identity is its color plus the colors of any mana symbols in its rules text. Every card in a Commander deck must be within the commander's color identity.","beginner":"In Commander, a card is only legal if all its mana symbols  -  including ones in the rules text  -  match your commander's colors.","desc":"Commander/EDH deckbuilding rule. Color identity = the card's colors plus colors of mana symbols in its rules text and any colors from color indicators. Applies in all zones, including lands.","crfull":"A set of colors that determines what cards may be included in a deck for the Commander casual variant. See rule 903.4.","de":"Farbidentität"},{"name":"Command","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"A zone for certain specialized objects that have an overarching effect on the game, yet are not permanents and cannot be destroyed. See rule 408, \"Command.\"","reminder":"Command (Choose two or more modes, as specified on the card.)","beginner":"Modal spells that let you choose multiple effects.","desc":"Choose multiple modes for a spell.","crfull":"A zone for certain specialized objects that have an overarching effect on the game, yet are not permanents and cannot be destroyed. See rule 408, \"Command.\"","de":""},{"name":"Commander","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"1. A casual variant in which each deck is led by a legendary card (usually a creature). See rule 903, \"Commander.\" 2. A designation given to one legendary card in each player's deck in the Commander casual variant.","reminder":"A commander is a legendary creature you designate before the game. It starts in the command zone and may be cast from there for an extra {2} each time it has been cast from there before.","beginner":"Your signature legendary creature. It starts outside your deck and you can always recast it, but each recast costs {2} more.","desc":"Commander/EDH format. A designated legendary creature (or other card allowed to be a commander) starting in the command zone. Commander tax: +{2} per previous cast from the command zone. It may return to the command zone instead of changing zones.","crfull":"1. A casual variant in which each deck is led by a legendary card (usually a creature). See rule 903, \"Commander.\" 2. A designation given to one legendary card in each player's deck in the Commander casual variant.","de":"Kommandeur"},{"name":"Commander Damage","cat":"Rules Term","cr":"903","crtitle":"","crshort":"In the Commander variant, a variant created and popularized by fans, each deck is led by a legendary creature designated as that deck's commander. The Commander variant uses all the normal rules for a Magic game, with the following additions.","reminder":"A player who has been dealt 21 or more combat damage by the same commander over the course of the game loses the game.","beginner":"Take 21 combat damage from one single commander and you lose, no matter how much life you have.","desc":"Commander/EDH state-based action. Tracked per commander per player. Only combat damage counts; noncombat damage does not.","crfull":"903.1. In the Commander variant, a variant created and popularized by fans, each deck is led by a legendary creature designated as that deck's commander. The Commander variant uses all the normal rules for a Magic game, with the following additions.\n903.2. A Commander game may be a two-player game or a multiplayer game. The default multiplayer setup is the Free-for-All variant with the attack multiple players option and without the limited range of influence option. See rule 806, \"Free-for-All Variant.\"\n903.3. Each deck has a legendary card designated as its commander. That card must be either (a) a creature card, (b) a Vehicle card, or (c) a Spacecraft card with one or more power/toughness boxes. This designation is not a characteristic of the object represented by the card; rather, it is an attribute of the card itself. The card retains this designation even when it changes zones.\n903.3a Some cards have an ability that states the card can be your commander. This ability modifies the rules for deck construction, and it functions before the game begins. See also rule 113.6n.\n903.3b If a player's commander is a meld card and it's melded with the other member of its meld pair, the resulting melded permanent is that player's commander.\n903.3c If a player's commander is a component of a merged permanent, the resulting merged permanent is that player's commander.\n903.3d If an effect refers to controlling a commander, it refers to a permanent on the battlefield that is a commander. If an effect refers to casting a commander, it refers to a spell that is a commander. If an effect refers to a commander in a specific zone, it refers to a card in that zone that is a commander.\n903.3e If an effect refers to a characteristic of \"your commander,\" it can find the appropriate player's commander and see its current characteristics, as modified by continuous effects and other rules, in all zones, including that player's library and hand.\n903.4. The Commander variant uses color identity to determine what cards can be in a deck with a certain commander. The color identity of a card is the color or colors of any mana symbols in that card's mana cost or rules text, plus any colors defined by its characteristic-defining abilities (see rule 604.3) or color indicator (see rule 204).\n903.4a Color identity is established before the game begins. If a rule or effect refers to the color identity of an object in the game represented by a card, it uses the color identity established for that card as the game began.\n903.4b If a commander has a static ability that causes a player to choose its color before the game begins, that choice applies during deck construction and throughout the game, even as the commander changes zones. That choice affects the commander's color identity. The player reveals that choice as they put their commander into the command zone before the game begins. See rules 103.2c and 607.2p.\n903.4c Reminder text is ignored when determining a card's color identity. See rule 207.2.\n903.4d The back face of a double-faced card (see rule 712) is included when determining a card's color identity. This is an exception to rule 712.8a.\n903.4e If a card has any alternative characteristics, such as those of adventurer cards (see rule 715, \"Adventurer Cards\"), those characteristics are included when determining the card's color identity.\n903.4f If an ability refers to the colors or number of colors in a commander's color identity, that quality is undefined if that player doesn't have a commander. That part of the ability won't do anything. Costs that refer to that quality are unpayable.\n903.5. Each Commander deck is subject to the following deck construction rules.\n903.5a Each deck must contain exactly 100 cards, including its commander. In other words, the minimum deck size and the maximum deck size are both 100.\n903.5b Other than basic lands, each card in a Commander deck must have a different English name. For the purposes of deck construction, cards with interchangeable names have the same English name (see rule 201.3).\n903.5c A card can be included in a Commander deck only if every color in its color identity is also found in the color identity of the deck's commander.\n903.5d A card with a basic land type may be included in a Commander deck only if each color of mana it could produce is included in the commander's color identity.\n903.5e Commander games do not use sideboards.\n903.6. At the start of the game, each player puts their commander from their deck face up into the command zone. Then each player shuffles the remaining cards of their deck so that the cards are in a random order. Those cards become the player's library.\n903.7. Once the starting player has been determined, each player sets their life total to 40 and draws a hand of seven cards.\n903.8. A player may cast a commander they own from the command zone. A commander cast from the command zone costs an additional {2} for each previous time the player casting it has cast it from the command zone that game. This additional cost is informally known as the \"commander tax.\"\n903.9. A commander may return to the command zone during a Commander game.\n903.9a If a commander is in a graveyard or in exile and that object was put into that zone since the last time state-based actions were checked, its owner may put it into the command zone. This is a state-based action. See rule 704.\n903.9b If a commander would be put into its owner's hand or library from anywhere, its owner may put it into the command zone instead. This replacement effect may apply more than once to the same event. This is an exception to rule 614.5.\n903.9c If a commander is a melded permanent or a merged permanent and its owner chooses to put it into the command zone using the replacement effect described in rule 903.9b, that permanent and each component representing it that isn't a commander are put into the appropriate zone, and the card that represents it and is a commander is put into the command zone.\n903.10. The Commander variant includes the following specification for winning and losing the game. All other rules for ending the game also apply. (See rule 104.)","de":"Kommandeurschaden"},{"name":"Commander Ninjutsu","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"A variant of the ninjutsu ability. See rule 702.49, \"Ninjutsu.\"","reminder":"Commander ninjutsu [cost] ([Cost], Return an unblocked attacker you control to hand: Put this card onto the battlefield from your hand or the command zone tapped and attacking.)","beginner":"Like Ninjutsu, but you may also do it straight from the command zone.","desc":"Ninjutsu variant that also works from the command zone. Swap an unblocked attacker for this card, tapped and attacking.","crfull":"A variant of the ninjutsu ability. See rule 702.49, \"Ninjutsu.\"","de":"Kommandeur-Ninjutsu"},{"name":"Commit A Crime","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"Commit a crime (Target an opponent, anything an opponent controls, or a card in an opponent's graveyard.)","beginner":"Targeting any of your opponent's stuff counts as committing a crime.","desc":"Target opponent, a spell/ability they control, or card in their graveyard.","crfull":"","de":"Verbrechen begehen"},{"name":"Companion","cat":"Keyword Ability","cr":"702.139","crtitle":"Companion","crshort":"Companion is a keyword ability that functions outside the game. It's written as \"Companion-[Condition].\" Before the game begins, you may reveal one card you own from outside the game with a companion ability whose condition is fulfilled by your starting deck.","reminder":"Companion  -  [Condition] (If this card is your chosen companion, you may put it into your hand from outside the game for {3} as a sorcery.)","beginner":"If your deck meets the requirement, start with this in your sideboard and pay 3 to put it in hand.","desc":"If deck meets condition, reveal from sideboard. Pay {3} to put into hand.","crfull":"702.139a Companion is a keyword ability that functions outside the game. It's written as \"Companion-[Condition].\" Before the game begins, you may reveal one card you own from outside the game with a companion ability whose condition is fulfilled by your starting deck. (See rule 103.2b.) Once during the game, any time you have priority and the stack is empty, but only during a main phase of your turn, you may pay {3} and put that card into your hand. This is a special action that doesn't use the stack (see rule 116.2g). This is a change from previous rules.\n702.139b If a companion ability refers to your starting deck, it refers to your deck after you've set aside any sideboard cards. In a Commander game, this is also before you've set aside your commander.\n702.139c Once you take the special action and put the card with companion into your hand, it remains in the game until the game ends.\n702.139d Cards can enter Commander games from outside the game via the companion special action.","de":"Gefährte"},{"name":"Compleated","cat":"Keyword Ability","cr":"702.150","crtitle":"Compleated","crshort":"Compleated is a static ability found on some planeswalker cards. Compleated means \"If this permanent would enter with one or more loyalty counters on it and the player who cast it chose to pay life for any part of its cost represented by Phyrexian mana symbols...","reminder":"Compleated ([Phyrexian mana symbol] can be paid with either colored mana or 2 life. If life was paid, this planeswalker enters with two fewer loyalty counters.)","beginner":"Pay life instead of colored mana, but the planeswalker enters with 2 fewer loyalty.","desc":"Pay 2 life for Phyrexian mana. If you do, enters with two fewer loyalty counters.","crfull":"702.150a Compleated is a static ability found on some planeswalker cards. Compleated means \"If this permanent would enter with one or more loyalty counters on it and the player who cast it chose to pay life for any part of its cost represented by Phyrexian mana symbols, it instead enters the battlefield with that many loyalty counters minus two for each of those mana symbols.\"","de":"Vollendet"},{"name":"Conjure","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To conjure a card, create a card that's a copy of the named card in the specified zone.","beginner":"A digital-only (Alchemy) mechanic that makes a brand-new card out of nowhere  -  not from your deck.","desc":"Alchemy / digital-only. Create a new card that's a copy of the named card, put into the specified zone. The card does not come from any existing zone.","crfull":"","de":""},{"name":"Connive","cat":"Keyword Action","cr":"701.50","crtitle":"Connive","crshort":"Certain spells and abilities instruct a permanent to connive. To do so, that permanent's controller draws a card, then discards a card. If a nonland card is discarded this way, that player puts a +1/+1 counter on the conniving permanent.","reminder":"Connive (Draw a card, then discard a card. If you discarded a nonland card, put a +1/+1 counter on this creature.)","beginner":"Draw then discard - if you discarded a nonland, get a +1/+1 counter.","desc":"Draw, then discard. If nonland discarded, put +1/+1 counter on this creature.","crfull":"701.50a Certain spells and abilities instruct a permanent to connive. To do so, that permanent's controller draws a card, then discards a card. If a nonland card is discarded this way, that player puts a +1/+1 counter on the conniving permanent.\n701.50b If a permanent is no longer on the battlefield as an effect instructs it to connive, its last known information is used to determine which object connived and who controlled it.\n701.50c If multiple permanents are instructed to connive at the same time, the first player in APNAP order who controls (or, in the case of a permanent no longer on the battlefield, last controlled; see rule 701.50b) one or more of those permanents chooses one of them and it connives. Then this process is repeated for each remaining instruction to connive.\n701.50d Connive N is a variant of connive. To have a permanent connive N, the permanent's controller draws N cards, discards N cards, then puts a number of +1/+1 counters on the permanent equal to the number of nonland cards discarded this way.\n701.50e If a permanent would connive 0, no connive event occurs. Abilities that trigger whenever a permanent connives won't trigger.\n701.50f A permanent \"connives\" after the process described in either rule 701.50a or 701.50d is complete, even if some or all of those actions were impossible.","de":"Intrigieren"},{"name":"Conspire","cat":"Keyword Ability","cr":"702.78","crtitle":"Conspire","crshort":"Conspire is a keyword that represents two abilities. The first is a static ability that functions while the spell with conspire is on the stack. The second is a triggered ability that functions while the spell with conspire is on the stack.","reminder":"Conspire (As you cast this spell, you may tap two untapped creatures you control that share a color with it. When you do, copy it.)","beginner":"Tap two creatures that share a color with this spell to copy it.","desc":"Tap two untapped creatures you control that share a color with this spell to copy it.","crfull":"702.78a Conspire is a keyword that represents two abilities. The first is a static ability that functions while the spell with conspire is on the stack. The second is a triggered ability that functions while the spell with conspire is on the stack. \"Conspire\" means \"As an additional cost to cast this spell, you may tap two untapped creatures you control that each share a color with it\" and \"When you cast this spell, if its conspire cost was paid, copy it. If the spell has any targets, you may choose new targets for the copy.\" Paying a spell's conspire cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.78b If a spell has multiple instances of conspire, each is paid separately and triggers based on its own payment, not any other instance of conspire.","de":"Verschwören"},{"name":"Constellation","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Constellation  -  Whenever an enchantment enters the battlefield under your control, [effect].","beginner":"Triggers when you play an enchantment.","desc":"Trigger whenever an enchantment enters the battlefield under your control.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8 ert a permanent that isn't represented by a double-faced token or a double-faced card, nothing happens.\n701.28d If a spell or ability instructs a player to convert a permanent, and the face that permanent would convert into is an instant or sorcery face, nothing happens.\n701.28e If an activated or triggered ability of a permanent that isn't a delayed triggered ability of that permanent tries to convert it, the permanent does so only if it hasn't converted or transformed since the ability was put onto the stack. If a delayed triggered ability of a permanent tries to convert that permanent, the permanent does so only if it hasn't converted or transformed since that delayed triggered ability was created. In both cases, if the permanent has already transformed or converted, an instruction to do either is ignored.\n701.28f If a spell or ability states that a permanent can't transform, that permanent also can't convert.","de":""},{"name":"Convoke","cat":"Keyword Ability","cr":"702.51","crtitle":"Convoke","crshort":"Convoke is a static ability that functions while the spell with convoke is on the stack. \"Convoke\" means \"For each colored mana in this spell's total cost, you may tap an untapped creature of that color you control rather than pay that mana.","reminder":"Convoke (Your creatures can help cast this spell. Each creature you tap while casting this spell pays for {1} or one mana of that creature's color.)","beginner":"Tap your creatures to help pay for this spell - each one counts as one mana.","desc":"Your creatures can help cast this spell. Each creature taps for 1 mana of its color or generic.","crfull":"702.51a Convoke is a static ability that functions while the spell with convoke is on the stack. \"Convoke\" means \"For each colored mana in this spell's total cost, you may tap an untapped creature of that color you control rather than pay that mana. For each generic mana in this spell's total cost, you may tap an untapped creature you control rather than  symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Dilemma des Konzils"},{"name":"Counter (noun)","cat":"Rules Term","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"A marker placed on an object or player.","beginner":"A physical marker (like a die or bead) placed on cards or players to track various effects.","desc":"A marker placed on an object (e.g., +1/+1, charge, loyalty).","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Marke"},{"name":"Counter (verb)","cat":"Keyword Action","cr":"701.6","crtitle":"Counter","crshort":"To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur. A countered spell is put into its owner's graveyard.","reminder":"To counter a spell or ability means to cancel it and remove it from the stack.","beginner":"Cancel a spell or ability so it doesn't resolve and has no effect.","desc":"Cancel a spell or ability so it has no effect. Remove it from the stack.","crfull":"701.6a To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur. A countered spell is put into its owner's graveyard.\n701.6b The player who cast a countered spell or activated a countered ability doesn't get a \"refund\" of any costs that were paid.","de":"Neutralisieren"},{"name":"Coven","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Coven  -  [Effect] if you control three or more creatures with different powers.","beginner":"Active when you control three or more creatures that each have different power values.","desc":"Ability word. Trigger when you control three or more creatures with different powers.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Hexenzirkel"},{"name":"Covercast","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Covercast  -  Whenever you cast another spell, if a condition on mana spent is met, [effect].","beginner":"A digital-only (Alchemy) trigger that fires when you cast a spell meeting a mana condition.","desc":"Ability word (Alchemy: Secrets of Strixhaven, digital-only). Triggers on casting another spell when a stated mana-spent condition is met; often intensifies the card.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":""},{"name":"Craft With...","cat":"Keyword Ability","cr":"702.167","crtitle":"Craft","crshort":"Craft represents an activated ability. It is written as \"Craft with [materials] [cost],\" where [materials] is a description of one or more objects.","reminder":"Craft with [materials] [cost] (Exile this artifact, exile [materials] from among permanents you control and/or cards in your graveyard: Return this card transformed under its owner's control. Craft only as a sorcery.)","beginner":"Exile this and other specified materials to flip it into a more powerful transformed version.","desc":"Exile specified materials from play/grave to return this card transformed.","crfull":"702.167a Craft represents an activated ability. It is written as \"Craft with [materials] [cost],\" where [materials] is a description of one or more objects. It means \"[Cost], Exile this permanent, Exile [materials] from among permanents you control and/or cards in your graveyard: Return this card to the battlefield transformed under its owner's control. Activate only as a sorcery.\"\n702.167b If an object in the [materials] of a craft ability is described using only a card type or subtype without the word \"card,\" it refers to either a permanent on the battlefield that is that type or subtype or a card in a graveyard that is that type or subtype. This is an exception to rule 109.2.\n702.167c An ability of a permanent may refer to the exiled cards used to craft it. This refers to cards in exile that were exiled to pay the activation cost of the craft ability that put this permanent onto the battlefield.","de":"Anfertigung"},{"name":"Create","cat":"Keyword Action","cr":"701.7","crtitle":"Create","crshort":"To create one or more tokens with certain characteristics, put the specified number of tokens with the specified characteristics onto the battlefield.","reminder":"To create a token, put it onto the battlefield.","beginner":"Make a token and put it onto the battlefield.","desc":"Put a token onto the battlefield.","crfull":"701.7a To create one or more tokens with certain characteristics, put the specified number of tokens with the specified characteristics onto the battlefield.\n701.7b If a replacement effect applies to a token being created, that effect applies before considering any continuous effects that will modify the characteristics of that token. If a replacement effect applies to a token entering the battlefield, that effect applies after considering any continuous effects that will modify the characteristics of that token.\n701.7c Previously, an effect that created tokens instructed a player to \"put [those tokens] onto the battlefield.\" Cards that were printed with that text have received errata in the Oracle card reference so they now \"create\" those tokens.","de":"Erzeugen"},{"name":"Crew","cat":"Keyword Ability","cr":"702.122","crtitle":"Crew","crshort":"Crew is an activated ability of Vehicle cards. \"Crew N\" means \"Tap any number of other untapped creatures you control with total power N or greater: This permanent becomes an artifact creature until end of turn.\"","reminder":"Crew N (Tap any number of creatures you control with total power N or more: This Vehicle becomes an artifact creature until end of turn.)","beginner":"Tap creatures with enough total power to turn this Vehicle into a creature for the turn.","desc":"Tap any number of creatures with total power N or more: This Vehicle becomes an artifact creature.","crfull":"702.122a Crew is an activated ability of Vehicle cards. \"Crew N\" means \"Tap any number of other untapped creatures you control with total power N or greater: This permanent becomes an artifact creature until end of turn.\"\n702.122b A creature \"crews a Vehicle\" when it's tapped to pay the cost to activate a Vehicle's crew ability.\n702.122c A Vehicle is \"crewed by\" a creature if that creature was tapped to pay the cost to activate that Vehicle's crew ability.\n702.122d If an effect states that a creature \"can't crew Vehicles,\" that creature can't be tapped to pay the crew cost of a Vehicle.\n702.122e Some Vehicles have abilities that trigger when they become crewed. \"Whenever [this Vehicle] becomes crewed\" means \"Whenever a crew ability of [this Vehicle] resolves.\" If that ability has an intervening \"if\" clause that refers to information about the creatures that crewed it, it means only creatures that were tapped to pay the cost of the crew ability that caused it to trigger.","de":"Bemannen"},{"name":"Cumulative Upkeep","cat":"Keyword Ability","cr":"702.24","crtitle":"Cumulative Upkeep","crshort":"Cumulative upkeep is a triggered ability that imposes an increasing cost on a permanent. \"Cumulative upkeep [cost]\" means \"At the beginning of your upkeep, if this permanent is on the battlefield, put an age counter on this permanent.","reminder":"Cumulative upkeep [cost] (At the beginning of your upkeep, put an age counter on this permanent, then sacrifice it unless you pay its upkeep cost for each age counter on it.)","beginner":"Each turn, pay an increasing cost (once for each age counter) or sacrifice this permanent.","desc":"At beginning of upkeep, put an age counter on this, then sacrifice unless you pay cost for each counter.","crfull":"702.24a Cumulative upkeep is a triggered ability that imposes an increasing cost on a permanent. \"Cumulative upkeep [cost]\" means \"At the beginning of your upkeep, if this permanent is on the battlefield, put an age counter on this permanent. Then you may pay [cost] for each age counter on it. If you don't, sacrifice it.\" If [cost] has choices associated with it, each choice is made separately for each age counter, then either the entire set of costs is paid, or none of them is paid. Partial payments aren't allowed.\n702.24b If a permanent has multiple instances of cumulative upkeep, each triggers separately. However, the age counters are not connected to any particular ability; each cumulative upkeep ability will count the total number of age counters on the permanent at the time that ability resolves.","de":"Kumulative Versorgung"},{"name":"Cycling","cat":"Keyword Ability","cr":"702.29","crtitle":"Cycling","crshort":"Cycling is an activated ability that functions only while the card with cycling is in a player's hand. \"Cycling [cost]\" means \"[Cost], Discard this card: Draw a card.\"","reminder":"Cycling [cost] (Discard this card: Draw a card.)","beginner":"Discard this card to draw another card.","desc":"{Cost}, Discard this card: Draw a card.","crfull":"702.29a Cycling is an activated ability that functions only while the card with cycling is in a player's hand. \"Cycling [cost]\" means \"[Cost], Discard this card: Draw a card.\"\n702.29b Although the cycling ability can be activated only if the card is in a player's hand, it continues to exist while the object is on the battlefield and in all other zones. Therefore objects with cycling will be affected by effects that depend on objects having one or more activated abilities.\n702.29c Some cards with cycling have abilities that trigger when they're cycled. \"When you cycle this card\" means \"When you discard this card to pay an activation cost of a cycling ability.\" These abilities trigger from whatever zone the card winds up in after it's cycled.\n702.29d Some cards have abilities that trigger whenever a player \"cycles or discards\" a card. These abilities trigger only once when a card is cycled.\n702.29e Typecycling is a variant of the cycling ability. \"[Type]cycling [cost]\" means \"[Cost], Discard this card: Search your library for a [type] card, reveal it, and put it into your hand. Then shuffle your library.\" This type is usually a subtype (as in \"mountaincycling\") but can be any card type, subtype, supertype, or combination thereof (as in \"basic landcycling\").\n702.29f Typecycling abilities are cycling abilities, and typecycling costs are cycling costs. Any cards that trigger when a player cycles a card will trigger when a card is discarded to pay an activation cost of a typecycling ability. Any effect that stops players from cycling cards will stop players from activating cards' typecycling abilities. Any effect that increases or reduces a cycling cost will increase or reduce a typecycling cost. Any effect that looks for a card with cycling will find a card with typecycling.","de":"Umwandlung"},{"name":"Dash","cat":"Keyword Ability","cr":"702.109","crtitle":"Dash","crshort":"Dash represents three abilities: two static abilities that function while the card with dash is on the stack, one of which may create a delayed triggered ability, and a static ability that functions while the object with dash is on the battlefield.","reminder":"Dash [cost] (You may cast this spell for its dash cost. It gains haste and returns to your hand at the beginning of your end step.)","beginner":"Pay the dash cost to cast this creature with haste, then it returns to your hand at end of turn.","desc":"Cast for Dash cost. It gains haste and returns to hand at beginning of end step.","crfull":"702.109a Dash represents three abilities: two static abilities that function while the card with dash is on the stack, one of which may create a delayed triggered ability, and a static ability that functions while the object with dash is on the battlefield. \"Dash [cost]\" means \"You may cast this card by paying [cost] rather than its mana cost,\" \"If this spell's dash cost was paid, return the permanent this spell becomes to its owner's hand at the beginning of the next end step,\" and \"As long as this permanent's dash cost was paid, it has haste.\" Casting a spell for its dash cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Sturmangriff"},{"name":"Daunt","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Daunt (This creature can't be blocked by creatures with power 2 or less.)","beginner":"Creatures with 2 or less power can't block this.","desc":"Can't be blocked by creatures with power 2 or less.","crfull":"","de":""},{"name":"Daybound / Nightbound","cat":"Keyword Ability","cr":"702.145","crtitle":"Daybound and Nightbound","crshort":"Daybound and nightbound are found on opposite faces of some double-faced cards (see rule 712, \"Double-Faced Cards\"). Daybound is found on the front faces of some double-faced cards and represents three static abilities.","reminder":"If a player casts no spells during their turn, it becomes night. If a player casts two or more spells during their turn, it becomes day.","beginner":"Day/night changes based on spell count - affects when daybound/nightbound cards transform.","desc":"Permanents transform based on whether a player cast no spells (Night) or two spells (Day) last turn.","crfull":"702.145a Daybound and nightbound are found on opposite faces of some double-faced cards (see rule 712, \"Double-Faced Cards\").\n702.145b Daybound is found on the front faces of some double-faced cards and represents three static abilities. \"Daybound\" means \"If it is night and this permanent is represented by a double-faced card, it enters transformed,\" \"As it becomes night, if this permanent is front face up, transform it,\" and \"This permanent can't transform except due to its daybound ability.\" See rule 731, \"Day and Night.\"\n702.145c Any time a player controls a permanent that is front face up with daybound and it's night, that player transforms that permanent. This happens immediately and isn't a state-based action.\n702.145d Any time a player controls a permanent with daybound, if it's neither day nor night, it becomes day.\n702.145e Nightbound is found on the back faces of some double-faced cards and represents two static abilities. \"Nightbound\" means \"As it becomes day, if this permanent is back face up, transform it\" and \"This permanent can't transform except due to its nightbound ability.\"\n702.145f Any time a player controls a permanent that is back face up with nightbound and it's day, that player transforms that permanent. This happens immediately and isn't a state-based action.\n702.145g Any time a player controls a permanent with nightbound, if it's neither day nor night and there are no permanents with daybound on the battlefield, it becomes night.","de":"Tagaktiv; Nachtaktiv"},{"name":"Deathtouch","cat":"Keyword Ability","cr":"702.2","crtitle":"Deathtouch","crshort":"Deathtouch is a static ability. A creature with toughness greater than 0 that's been dealt damage by a source with deathtouch since the last time state-based actions were checked is destroyed as a state-based action. See rule 704.","reminder":"Deathtouch (Any amount of damage this deals to a creature is enough to destroy it.)","beginner":"Even just 1 damage from this creature will destroy any creature it damages.","desc":"Any amount of damage this deals to a creature is enough to destroy it.","crfull":"702.2a Deathtouch is a static ability.\n702.2b A creature with toughness greater than 0 that's been dealt damage by a source with deathtouch since the last time state-based actions were checked is destroyed as a state-based action. See rule 704.\n702.2c Any nonzero amount of combat damage assigned to a creature by a source with deathtouch is considered to be lethal damage for the purposes of determining if excess damage is being dealt.\n702.2d The deathtouch rules function no matter what zone an object with deathtouch deals damage from.\n702.2e If an object is no longer in the zone it's expected to be in as an effect causes it to deal damage, its last known information is used to determine whether it had deathtouch.\n702.2f Multiple instances of deathtouch on the same object are redundant.","de":"Todesberührung"},{"name":"Decayed","cat":"Keyword Ability","cr":"702.147","crtitle":"Decayed","crshort":"Decayed represents a static ability and a triggered ability. \"Decayed\" means \"This creature can't block\" and \"When this creature attacks, sacrifice it at end of combat.\"","reminder":"Decayed (This creature can't block. When it attacks, sacrifice it at end of combat.)","beginner":"This creature can only attack once before being sacrificed, and it can't block.","desc":"This creature can't block. When it attacks, sacrifice it at end of combat.","crfull":"702.147a Decayed represents a static ability and a triggered ability. \"Decayed\" means \"This creature can't block\" and \"When this creature attacks, sacrifice it at end of combat.\"","de":"Verwesung"},{"name":"Defender","cat":"Keyword Ability","cr":"702.3","crtitle":"Defender","crshort":"Defender is a static ability. A creature with defender can't attack. Multiple instances of defender on the same creature are redundant.","reminder":"Defender (This creature can't attack.)","beginner":"This creature can only block, it cannot attack.","desc":"This creature cannot attack.","crfull":"702.3a Defender is a static ability.\n702.3b A creature with defender can't attack.\n702.3c Multiple instances of defender on the same creature are redundant.","de":"Verteidiger"},{"name":"Delirium","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Delirium  -  [Effect] if there are four o hoose new targets for that copy.\"","reminder":"Demonstrate (When you cast this spell, you may copy it. If you do, choose an opponent to also copy it. They may choose new targets for their copy.)","beginner":"Copy this spell - if you do, an opponent also gets to copy it.","desc":"When you cast, you may copy it. If you do, an opponent copies it too.","crfull":"702.144a Demonstrate is a triggered ability. \"Demonstrate\" means \"When you cast this spell, you may copy it and you may choose new targets for the copy. If you copy the spell, choose an opponent. That player copies the spell and may choose new targets for that copy.\"","de":"Demonstrieren"},{"name":"Descend","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Descend (You descended this turn if a permanent card was put into your graveyard from anywhere.)","beginner":"Active if a permanent went to your graveyard from anywhere this turn.","desc":"You descended if a permanent card was put into your graveyard from anywhere.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus ard.","desc":"Move permanent from battlefield to graveyard.","crfull":"701.8a To destroy a permanent, move it from the battlefield to its owner's graveyard.\n701.8b The only ways a permanent can be destroyed are as a result of an effect that uses the word \"destroy\" or as a result of the state-based actions that check for lethal damage (see rule 704.5g) or damage from a source with deathtouch (see rule 704.5h). If a permanent is put into its owner's graveyard for any other reason, it hasn't been \"destroyed.\"\n701.8c A regeneration effect replaces a destruction event. See rule 701.19, \"Regenerate.\"","de":"Zerstören"},{"name":"Detain","cat":"Keyword Action","cr":"701.35","crtitle":"Detain","crshort":"Certain spells and abilities can detain a permanent. Until the next turn of the controller of that spell or ability, that permanent can't attack or block and its activated abilities can't be activated.","reminder":"Detain (Until your next turn, that permanent can't attack or block and its activated abilities can't be activated.)","beginner":"Locks down a permanent until your next turn.","desc":"Target permanent can't attack, block, or activate abilities until your next turn.","crfull":"701.35a Certain spells and abilities can detain a permanent. Until the next turn of the controller of that spell or ability, that permanent can't attack or block and its activated abilities can't be activated.","de":"Inhaftieren"},{"name":"Dethrone","cat":"Keyword Ability","cr":"702.105","crtitle":"Dethrone","crshort":"Dethrone is a triggered ability. \"Dethrone\" means \"Whenever this creature attacks the player with the most life or tied for most life, put a +1/+1 counter on this creature.\" If a creature has multiple instances of dethrone, each triggers separately.","reminder":"Dethrone (Whenever this creature attacks the player with the most life or tied for most life, put a +1/+1 counter on it.)","beginner":"Gets a +1/+1 counter when attacking the life leader.","desc":"Whenever th you may sacrifice any number of creatures. This creature enters the battlefield with N +1/+1 counters on it for each of those creatures.)","beginner":"Sacrifice creatures as this enters to make it bigger.","desc":"As this enters, sacrifice any number of creatures. Gets N +1/+1 counters for each.","crfull":"702.82a Devour is a static ability. \"Devour N\" means \"As this object enters, you may sacrifice any number of creatures. This permanent enters with N +1/+1 counters on it for each creature sacrificed this way.\"\n702.82b Some objects have abilities that refer to the number of creatures the permanent devoured. \"It devoured\" means \"sacrificed as a result of its devour ability as it entered the battlefield.\"\n702.82c Devour [quality] is a variant of devour. \"Devour [quality] N\" means \"As this object enters, you may sacrifice any number of [quality] permanents. This permanent enters with N +1/+1 counters on it for each permanent sacrificed this way.\"","de":"Verschlingen"},{"name":"Disappear","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Disappear  -  [Effect] if a permanent left the battlefield under your control this turn.","beginner":"Triggers at end of turn if any of your permanents left play this turn (like Revolt, renamed for the TMNT set).","desc":"Ability word. Trigger at end of turn if a permanent you controlled left the battlefield this turn. (Introduced in Teenage Mutant Ninja Turtles 2026; functionally identical to Revolt.)","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Abgehauen"},{"name":"Discard","cat":"Keyword Action","cr":"701.9","crtitle":"Discard","crshort":"To discard a card, move it from its owner's hand to that player's graveyard.","reminder":"Discard (Put a card from your hand into your graveyard.)","beginner":"Move a card from your hand to the graveyard.","desc":"Take card from hand and put into graveyard.","crfull":"701.9a To discard a card, move it from its owner's hand to that player's graveyard.\n701.9b By default, effects that cause a player to discard a card allow the affected player to choose which card to discard. Some effects, however, require a random discard or allow another player to choose which card is discarded.\n701.9c If a card is discarded, but an effect causes it to be put into a hidden zone instead of into its owner's graveyard without being revealed, all values of that card's characteristics are considered to be undefined. If a card is discarded this way to pay a cost that specifies a characteristic about the discarded card, that cost payment is illegal; the game returns to the moment before the cost was paid (see rule 733, \"Handling Illegal Actions\").","de":"Abwerfen"},{"name":"Discover","cat":"Keyword Action","cr":"701.57","crtitle":"Discover","crshort":"\"Discover N\" means \"Exile cards from the top of your library until you exile a nonland card with mana value N or less. You may cast that card without paying its mana cost if the resulting spell's mana value is less than or equal to N.","reminder":"Discover N (Exile cards from the top of your library until you exile a nonland card with mana value N or less. Cast it without paying its mana cost or put it into your hand. Put the rest on the bottom in a random order.)","beginner":"Reveal cards until you find one with low enough cost, then cast it free or put it in hand.","desc":"Exile top cards until you find nonland with MV N or less. Cast free or put in hand.","crfull":"701.57a \"Discover N\" means \"Exile cards from the top of your library until you exile a nonland card with mana value N or less. You may cast that card without paying its mana cost if the resulting spell's mana value is less than or equal to N. If you don't cast it, put that card into your hand. Put the remaining exiled cards on the bottom of your library in a random order.\"\n701.57b A player has \"discovered\" after the process described in 701.57a is complete, even if some or all of those actions were impossible.\n701.57c If the final card exiled during the process described in rule 701.57a has mana value N or less, it is the \"discovered card,\" regardless of whether it was cast or put into a player's hand.","de":"Entdeckung"},{"name":"Disguise","cat":"Keyword Ability","cr":"702.168","crtitle":"Disguise","crshort":"Disguise is a static ability that functions in any zone from which you could play the card it's on, and the disguise effect works any time the card is face down.","reminder":"Disguise [cost] (You may cast this card face down for {3} as a 2/2 creature with ward {2}. Turn it face up any time for its disguise cost.)","beginner":"Play this face-down as a protected 2/2 creature for 3 mana, then flip it up later by paying its disguise cost.","desc":"Cast face down as 2/2 with Ward 2 for {3}. Turn face up for disguise cost.","crfull":"702.168a Disguise is a static ability that functions in any zone from which you could play the card it's on, and the disguise effect works any time the card is face down. \"Disguise [cost]\" means \"You may cast this card as a 2/2 face-down creature with ward {2}, no name, no subtypes, and no mana cost by paying {3} rather than paying its mana cost.\" (See rule 708, \"Face-Down Spells and Permanents.\")\n702.168b To cast a card using its disguise ability, turn the card face down and announce that you are using a disguise ability. It becomes a 2/2 face-down creature card with ward {2}, no name, no subtypes, and no mana cost. Any effects or prohibitions that would apply to casting a card with these characteristics (and not the face-up card's characteristics) are applied to casting this card. These values are the copiable values of that object's characteristics. (See rule 613, \"Interaction of Continuous Effects,\" and rule 707, \"Copying Objects.\") Put it onto the stack (as a face-down spell with the same characteristics), and pay {3} rather than pay its mana cost. This follows the rules for paying alternative costs. You can use a disguise ability to cast a card from any zone from which you could normally cast it. When the spell resolves, it enters the battlefield with the same characteristics the spell had. The disguise effect applies to the face-down object wherever it is, and it ends when the permanent is turned face up.\n702.168c You can't normally cast a card face down. A disguise ability allows you to do so.\n702.168d Any time you have priority, you may turn a face-down permanent you control with a disguise ability face up. This is a special action; it doesn't use the stack (see rule 116). To do this, show all players what the permanent's disguise cost would be if it were face up, pay that cost, then turn the permanent face up. (If the permanent wouldn't have a disguise cost if it were face up, it can't be turned face up this way.) The disguise effect on it ends, and it regains its normal characteristics. Any abilities relating to the permanent entering the battlefield don't trigger when it's turned face up and don't have any effect, because the permanent has already entered the battlefield.\n702.168e If a permanent's disguise cost includes X, other abilities of that permanent may also refer to X. The value of X in those abilities is equal to the value of X chosen as the disguise special action was taken.\n702.168f See rule 708, \"Face-Down Spells and Permanents,\" for more information about how to cast cards with a disguise ability.","de":"Verkleidung"},{"name":"Disturb","cat":"Keyword Ability","cr":"702.146","crtitle":"Disturb","crshort":"Disturb is an ability found on the front face of some double-faced cards (see rule 712, \"Double-Faced Cards\"). \"Disturb [cost]\" means \"You may cast this card transformed from your graveyard by paying [cost] rather than its mana cost.\" See rule 712.8c.","reminder":"Disturb [cost] (You may cast this card from your graveyard transformed for its disturb cost.)","beginner":"Cast this from your graveyard as its transformed back side by paying the disturb cost.","desc":"Cast this card from your graveyard transformed for its disturb cost.","crfull":"702.146a Disturb is an ability found on the front face of some double-faced cards (see rule 712, \"Double-Faced Cards\"). \"Disturb [cost]\" means \"You may cast this card transformed from your graveyard by paying [cost] rather than its mana cost.\" See rule 712.8c.\n702.146b A resolving double-faced spell that was cast using its disturb ability enters the battlefield with its back face up.","de":"Aufstören"},{"name":"Doctor's Companion","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"A partner ability that allows a player to play with two legendary creature cards as their commander if one of them has Doctor's companion and the other is a Time Lord Doctor with no other creature types.","reminder":"Doctor's companion (You can have two commanders if the other is the Doctor.)","beginner":"In Commander, this card can be your second commander alongside any Doctor creature.","desc":"Partner variant. You may have two commanders if the other one is a Time Lord Doctor. Pairs only with a Doctor.","crfull":"A partner ability that allows a player to play with two legendary creature cards as their commander if one of them has Doctor's companion and the other is a Time Lord Doctor with no other creature types.","de":"Begleiter des Doctors"},{"name":"Domain","cat":"Ability Word","cr":"207.
