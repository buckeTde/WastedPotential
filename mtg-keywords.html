r example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Domäne"},{"name":"Double","cat":"Keyword Action","cr":"701.10","crtitle":"Double","crshort":"Doubling a creature's power and/or toughness creates a continuous effect. This effect modifies that creature's power and/or toughness but doesn't set those characteristics to a specific value. See rule 613.4c.","reminder":"To double a quantity, multiply it by two.","beginner":"Multiply the specified quantity (tokens, counters, life, etc.) by two.","desc":"Multiply a quantity (tokens, counters, life) by two.","crfull":"701.10a Doubling a creature's power and/or toughness creates a continuous effect. This effect modifies that creature's power and/or toughness but doesn't set those characteristics to a specific value. See rule 613.4c.\n701.10b To double a creature's power, that creature gets +X/+0, where X is that creature's power as the spell or ability that doubles its power resolves. Similarly, an effect that doubles a creature's toughness gives it +0/+X, where X is that creature's toughness. Doubling a creature's power and toughness gives it +X/+Y, where X is its power and Y is its toughness.\n701.10c If a creature's power is less than 0 when it's doubled, doubling that creature's power instead means that the creature gets -X/-0, where X is the difference between 0 and its power. Similarly, if its toughness is less than 0 when doubled, it gets -0/-X. If one characteristic's value is negative but the other isn't when both are doubled, it gets -X/+Y or +X/-Y, as appropriate.\n701.10d To double a player's life total, the player gains or loses an amount of life such that their new life total is twice its current value.\n701.10e To double the number of a kind of counters on a player or permanent, give that player or permanent as many of those counters as that player or permanent already has.\n701.10f To double the amount of a type of mana in a player's mana pool, that player adds an amount of mana of that type equal to the amount they already have.\n701.10g To double an amount of damage a source would deal, that source instead deals twice that much damage. This is a replacement effect.","de":"Verdoppeln"},{"name":"Double Agenda","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"A variant of the hidden agenda ability. See rule 702.106, \"Hidden Agenda.\"","reminder":"Double agenda (Start the game with this conspiracy face down in the command zone and secretly choose two different card names. You may turn this conspiracy face up any time and reveal those names.)","beginner":"A Conspiracy draft mechanic: secretly name two cards before the game and reveal them whenever you like.","desc":"Conspiracy card mechanic. Begins face down in the command zone with two secretly chosen card names; may be turned face up at any time. Variant of Hidden Agenda.","crfull":"A variant of the hidden agenda ability. See rule 702.106, \"Hidden Agenda.\"","de":""},{"name":"Double Strike","cat":"Keyword Ability","cr":"702.4","crtitle":"Double Strike","crshort":"Double strike is a static ability that modifies the rules for the combat damage step. (See rule 510, \"Combat Damage Step.\")","reminder":"Double strike (This creature deals both first-strike and regular combat damage.)","beginner":"Deals combat damage twice - once with first strike and once normally.","desc":"Deals both first-strike and regular combat damage.","crfull":"702.4a Double strike is a static ability that modifies the rules for the combat damage step. (See rule 510, \"Combat Damage Step.\")\n702.4b If at least one attacking or blocking creature has first strike (see rule 702.7) or double strike as the combat damage step begins, the only creatures that assign combat damage in that step are those with first strike or double strike. After that step, instead of proceeding to the end of combat step, the phase gets a second combat damage step. The only creatures that assign combat damage in that step are the remaining attackers and blockers that had neither first strike nor double strike as the first combat damage step began, as well as the remaining attackers and blockers that currently have double strike. After that step, the phase proceeds to the end of combat step.\n702.4c Removing double strike from a creature during the first combat damage step will stop it from assigning combat damage in the second combat damage step.\n702.4d Giving double strike to a creature with first strike after it has already dealt combat damage in the first combat damage step will allow the creature to assign combat damage in the second combat damage step.\n702.4e Multiple instances of double strike on the same creature are redundant.","de":"Doppelschlag"},{"name":"Double Team","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Double team (When this creature attacks, if it's not a token, conjure a duplicate of this card into your hand. Then this creature perpetually loses double team.)","beginner":"A digital-only (Alchemy) mechanic: attacking once gives you a free copy of the card in hand.","desc":"Alchemy / digital-only. On attack, conjure a duplicate of the card into your hand; the attacker then perpetually loses double team.","crfull":"","de":""},{"name":"Draft from a Spellbook","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To draft a card from a spellbook, choose one of three cards taken at random from that card's associated spellbook list.","beginner":"A digital-only (Alchemy) mechanic: you're offered three cards from a fixed list and pick one.","desc":"Alchemy / digital-only. Three cards are drawn at random from the card's spellbook (a fixed list); you choose one.","crfull":"","de":""},{"name":"Dredge","cat":"Keyword Ability","cr":"702.52","crtitle":"Dredge","crshort":"Dredge is a static ability that functions only while the card with dredge is in a player's graveyard.","reminder":"Dredge N (If you would draw a card, you may mill N cards instead. If you do, return this card from your graveyard to your hand.)","beginner":"Instead of drawing, mill cards and return this from your graveyard to hand.","desc":"If you would draw, you may mill N cards and return this card from graveyard to hand instead.","crfull":"702.52a Dredge is a static ability that functions only while the card with dredge is in a player's graveyard. \"Dredge N\" means \"As long as you have at least N cards in your library, if you would draw a card, you may instead mill N cards and return this card from your graveyard to your hand.\"\n702.52b A player with fewer cards in their library than the number required by a dredge ability can't mill any of them this way.","de":"Ausgraben"},{"name":"Earthbend","cat":"Keyword Action","cr":"701.66","crtitle":"Earthbend","crshort":"\"Earthbend N\" means \"Target land you control becomes a 0/0 land creature with haste in addition to its other types. Put N +1/+1 counters on it. When that land dies or is put into exile, return it to the battlefield tapped under your control.\"","reminder":"Earthbend  -  Target land becomes a 0/0 creature with haste and counters. It's still a land. When it leaves the battlefield, return it to the battlefield tapped.","beginner":"Turn a land into a creature temporarily - comes back as a land when it leaves.","desc":"Target land becomes a 0/0 creature with haste and counters. Returns tapped if it leaves.","crfull":"701.66a \"Earthbend N\" means \"Target land you control becomes a 0/0 land creature with haste in addition to its other types. Put N +1/+1 counters on it. When that land dies or is put into exile, return it to the battlefield tapped under your control.\"\n701.66b An ability that triggers whenever a player earthbends triggers when the delayed triggered ability described in rule 701.66a is created.","de":"Erdbändigen"},{"name":"Echo","cat":"Keyword Ability","cr":"702.30","crtitle":"Echo","crshort":"Echo is a triggered ability. \"Echo [cost]\" means \"At the beginning of your upkeep, if this permanent came under your control since the beginning of your last upkeep, sacrifice it unless you pay [cost].\"","reminder":"Echo [cost] (At the beginning of your upkeep, if this came under your control since the beginning of your last upkeep, sacrifice it unless you pay its echo cost.)","beginner":"Pay again next turn or sacrifice it.","desc":"At the beginning of your next upkeep, sacrifice this unless you pay its echo cost.","crfull":"702.30a Echo is a triggered ability. \"Echo [cost]\" means \"At the beginning of your upkeep, if this permanent came under your control since the beginning of your last upkeep, sacrifice it unless you pay [cost].\"\n702.30b Urza block cards with the echo ability were printed without an echo cost. These cards have been given errata in the Oracle card reference; each one now has an echo cost equal to its mana cost.","de":"Echo"},{"name":"Eerie","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards tha s. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Unheimlich"},{"name":"Embalm","cat":"Keyword Ability","cr":"702.128","crtitle":"Embalm","crshort":"Embalm is an activated ability that functions while the card with embalm is in a graveyard.","reminder":"Embalm [cost] ([Cost], Exile this card from your graveyard: Create a token that's a copy of it, except it's a white Zombie in addition to its other types with no mana cost. Embalm only as a sorcery.)","beginner":"Exile this from your graveyard to create a white Zombie token copy.","desc":"{Cost}, Exile from graveyard: Create a token copy (white Zombie). Sorcery speed.","crfull":"702.128a Embalm is an activated ability that functions while the card with embalm is in a graveyard. \"Embalm [cost]\" means \"[Cost], Exile this card from your graveyard: Create a token that's a copy of this card, except it's white, it has no mana cost, and it's a Zombie in addition to its other types. Activate only as a sorcery.\"\n702.128b A token is \"embalmed\" if it's created by a resolving embalm ability.","de":"Einbalsamieren"},{"name":"Emerge","cat":"Keyword Ability","cr":"702.119","crtitle":"Emerge","crshort":"Emerge represents two static abilities that function while the spell with emerge is on the stack.","reminder":"Emerge [cost] (You may cast this spell by sacrificing a creature and paying the emerge cost reduced by that creature's mana value.)","beginner":"Sacrifice a creature to cast this cheaper - reduce cost by that creature's mana value.","desc":"You may cast this spell by sacrificing a creature and paying difference in mana costs.","crfull":"702.119a Emerge represents two static abilities that function while the spell with emerge is on the stack. \"Emerge [cost]\" means \"You may cast this spell by paying [cost] and sacrificing a creature rather than paying its mana cost\" and \"If you chose to pay this spell's emerge cost, its total cost is reduced by an amount of generic mana equal to the sacrificed creature's mana value.\" Casting a spell using its emerge ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.119b Emerge from [quality] is a variant of emerge. \"Emerge from [quality] [cost]\" means \"You may cast this spell by paying [cost] and sacrificing a [quality] permanent rather than paying its mana cost\" and \"If you pay this spell's emerge cost, its total cost is reduced by an amount of generic mana equal to the sacrificed permanent's mana value.\"\n702.119c You choose which permanent to sacrifice as you choose to pay a spell's emerge cost (see rule 601.2b), and you sacrifice that permanent as you pay the total cost (see rule 601.2h).","de":"Auftauchen"},{"name":"Eminence","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Eminence  -  [Effect] (This ability works from the command zone or the battlefield.)","beginner":"Commander ability that works even when it's in the command zone.","desc":"Commander ability active from the command zone or battlefield.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Eminenz"},{"name":"Enchant","cat":"Keyword Ability","cr":"702.5","crtitle":"Enchant","crshort":"Enchant is a static ability, written \"Enchant [object or player].\" The enchant ability restricts what an Aura spell can target and what an Aura can enchant. For more information about Auras, see rule 303, \"Enchantments.\"","reminder":"Enchant [quality] (Target a [quality] as you cast this. This card enters the battlefield attached to that [quality].)","beginner":"Specifies what this Aura can be attached to when you cast it.","desc":"Indicates what an Aura can be attached to (e.g., 'Enchant creature').","crfull":"702.5a Enchant is a static ability, written \"Enchant [object or player].\" The enchant ability restricts what an Aura spell can target and what an Aura can enchant.\n702.5b For more information about Auras, see rule 303, \"Enchantments.\"\n702.5c If an Aura has multiple instances of enchant, all of them apply. The Aura's target must follow the restrictions from all the instances of enchant. The Aura can enchant only objects or players that match all of its enchant abilities.\n702.5d Auras that can enchant a player can target and be attached to players. Such Auras can't target permanents and can't be attached to permanents.","de":"Verzaubern; Verzaubert"},{"name":"Encore","cat":"Keyword Ability","cr":"702.141","crtitle":"Encore","crshort":"Encore is an activated ability that functions while the card with encore is in a graveyard.","reminder":"Encore [cost] ([Cost], Exile this card from your graveyard: For each opponent, create a token copy that attacks that opponent this turn if able. They gain haste. Sacrifice them at the beginning of the next end step. Activate only as a sorcery.)","beginner":"Exile this from graveyard to create copies that attack each opponent, then get sacrificed.","desc":"{Cost}, Exile from graveyard: Create token copy for each opponent. Attack them. Sacrifice at end.","crfull":"702.141a Encore is an activated ability that functions while the card with encore is in a graveyard. \"Encore [cost]\" means \"[Cost], Exile this card from your graveyard: For each opponent, create a token that's a copy of this card that attacks that opponent this turn if able. The tokens gain haste. Sacrifice them at the beginning of the next end step. Activate only as a sorcery.\"","de":"Zugabe"},{"name":"Endure","cat":"Keyword Action","cr":"701.63","crtitle":"Endure","crshort":"Certain abilities instruct a permanent to endure N. To do so, that permanent's controller creates an N/N white Spirit creature token unless they put N +1/+1 counters on that permanent.","reminder":"Endure N (Put N +1/+1 counters on this creature or create an N/N white Spirit creature token.)","beginner":"Choose: make this creature bigger, or get a separate Spirit of that size.","desc":"Tarkir: Dragonstorm (2025). The controller chooses one of the two modes each time. Going wide with the Spirit token or going tall with the counters are both legal answers.","crfull":"701.63a Certain abilities instruct a permanent to endure N. To do so, that permanent's controller creates an N/N white Spirit creature token unless they put N +1/+1 counters on that permanent.\n701.63b If a permanent is instructed to endure 0, nothing happens. No counters are put on that permanent and no tokens are created.","de":"Überdauern"},{"name":"Energy","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Energy counters are a counter type on players, represented by {E}. You can spend energy counters to pay costs.","beginner":"Counters on you that can be spent to activate abilities.","desc":"Counter on player ({E}). Spend them to pay for costs of abilities.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Energie"},{"name":"Enlist","cat":"Keyword Ability","cr":"702.154","crtitle":"Enlist","crshort":"Enlist represents a static ability and a triggered ability. Enlist means \"As this creature attacks, you may tap up to one untapped creature you control that you didn't choose to attack with and that either has haste or has been under your control continuously...","reminder":"Enlist (As this creature attacks, you may tap a nonattacking creature you control without summoning sickness. When you do, add its power to this creature's until end of turn.)","beginner":"Tap a non-attacking creature to boost this attacker's power.","desc":"Tap a nonattacking creature to add its power to this attacking creature until end of turn.","crfull":"702.154a Enlist represents a static ability and a triggered ability. Enlist means \"As this creature attacks, you may tap up to one untapped creature you control that you didn't choose to attack with and that either has haste or has been under your control continuously since this turn began. When you do, this creature gets +X/+0 until end of turn, where X is the tapped creature's power.\"\n702.154b Enlist's static ability represents an optional cost to attack (see rule 508.1g). Its triggered ability is linked to that static ability (see rule 607.2h).\n702.154c A creature \"enlists\" another creature when you pay the cost of the creature's enlist ability by tapping the other creature. Note that it isn't possible for a creature to enlist itself.\n702.154d Multiple instances of enlist on a single creature function independently. The triggered ability represented by each instance of enlist triggers only once and only for the cost associated with that enlist ability.","de":"Abkommandieren"},{"name":"Enrage","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Enrage  -  Whenever this creature is dealt damage, [effect].","beginner":"Triggers when this creature takes any damage.","desc":"Trigger whenever this creature is dealt damage.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Erzürnen"},{"name":"Entwine","cat":"Keyword Ability","cr":"702.42","crtitle":"Entwine","crshort":"Entwine is a static ability of modal spells (see rule 700.2) that functions while the spell is on the stack. \"Entwine [cost]\" means \"You may choose all modes of this spell instead of just the number specified.","reminder":"Entwine [cost] (Choose both if you pay the entwine cost.)","beginner":"Pay extra to get both modes instead of choosing one.","desc":"Choose both modes if you pay the entwine cost.","crfull":"702.42a Entwine is a static ability of modal spells (see rule 700.2) that functions while the spell is on the stack. \"Entwine [cost]\" means \"You may choose all modes of this spell instead of just the number specified. If you do, you pay an additional [cost].\" Using the entwine ability follows the rules for choosing modes and paying additional costs in rules 601.2b and 601.2f-h.\n702.42b If the entwine cost was paid, follow the text of each of the modes in the order written on the card when the spell resolves.","de":"Verflechtung"},{"name":"Epic","cat":"Keyword Ability","cr":"702.50","crtitle":"Epic","crshort":"Epic represents two spell abilities, one of which creates a delayed triggered ability.","reminder":"Epic (For the rest of the game, you can't cast spells. At the beginning of each of your upkeeps, copy this spell except for its epic ability.)","beginner":"Cast this once and it copies itself every turn, but you can't cast any other spells.","desc":"Cast this spell. You can't cast spells for rest of game. Copy this at each upkeep.","crfull":"702.50a Epic represents two spell abilities, one of which creates a delayed triggered ability. \"Epic\" means \"For the rest of the game, you can't cast spells,\" and \"At the beginning of each of your upkeeps for the rest of the game, copy this spell except for its epic ability. If the spell has any targets, you may choose new targets for the copy.\" See rule 707.10.\n702.50b A player can't cast spells once a spell with epic they control resolves, but effects (such as the epic ability itself) can still put copies of spells onto the stack.","de":"Episch"},{"name":"Equip","cat":"Keyword Ability","cr":"702.6","crtitle":"Equip","crshort":"Equip is an activated ability of Equipment cards. \"Equip [cost]\" means \"[Cost]: Attach this permanent to target creature you control. Activate only as a sorcery.\" For more information about Equipment, see rule 301, \"Artifacts.\"","reminder":"Equip [cost] ([Cost]: Attach to target creature you control. Equip only as a sorcery.)","beginner":"Pay to attach this Equipment to one of your creatures.","desc":"{Cost}: Attach to target creature you control. Sorcery speed.","crfull":"702.6a Equip is an activated ability of Equipment cards. \"Equip [cost]\" means \"[Cost]: Attach this permanent to target creature you control. Activate only as a sorcery.\"\n702.6b For more information about Equipment, see rule 301, \"Artifacts.\"\n702.6c Equip abilities may further restrict what creatures may be chosen as legal targets. Such restrictions usually appear in the form \"Equip [quality]\" or \"Equip [quality] creature.\" These equip abilities may legally target only a creature that's controlled by the player activating the ability and that has the chosen quality. Additional restrictions for an equip ability don't restrict what the Equipment may be attached to.\n702.6d If a permanent has multiple equip abilities, any of its equip abilities may be activated.\n702.6e \"Equip planeswalker\" is a variant of the equip ability. \"Equip planeswalker [cost]\" means \"[Cost]: Attach this permanent to target planeswalker you control as though that planeswalker were a creature. Activate only as a sorcery.\"","de":"Ausrüsten"},{"name":"Equipment","cat":"Rules Term","cr":"301.5","crtitle":"","crshort":"Some artifacts have the subtype \"Equipment.\" An Equipment can be attached to a creature. It can't legally be attached to anything that isn't a creature.","reminder":"Equipment is an artifact subtype. Equipment can be attached to creatures using the equip ability and remains on the battlefield when the equipped creature leaves.","beginner":"Artifact that attaches to creatures - stays in play even if the creature dies.","desc":"Artifact subtype. Attached to a creature using Equip. Stays if creature leaves.","crfull":"301.5. Some artifacts have the subtype \"Equipment.\" An Equipment can be attached to a creature. It can't legally be attached to anything that isn't a creature.\n301.5a The creature an Equipment is attached to is called the \"equipped creature.\" The Equipment is attached to, or \"equips,\" that creature.\n301.5b Equipment spells are cast like other artifact spells. Equipment enter the battlefield like other artifacts. They don't enter the battlefield attached to a creature. The equip keyword ability attaches the Equipment to a creature you control (see rule 702.6, \"Equip\"). Control of the creature matters only when the equip ability is activated and when it resolves. Spells and other abilities may also attach an Equipment to a creature. If an effect attempts to attach an Equipment to an object that can't be equipped by it, the Equipment doesn't move.\n301.5c An Equipment that's also a creature can't equip a creature unless that Equipment has reconfigure (see rule 702.151, \"Reconfigure\"). An Equipment that loses the subtype \"Equipment\" can't equip a creature. An Equipment can't equip itself. An Equipment that equips an illegal or nonexistent permanent becomes unattached from that permanent but remains on the battlefield. (This is a state-based action. See rule 704.) An Equipment can't equip more than one creature. If a spell or ability would cause an Equipment to equip more than one creature, the Equipment's controller chooses which creature it equips.\n301.5d An Equipment's controller is separate from the equipped creature's controller; the two need not be the same. Changing control of the creature doesn't change control of the Equipment, and vice versa. Only the Equipment's controller can activate its abilities. However, if the Equipment grants an ability to the equipped creature (with \"gains\" or \"has\"), the equipped creature's controller is the only one who can activate that ability.\n301.5e If an effect attempts to put an Equipment that isn't also an Aura (see rule 303.4i) onto the battlefield attached to either an object it can't legally equip or an object that is undefined, the Equipment enters the battlefield unattached. If the Equipment is a token, it's created and enters the battlefield unattached.\n301.5f An ability of a permanent that refers to the \"equipped creature\" refers to whatever creature that permanent is attached to, even if the permanent with the ability isn't an Equipment.\n301.6. Some artifacts have the subtype \"Fortification.\" A Fortification can be attached to a land. It can't legally be attached to an object that isn't a land. Fortification's analog to the equip keyword ability is the fortify keyword ability. Rules 301.5a-f apply to Fortifications in relation to lands just as they apply to Equipment in relation to creatures, with one clarification relating to rule 301.5c: a Fortification that's also a creature (not a land) can't fortify a land. (See rule 702.67, \"Fortify.\")\n301.7. Some artifacts have the subtype \"Vehicle.\" Most Vehicles have a crew ability which allows them to become artifact creatures. See rule 702.122, \"Crew.\"\n301.7a Each Vehicle has a printed power and toughness, but it has these characteristics only if it's also a creature. See rule 208.3.\n301.7b If a Vehicle becomes a creature, it immediately has its printed power and toughness. Other effects, including the effect that makes it a creature, may modify these values or set them to different values.","de":"Ausrüstung"},{"name":"Escalate","cat":"Keyword Ability","cr":"702.120","crtitle":"Escalate","crshort":"Escalate is a static ability of modal spells (see rule 700.2) that functions while the spell with escalate is on the stack.","reminder":"Escalate [cost] (Pay this cost for each mode chosen beyond the first.)","beginner":"Pay extra for each additional mode you want to use.","desc":"Pay this cost for each mode chosen beyond the first.","crfull":"702.120a Escalate is a static ability of modal spells (see rule 700.2) that functions while the spell with escalate is on the stack. \"Escalate [cost]\" means \"For each mode you choose beyond the first as you cast this spell, you pay an additional [cost].\" Paying a spell's escalate cost follows the rules for paying additional costs in rules 601.2f-h.","de":"Eskalieren"},{"name":"Escape","cat":"Keyword Ability","cr":"702.138","crtitle":"Escape","crshort":"Escape represents a static ability that functions while the card with escape is in a player's graveyard.","reminder":"Escape - [cost], Exile [number] other cards from your graveyard. (You may cast this card from your graveyard for its escape cost.)","beginner":"Cast this from your graveyard by paying its mana cost plus exiling other cards from your graveyard.","desc":"Cast from graveyard by paying mana cost and exiling other cards from graveyard.","crfull":"702.138a Escape represents a static ability that functions while the card with escape is in a player's graveyard. \"Escape [cost]\" means \"You may cast this card from your graveyard by paying [cost] rather than paying its mana cost.\" Casting a spell using its escape ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.138b A spell or permanent \"escaped\" if that spell or the spell that became that permanent as it resolved was cast from a graveyard with an escape ability.\n702.138c An ability that reads \"[This permanent] escapes with [one or more of a kind of counter]\" means \"If this permanent escaped, it enters with [those counters]\" That ability may have a triggered ability linked to it that triggers \"When it enters this way.\" (See rule 603.11.) Such a triggered ability triggers when that permanent enters the battlefield after its replacement effect was applied, even if that replacement effect had no effect.\n702.138d An ability that reads \"[This permanent] escapes with [ability]\" means \"If this permanent escaped, it has [ability].\"","de":"Befreiung"},{"name":"Eternalize","cat":"Keyword Ability","cr":"702.129","crtitle":"Eternalize","crshort":"Eternalize is an activated ability that functions while the card with eternalize is in a graveyard.","reminder":"Eternalize [cost] ([Cost], Exile this card from your graveyard: Create a token that's a copy of it, except it's a 4/4 black Zombie in addition to its other types with no mana cost. Eternalize only as a sorcery.)","beginner":"Exile this from your graveyard to create a 4/4 black Zombie token copy of it.","desc":"{Cost}, Exile from graveyard: Create a token copy (4/4 black Zombie). Sorcery speed.","crfull":"702.129a Eternalize is an activated ability that functions while the card with eternalize is in a graveyard. \"Eternalize [cost]\" means \"[Cost], Exile this card from your graveyard: Create a token that's a copy of this card, except it's black, it's 4/4, it has no mana cost, and it's a Zombie in addition to its other types. Activate only as a sorcery.\"","de":"Verewigen"},{"name":"Evoke","cat":"Keyword Ability","cr":"702.74","crtitle":"Evoke","crshort":"Evoke represents two abilities: a static ability that functions in any zone from which the card with evoke can be cast and a triggered ability that functions on the battlefield.","reminder":"Evoke [cost] (You may cast this spell for its evoke cost. If you do, it's sacrificed when it enters the battlefield.)","beginner":"Pay the cheaper evoke cost to cast this, but you must sacrifice it immediately when it enters.","desc":"You may cast this for Evoke cost. If you do, sacrifice it when it enters.","crfull":"702.74a Evoke represents two abilities: a static ability that functions in any zone from which the card with evoke can be cast and a triggered ability that functions on the battlefield. \"Evoke [cost]\" means \"You may cast this card by paying [cost] rather than paying its mana cost\" and \"When this permanent enters, if its evoke cost was paid, its controller sacrifices it.\" Casting a spell for its evoke cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Herbeirufen"},{"name":"Evolve","cat":"Keyword Ability","cr":"702.100","crtitle":"Evolve","crshort":"Evolve is a triggered ability. \"Evolve\" means \"Whenever a creature you control enters, if that creature's power is greater than this creature's power and/or that creature's toughness is greater than this creature's toughness, put a +1/+1 counter on this creatu...","reminder":"Evolve (Whenever a creature enters the battlefield under your control, if that creature has greater power or toughness than this creature, put a +1/+1 counter on this creature.)","beginner":"When a bigger creature enters under your control, this creature gets a +1/+1 counter.","desc":"Creature enters with greater power/toughness? Put a +1/+1 counter on this.","crfull":"702.100a Evolve is a triggered ability. \"Evolve\" means \"Whenever a creature you control enters, if that creature's power is greater than this creature's power and/or that creature's toughness is greater than this creature's toughness, put a +1/+1 counter on this creature.\"\n702.100b A creature \"evolves\" when one or more +1/+1 counters are put on it as a result of its evolve ability resolving.\n702.100c A creature can't have a greater power or toughness than a noncreature permanent.\n702.100d If a creature has multiple instances of evolve, each triggers separately.","de":"Weiterentwicklung"},{"name":"Exalted","cat":"Keyword Ability","cr":"702.83","crtitle":"Exalted","crshort":"Exalted is a triggered ability. \"Exalted\" means \"Whenever a creature you control attacks alone, that creature gets +1/+1 until end of turn.\" A creature \"attacks alone\" if it's the only creature declared as an attacker in a given combat phase. See rule 506.5.","reminder":"Exalted (Whenever a creature you control attacks alone, that creature gets +1/+1 until end of turn.)","beginner":"When exactly one creature attacks, it gets +1/+1 for each exalted you have.","desc":"Whenever a creature you control attacks alone, it gets +1/+1 until end of turn.","crfull":"702.83a Exalted is a triggered ability. \"Exalted\" means \"Whenever a creature you control attacks alone, that creature gets +1/+1 until end of turn.\"\n702.83b A creature \"attacks alone\" if it's the only creature declared as an attacker in a given combat phase. See rule 506.5.","de":"Edelmut"},{"name":"Exchange","cat":"Keyword Action","cr":"701.12","crtitle":"Exchange","crshort":"A spell or ability may instruct players to exchange something (for example, life totals or control of two permanents) as part of its resolution. When such a spell or ability resolves, if the entire exchange can't be completed, no part of the exchange occurs.","reminder":"To exchange two things, swap their zones, values, or control.","beginner":"Trade or swap two things (life totals, control of permanents, etc.).","desc":"Swap two zones, values, or control of permanents.","crfull":"701.12a A spell or ability may instruct players to exchange something (for example, life totals or control of two permanents) as part of its resolution. When such a spell or ability resolves, if the entire exchange can't be completed, no part of the exchange occurs.\n701.12b When control of two permanents is exchanged, if those permanents are controlled by different players, each of those players simultaneously gains control of the permanent that was controlled by the other player. If, on the other hand, those permanents are controlled by the same player, the exchange effect does nothing.\n701.12c When life totals are exchanged, each player gains or loses the amount of life necessary to equal the other player's previous life total. Replacement effects may modify these gains and losses, and triggered abilities may trigger on them. A player who can't gain life can't be given a higher life total this way, and a player who can't lose life can't be given a lower life total this way (see rules 119.7-8).\n701.12d Some spells or abilities may instruct a player to exchange cards in one zone with cards in a different zone (for example, exiled cards and cards in a player's hand). These spells and abilities work the same as other \"exchange\" spells and abilities, except they can exchange the cards only if all the cards are owned by the same player, and they can exchange the cards even if one zone is empty.\n701.12e If a card in one zone is exchanged with a card in a different zone, and either of them is attached to an object, that card stops being attached to that object and the other card becomes attached to that object.\n701.12f If a spell or ability instructs a player to simply exchange two zones, and one of the zones is empty, the cards in the zones are still exchanged.\n701.12g A spell or ability may instruct a player to exchange two numerical values. In such an exchange, each value becomes equal to the previous value of the other. If either of those values is a life total, the affected player gains or loses the amount of life necessary to equal the other value. Replacement effects may modify this gain or loss, and triggered abilities may trigger on it. A player who can't gain life can't be given a higher life total this way, and a player who can't lose life can't be given a lower life total this way (see rules 119.7-8). If either of those values is a power or toughness, a continuous effect is created setting that power or toughness to the other value (see rule 613.4b). This rule does not apply to spells and abilities that switch a creature's power and toughness.\n701.12h One card (Exchange of Words) instructs a player to exchange the text boxes of two creatures. This creates a text-changing effect (see rule 612, \"Text-Changing Effects\"). In such an exchange, the rules text of each permanent becomes the previous rules text of the other.","de":"Tauschen"},{"name":"Exert","cat":"Keyword Action","cr":"701.43","crtitle":"Exert","crshort":"To exert a permanent, you choose to have it not untap during your next untap step.","reminder":"Exert (You may choose to have this creature not untap during your next untap step.)","beginner":"Choose not to untap this creature next turn to get a bonus effect now.","desc":"You may choose not to untap this creature next turn to trigger an effect.","crfull":"701.43a To exert a permanent, you choose to have it not untap during your next untap step.\n701.43b A permanent can be exerted even if it's not tapped or has already been exerted in a turn. If you exert a permanent more than once before your next untap step, each effect causing it not to untap expires during the same untap step.\n701.43c An object that isn't on the battlefield can't be exerted.\n701.43d \"You may exert [this creature] as it attacks\" is an optional cost to attack (see rule 508.1g). Some objects with this static ability have a triggered ability that triggers \"when you do\" printed in the same paragraph. These abilities are linked. (See rule 607.2h.)","de":"Erschöpfen"},{"name":"Exhaust","cat":"Keyword Ability","cr":"702.177","crtitle":"Exhaust","crshort":"Exhaust is a keyword that adds additional rules to the activated ability that follows it. \"Exhaust - [Cost]: [Effect]\" means \"[Cost]: [Effect]. Activate only once.\"","reminder":"Exhaust  -  [Cost]: [Effect]. (Activate each exhaust ability only once.)","beginner":"A powerful activated ability you only ever get to use one time.","desc":"Aetherdrift (2025). An activated ability that each permanent may use only once per game. Blinking or recasting the permanent resets it, since the new object has not used its ability yet.","crfull":"702.177a Exhaust is a keyword that adds additional rules to the activated ability that follows it. \"Exhaust - [Cost]: [Effect]\" means \"[Cost]: [Effect]. Activate only once.\"\n702.177b An effect may allow you to take an action as long as you haven't activated an exhaust ability this turn. Such an effect allows that action only if you haven't begun to activate an exhaust ability this turn.","de":"Überstrapazieren"},{"name":"Exile","cat":"Keyword Action","cr":"701.13","crtitle":"Exile","crshort":"To exile an object, move it to the exile zone from wherever it is. See rule 406, \"Exile.\"","reminder":"To exile an object, put it into the exile zone from wherever it is.","beginner":"Remove a card from the game - it goes to the exile zone, separated from play and graveyard.","desc":"Put card into the exile zone. It is removed from the game.","crfull":"701.13a To exile an object, move it to the exile zone from wherever it is. See rule 406, \"Exile.\"","de":"Ins Exil schicken; Exil"},{"name":"Expend","cat":"Ability Word","cr":"Glossary","crtitle":"","crshort":"A word found on some abilities that care how much mana a player has spent to cast spells this turn. See rule 700.14.","reminder":"Expend N  -  [Effect] if you have spent N or more total mana to cast spells this turn.","beginner":"Triggers when you've spent enough total mana this turn casting spells.","desc":"Ability word. Trigger when you spend a certain amount of mana this turn (e.g., Expend 4, Expend 6).","crfull":"A word found on some abilities that care how much mana a player has spent to cast spells this turn. See rule 700.14.","de":"Aufbieten"},{"name":"Experience","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Experience counters are placed on players. Effects scale based on how many you have.","beginner":"Counters that accumulate on you (the player) - the more you get, the stronger your effects become.","desc":"Counter on player. Effects scale based on number of experience counters you have.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Erfahrung"},{"name":"Exploit","cat":"Keyword Ability","cr":"702.110","crtitle":"Exploit","crshort":"Exploit is a triggered ability. \"Exploit\" means \"When this creature enters, you may sacrifice a creature.\" A creature with exploit \"exploits a creature\" when the controller of the exploit ability sacrifices a creature as that ability resolves.","reminder":"Exploit (When this creature enters the battlefield, you may sacrifice a creature.)","beginner":"When this enters, you may sacrifice a creature (including this one) for an additional effect.","desc":"When this enters, you may sacrifice a creature.","crfull":"702.110a Exploit is a triggered ability. \"Exploit\" means \"When this creature enters, you may sacrifice a creature.\"\n702.110b A creature with exploit \"exploits a creature\" when the controller of the exploit ability sacrifices a creature as that ability resolves.","de":"Ausschlachten"},{"name":"Explore","cat":"Keyword Action","cr":"701.44","crtitle":"Explore","crshort":"Certain spells and abilities instruct a permanent to explore. To do so, that permanent's controller reveals the top card of their library. If a land card is revealed this way, that player puts that card into their hand.","reminder":"Explore (Reveal the top card of your library. Put that card into your hand if it's a land. Otherwise, put a +1/+1 counter on this creature, then put the card back or put it into your graveyard.)","beginner":"Reveal your top card - if it's a land, add it to hand; otherwise this creature gets a +1/+1 counter.","desc":"Reveal the top card of your library. Put that card into your hand if it's a land card. Otherwise, put a +1/+1 counter on this creature, then put the card back or put it into your graveyard.","crfull":"701.44a Certain spells and abilities instruct a permanent to explore. To do so, that permanent's controller reveals the top card of their library. If a land card is revealed this way, that player puts that card into their hand. Otherwise, that player puts a +1/+1 counter on the exploring permanent and may put the revealed card into their graveyard.\n701.44b A permanent \"explores\" after the process described in rule 701.44a is complete, even if some or all of those actions were impossible.\n701.44c If a permanent is no longer on the battlefield as an effect instructs it to explore, its last known information is used to determine which object explored and who controlled it.\n701.44d If multiple permanents are instructed to explore at the same time, the first player in APNAP order who controls (or, in the case of a permanent no longer on the battlefield, last controlled; see rule 701.44c) one or more of those permanents chooses one of them and it explores. Then this process is repeated for each remaining instruction to explore.","de":"Erkunden"},{"name":"Extort","cat":"Keyword Ability","cr":"702.101","crtitle":"Extort","crshort":"Extort is a triggered ability. \"Extort\" means \"Whenever you cast a spell, you may pay {W/B}. If you do, each opponent loses 1 life and you gain life equal to the total life lost this way.\"","reminder":"Extort (Whenever you cast a spell, you may pay {W/B}. If you do, each opponent loses 1 life and you gain that much life.)","beginner":"Whenever you cast a spell, you can pay one white or black mana to drain 1 life from each opponent.","desc":"Whenever you cast a spell, you may pay {W/B}. If you do, opponents lose 1 life, you gain 1.","crfull":"702.101a Extort is a triggered ability. \"Extort\" means \"Whenever you cast a spell, you may pay {W/B}. If you do, each opponent loses 1 life and you gain life equal to the total life lost this way.\"\n702.101b If a permanent has multiple instances of extort, each triggers separately.","de":"Abnötigen"},{"name":"Fabricate","cat":"Keyword Ability","cr":"702.123","crtitle":"Fabricate","crshort":"Fabricate is a triggered ability. \"Fabricate N\" means \"When this permanent enters, you may put N +1/+1 counters on it. If you don't, create N 1/1 colorless Servo artifact creature tokens.\"","reminder":"Fabricate N (When this creature enters the battlefield, put N +1/+1 counters on it or create N 1/1 colorless Servo artifact creature tokens.)","beginner":"When this enters, choose to either make it bigger or create Servo tokens.","desc":"When enters, put N +1/+1 counters on it OR create N 1/1 Servo tokens.","crfull":"702.123a Fabricate is a triggered ability. \"Fabricate N\" means \"When this permanent enters, you may put N +1/+1 counters on it. If you don't, create N 1/1 colorless Servo artifact creature tokens.\"\n702.123b If a permanent has multiple instances of fabricate, each triggers separately.","de":"Fabrizieren"},{"name":"Face a Dilemma","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"You face a dilemma as you choose one or more modes for a spell or ability.","beginner":"Any time you pick modes on a modal spell or ability, you've faced a dilemma  -  some cards reward that.","desc":"Star Trek. Facing a dilemma means choosing one or more modes for a modal spell or ability. Used as a trigger condition.","crfull":"","de":""},{"name":"Face a Villainous Choice","cat":"Keyword Action","cr":"701.55","crtitle":"Face a Villainous Choice","crshort":"\"[A player] faces a villainous choice - [option A], or [option B]\" means \"[A player] chooses [option A] or [option B]. Then all actions in the chosen option are performed.\"","reminder":"Face a villainous choice  -  An opponent chooses one of two negative effects.","beginner":"Your opponent must choose between two bad options that affect them.","desc":"Opponent chooses one of two negative effects presented.","crfull":"701.55a \"[A player] faces a villainous choice - [option A], or [option B]\" means \"[A player] chooses [option A] or [option B]. Then all actions in the chosen option are performed.\"\n701.55b While facing a villainous choice, a player may choose an option that is illegal or impossible. In that case, they perform as much of the action as is possible. This is an exception to rule 608.2d.\n701.55c A replacement effect may replace an instruction to face a villainous choice with an instruction to face that choice some number of additional times. In that case, the entire process described in rule 701.55a is performed for that player the appropriate number of times one at a time.\n701.55d If more than one player is instructed to face a villainous choice, the entire process described in rule 701.55a is performed for each of those players one at a time in APNAP order. This is an exception to rule 608.2e.","de":"Schreckliches Dilemma"},{"name":"Fading","cat":"Keyword Ability","cr":"702.32","crtitle":"Fading","crshort":"Fading is a keyword that represents two abilities. \"Fading N\" means \"This permanent enters with N fade counters on it\" and \"At the beginning of your upkeep, remove a fade counter from this permanent. If you can't, sacrifice the permanent.\"","reminder":"Fading N (This permanent enters the battlefield with N fade counters on it. At the beginning of your upkeep, remove a fade counter from it. If you can't, sacrifice it.)","beginner":"This enters with N counters - remove one each turn until they're gone, then sacrifice it.","desc":"Enters with N fade counters. Remove one each upkeep. If you can't, sacrifice it.","crfull":"702.32a Fading is a keyword that represents two abilities. \"Fading N\" means \"This permanent enters with N fade counters on it\" and \"At the beginning of your upkeep, remove a fade counter from this permanent. If you can't, sacrifice the permanent.\"","de":"Schwund"},{"name":"Fateful Hour","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Fateful hour  -  [Effect] if you have 5 or less life.","beginner":"This ability is active when you're at 5 life or less.","desc":"Ability active only if you have 5 or less life.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Schicksalsstunde"},{"name":"Fateseal","cat":"Keyword Action","cr":"701.29","crtitle":"Fateseal","crshort":"To \"fateseal N\" means to look at the top N cards of an opponent's library, then put any number of them on the bottom of that library in any order and the rest on top of that library in any order.","reminder":"Fateseal N (Look at the top N cards of an opponent's library, then put any number of them on the bottom of that library and the rest on top in any order.)","beginner":"Look at the top cards of your opponent's library and rearrange or bottom them.","desc":"Look at top N cards of opponent's library. Put any number on bottom, rest on top.","crfull":"701.29a To \"fateseal N\" means to look at the top N cards of an opponent's library, then put any number of them on the bottom of that library in any order and the rest on top of that library in any order.","de":"Schicksal besiegeln"},{"name":"Fathomless Descent","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Fathomless descen der":"Finality counters (If a creature with a finality counter on it would die, exile it instead.)","beginner":"When this creature would die, exile it instead and remove the finality counter.","desc":"Counter on creature. If it would die, exile it instead, then remove this counter.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Endgültigkeit"},{"name":"Firebending","cat":"Keyword Ability","cr":"702.189","crtitle":"Firebending","crshort":"Firebending is a triggered ability. \"Firebending N\" means \"Whenever this creature attacks, add N {R}. Until end of combat, you don't lose this mana as steps and phases end.\"","reminder":"Firebending  -  Whenever this creature attacks, add {R}. Until end of combat, you don't lose this mana as steps and phases end.","beginner":"When this attacks, you get red mana that lasts through the combat phase.","desc":"When this creature attacks, add red mana that lasts until end of combat.","crfull":"702.189a Firebending is a triggered ability. \"Firebending N\" means \"Whenever this creature attacks, add N {R}. Until end of combat, you don't lose this mana as steps and phases end.\"\n702.189b An ability that triggers whenever a player firebends triggers whenever a firebending ability they control resolves.","de":"Feuerbändigen"},{"name":"First Strike","cat":"Keyword Ability","cr":"702.7","crtitle":"First Strike","crshort":"First strike is a static ability that modifies the rules for the combat damage step. (See rule 510, \"Combat Damage Step.\")","reminder":"First strike (This creature deals combat damage before creatures without first strike.)","beginner":"This creature deals its combat damage before normal creatures do.","desc":"Deals combat damage before creatures without first strike.","crfull":"702.7a First strike is a static ability that modifies the rules for the combat damage step. (See rule 510, \"Combat Damage Step.\")\n702.7b If at least one attacking or blocking creature has first strike or double strike (see rule 702.4) as the combat damage step begins, the only creatures that assign combat damage in that step are those with first strike or double strike. After that step, instead of proceeding to the end of combat step, the phase gets a second combat damage step. The only creatures that assign combat damage in that step are the remaining attackers and blockers that had neither first strike nor double strike as the first combat damage step began, as well as the remaining attackers and blockers that currently have double strike. After that step, the phase proceeds to the end of combat step.\n702.7c Giving first strike to a creature without it after combat damage has already been dealt in the first combat damage step won't preclude that creature from assigning combat damage in the second combat damage step. Removing first strike from a creature after it has already dealt combat damage in the first combat damage step won't allow it to also assign combat damage in the second combat damage step (unless the creature has double strike).\n702.7d Multiple instances of first strike on the same creature are redundant.","de":"Erstschlag"},{"name":"Flag Bearer","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Flagbearer (While an opponent is choosing targets as part of casting a spell they control or activating an ability they control, they must choose at least one Flagbearer on the battlefield if able.)","beginner":"Opponents must target this creature with their spells and abilities if able.","desc":"Opponents must target this if able.","crfull":"","d mbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Zaubergestöber"},{"name":"Flying","cat":"Keyword Ability","cr":"702.9","crtitle":"Flying","crshort":"Flying is an evasion ability. A creature with flying can't be blocked except by creatures with flying and/or reach. A creature with flying can block a creature with or without flying. (See rule 509, \"Declare Blockers Step,\" and rule 702.17, \"Reach.\")","reminder":"Flying (This creature can't be blocked except by creatures with flying or reach.)","beginner":"Only creatures with flying or reach can block this.","desc":"Can only be blocked by creatures with flying or reach.","crfull":"702.9a Flying is an evasion ability.\n702.9b A creature with flying can't be blocked except by creatures with flying and/or reach. A creature with flying can block a creature with or without flying. (See rule 509, \"Declare Blockers Step,\" and rule 702.17, \"Reach.\")\n702.9c Multiple instances of flying on the same creature are redundant.","de":"Fliegend; Flugfähigkeit"},{"name":"Food","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Food tokens have '{2}, {T}, Sacrifice this artifact: You gain 3 life.'","beginner":"An artifact token you can sacrifice to pay 2 mana and gain 3 life.","desc":"Artifact Token. {2}, {T}, Sacrifice this: You gain 3 life.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Speise"},{"name":"For Mirrodin!","cat":"Keyword Ability","cr":"702.163","crtitle":"For Mirrodin!","crshort":"For Mirrodin! is a triggered ability. \"For Mirrodin!\" means \"When this Equipment enters, create a 2/2 red Rebel creature token, then attach this Equipment to it.\"","reminder":"For Mirrodin! (When this Equipment enters the battlefield, create a 2/2 red Rebel creature token, then attach this to it.)","beginner":"This Equipment enters with its own creature token already attached to it.","desc":"Enters with a 2/2 red Rebel token. This Equipment attaches to it.","crfull":"702.163a For Mirrodin! is a triggered ability. \"For Mirrodin!\" means \"When this Equipment enters, create a 2/2 red Rebel creature token, then attach this Equipment to it.\"","de":"Für Mirrodin"},{"name":"Forage","cat":"Keyword Action","cr":"701.61","crtitle":"Forage","crshort":"To forage means \"Exile three cards from your graveyard or sacrifice a Food.\"","reminder":"Forage (You may exile three cards from your graveyard or sacrifice a Food.)","beginner":"Pay by either exiling three cards from your graveyard or sacrificing a Food token.","desc":"Exile three cards from your graveyard or sacrifice a Food.","crfull":"701.61a To forage means \"Exile three cards from your graveyard or sacrifice a Food.\"","de":"Hamstern"},{"name":"Forecast","cat":"Keyword Ability","cr":"702.57","crtitle":"Forecast","crshort":"A forecast ability is an activated ability that can be activated only from a player's hand. It's written \"Forecast - [Activated ability].\"","reminder":"Forecast  -  [Cost], Reveal this card from your hand: [Effect]. (Activate only during your upkeep and only once each turn.)","beginner":"Reveal this from your hand during your upkeep to activate a special ability.","desc":"Reveal from hand during upkeep and pay cost: Activate effect.","crfull":"702.57a A forecast ability is an activated ability that can be activated only from a player's hand. It's written \"Forecast - [Activated ability].\"\n702.57b A forecast ability may be activated only during the upkeep step of the card's owner and only once each turn. The controller of the forecast ability reveals the card with that ability from their hand as the ability is activated. That player plays with that card revealed in their hand until it leaves the player's hand or until a step or phase that isn't an upkeep step begins, whichever comes first.","de":"Vorhersage"},{"name":"Forestwalk","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"See Landwalk.","reminder":"Forestwalk (This creature can't be blocked as long as defending player controls a Forest.)","beginner":"Can't be blocked if your opponent has a Forest.","desc":"This creature is unblockable if defending player controls a Forest.","crfull":"See Landwalk.","de":"Waldtarnung"},{"name":"Foretell","cat":"Keyword Ability","cr":"702.143","crtitle":"Foretell","crshort":"Foretell is a keyword that functions while the card with foretell is in a player's hand. Any time a player has priority during their turn, that player may pay {2} and exile a card with foretell from their hand face down.","reminder":"Foretell [cost] (During your turn, you may pay {2} and exile this card from your hand face down. Cast it on a later turn for its foretell cost.)","beginner":"Pay 2 mana to exile this face-down, then cast it cheaper on a future turn.","desc":"Exile face down for {2}. Cast later for its foretell cost.","crfull":"702.143a Foretell is a keyword that functions while the card with foretell is in a player's hand. Any time a player has priority during their turn, that player may pay {2} and exile a card with foretell from their hand face down. That player may look at that card as long as it remains in exile. They may cast that card after the current turn has ended by paying any foretell cost it has rather than paying that spell's mana cost. Casting a spell this way follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.143b Exiling a card using its foretell ability is a special action, which doesn't use the stack. See rule 116, \"Special Actions.\"\n702.143c If an effect refers to foretelling a card, it means performing the special action associated with a foretell ability. If an effect refers to a card or spell that was foretold, it means a card put in the exile zone as a result of the special action associated with a foretell ability, or a spell that was a foretold card before it was cast, even if it was cast for a cost other than a foretell cost.\n702.143d If an effect states that a card in exile becomes foretold, that card becomes a foretold card. That effect may give the card a foretell cost. That card's owner may look at that card as long as it remains in exile and it may be cast for any foretell cost it has after the turn it became a foretold card has ended, even if the resulting spell doesn't have foretell.\n702.143e If a player owns multiple foretold cards in exile, they must ensure that those cards can be easily differentiated from each other and from any other face-down cards in exile which that player owns. This includes knowing both the order in which those cards were put into exile and any foretell costs other than their printed foretell costs those cards may have.\n702.143f If a player leaves the game, all face-down foretold cards that player owns must be revealed to all players. At the end of each game, all face-down foretold cards must be revealed to all players.","de":"Vorherbestimmung; Vorherbestimmen"},{"name":"Formidable","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Formidable  -  [Effect] if creatures you control have total power 8 or greater.","beginner":"Active when your creatures' powers add up to 8 or more total.","desc":"Ability word. Effect active if creatures you control have total power 8 or greater.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that
