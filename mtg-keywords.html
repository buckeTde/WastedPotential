ircle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Gewaltig"},{"name":"Fortify","cat":"Keyword Ability","cr":"702.67","crtitle":"Fortify","crshort":"Fortify is an activated ability of Fortification cards. \"Fortify [cost]\" means \"[Cost]: Attach this Fortification to target land you control. Activate only as a sorcery.\" For more information about Fortifications, see rule 301, \"Artifacts.\"","reminder":"Fortify [cost] ([Cost]: Attach to target land you control. Fortify only as a sorcery.)","beginner":"Like equip, but for lands - attach this Fortification to one of your lands.","desc":"{Cost}: Attach to target land you control. Sorcery speed.","crfull":"702.67a Fortify is an activated ability of Fortification cards. \"Fortify [cost]\" means \"[Cost]: Attach this Fortification to target land you control. Activate only as a sorcery.\"\n702.67b For more information about Fortifications, see rule 301, \"Artifacts.\"\n702.67c If a Fortification has multiple instances of fortify, any of its fortify abilities may be used.","de":"Befestigen"},{"name":"Freerunning","cat":"Keyword Ability","cr":"702.173","crtitle":"Freerunning","crshort":"Freerunning is a static ability that functions on the stack. \"Freerunning [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if a player was dealt combat damage this turn by a creature that, at the time it dealt that damage, was an Assass...","reminder":"Freerunning [cost] (You may cast this spell for its freerunning cost if you dealt combat damage to a player this turn with an Assassin or commander.)","beginner":"Cast this cheaper if you dealt combat damage with an Assassin or commander this turn.","desc":"Alternative cost if you dealt combat damage to a player with a creature this turn.","crfull":"702.173a Freerunning is a static ability that functions on the stack. \"Freerunning [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if a player was dealt combat damage this turn by a creature that, at the time it dealt that damage, was an Assassin creature or a commander under your control.\" Casting a spell for its freerunning cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Parkour"},{"name":"Frenzy","cat":"Keyword Ability","cr":"702.68","crtitle":"Frenzy","crshort":"Frenzy is a triggered ability. \"Frenzy N\" means \"Whenever this creature attacks and isn't blocked, it gets +N/+0 until end of turn.\" If a creature has multiple instances of frenzy, each triggers separately.","reminder":"Frenzy N (Whenever this creature attacks and isn't blocked, it gets +N/+0 until end of turn.)","beginner":"Gets a power boost when it attacks and isn't blocked.","desc":"Whenever this attacks and isn't blocked, it gets +N/+0 until end of turn.","crfull":"702.68a Frenzy is a triggered ability. \"Frenzy N\" means \"Whenever this creature attacks and isn't blocked, it gets +N/+0 until end of turn.\"\n702.68b If a creature has multiple instances of frenzy, each triggers separately.","de":"Kampfrausch"},{"name":"Friends Forever","cat":"Keyword Ability","cr":"702.124","crtitle":"Partner","crshort":"Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins.","reminder":"Partner - Friends forever (You can have two commanders if both have this ability.)","beginner":"In Commander, two cards that both say Friends forever can be your commanders together.","desc":"Partner variant. You may have two commanders if both have Friends forever. Does not combine with plain Partner.","crfull":"702.124a Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins. Each partner ability allows you to designate two legendary cards as your commander rather than one. Each partner ability has its own requirements for those two commanders. The partner abilities are: partner, partner-[text], partner with [name], choose a Background, and Doctor's companion.\n702.124b Your deck must contain exactly 100 cards, including its two commanders. Both commanders begin the game in the command zone.\n702.124c A rule or effect that refers to your commander's color identity refers to the combined color identities of your two commanders. See rule 903.4.\n702.124d Except for determining the color identity of your commander, the two commanders function independently. When casting a commander with partner, ignore how many times your other commander has been cast (see rule 903.8). When determining whether a player has been dealt 21 or more combat damage by the same commander, consider damage from each of your two commanders separately (see rule 903.10a).\n702.124e If an effect refers to your commander while you have two commanders, it refers to either one. If an effect causes you to perform an action on your commander and it could affect both, you choose which it refers to at the time the effect is applied.\n702.124f Different partner abilities are distinct from one another and cannot be combined. For example, you cannot designate two cards as your commander if one of them has \"partner\" and the other has \"partner with [name].\"\n702.124g If a legendary card has more than one partner ability, you may choose which one to use when designating your commander, but you can't use both. Notably, no partner ability or combination of partner abilities can ever let a player have more than two commanders.\n702.124h \"Partner\" means \"You may designate two legendary cards as your commander rather than one if each of them has partner.\"\n702.124i \"Partner-[text]\" means \"You may designate two legendary cards as your commander rather than one if each of them has the same 'partner-[text]' ability.\" The \"partner-[text]\" abilities are \"partner-Character select,\" \"partner-Father & son,\" \"partner-Friends forever,\" and \"partner-Survivors.\"\n702.124j \"Partner with [name]\" represents two abilities. It means \"You may designate two legendary cards as your commander rather than one if each has a 'partner with [name]' ability with the other's name\" and \"When this permanent enters, target player may search their library for a card named [name], reveal it, put it into their hand, then shuffle.\"\n702.124k \"Choose a Background\" means \"You may designate two cards as your commander rather than one if one of them is this card and the other is a legendary Background enchantment card.\" You can't designate two cards as your commander if one has a \"choose a Background\" ability and the other is not a legendary Background enchantment card, and legendary Background enchantment cards can't be your commander unless you have also designated a commander with \"choose a Background.\"\n702.124m \"Doctor's companion\" means \"You may designate two legendary creature cards as your commander rather than one if one of them is this card and the other is a legendary Time Lord Doctor creature card that has no other creature types.\"\n702.124n If an effect refers to a partner ability by name, it means only that partner ability and not any others. If an effect refers to the partner ability or cards with partner and doesn't mention a specific variant of the partner ability by name, it is referring only to partner, partner-[text], partner with [name], or cards with any of those abilities, and it does not refer to any other partner variant.","de":""},{"name":"Fuse","cat":"Keyword Ability","cr":"702.102","crtitle":"Fuse","crshort":"Fuse is a static ability found on some split cards (see rule 709, \"Split Cards\") that applies while the card with fuse is in a player's hand.","reminder":"Fuse (You may cast one or both halves of this card from your hand.)","beginner":"You can cast either half of this split card, or pay both costs to cast both halves together.","desc":"You may cast one or both halves of this split card.","crfull":"702.102a Fuse is a static ability found on some split cards (see rule 709, \"Split Cards\") that applies while the card with fuse is in a player's hand. If a player casts a split card with fuse from their hand, the player may choose to cast both halves of that split card rather than choose one half. This choice is made before putting the split card with fuse onto the stack. The resulting spell is a fused split spell.\n702.102b A fused split spell has the combined characteristics of its two halves. (See rule 709.4.)\n702.102c The total cost of a fused split spell includes the mana cost of each half.\n702.102d As a fused split spell resolves, the controller of the spell follows the instructions of the left half and then follows the instructions of the right half.","de":"Fusion"},{"name":"Gift","cat":"Keyword Ability","cr":"702.174","crtitle":"Gift","crshort":"Gift is a keyword that represents two abilities. It is written \"Gift a [something].\" The first ability is a static ability that functions while the card with gift is on the stack, and the second is either an ability that functions while the card with gift is o...","reminder":"Gift (You may promise an opponent a gift as you cast this spell. If you do, [effect]. Otherwise, [alternate effect].)","beginner":"Promise a bonus to an opponent when casting to get a stronger effect for yourself.","desc":"You may promise a gift to an opponent as you cast this for an extra effect.","crfull":"702.174a Gift is a keyword that represents two abilities. It is written \"Gift a [something].\" The first ability is a static ability that functions while the card with gift is on the stack, and the second is either an ability that functions while the card with gift is on the stack or a triggered ability that functions while the card with gift is on the battlefield. The first ability is always \"As an additional cost to cast this spell, you may choose an opponent.\" Paying a spell's gift cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h. The second ability depends on the [something] listed as well as whether the object with the ability is a permanent or an instant or sorcery spell.\n702.174b On a permanent, the second ability represented by gift is \"When this permanent enters, if its gift cost was paid, [effect].\" On an instant or sorcery spell, the second ability represented by gift is \"If this spell's gift cost was paid, [effect].\" The specific effect is defined by the [something] listed.\n702.174c Some effects trigger whenever a player gives a gift. Such an ability triggers whenever an instant or sorcery spell that player controls whose gift cost was paid resolves. It also triggers whenever the gift triggered ability of a permanent that player controls resolves.\n702.174d \"Gift a Food\" means the effect is \"The chosen player creates a Food token.\"\n702.174e \"Gift a card\" means the effect is \"The chosen player draws a card.\"\n702.174f \"Gift a tapped Fish\" means the effect is \"The chosen player creates a tapped 1/1 blue Fish creature token.\"\n702.174g \"Gift an extra turn\" means the effect is \"The chosen player takes an extra turn after this one.\"\n702.174h \"Gift a Treasure\" means the effect is \"The chosen player creates a Treasure token.\"\n702.174i \"Gift an Octopus\" means the effect is \"The chosen player creates an 8/8 blue Octopus creature token.\"\n702.174j For instant and sorcery spells, the effect of a gift ability always happens before any other spell abilities of the card. If the spell is countered or otherwise leaves the stack before resolving, the gift effect doesn't happen.\n702.174k If a spell's controller declares the intention to pay a spell's gift cost, that spell's gift was promised.\n702.174m If part of a spell's ability has its effect only if its gift was promised, and that part of the ability includes any targets, the spell's controller chooses those targets only if the gift was promised.","de":"Verschenken; Geschenk"},{"name":"Gingerbrute ability","cat":"Rules Term","cr":"","crtitle":"","crshort":"","reminder":"This creature can't be blocked except by creatures with haste.","beginner":"Only creatures with haste can block this (unique to Gingerbrute).","desc":"Can't be blocked except by creatures with haste.","crfull":"","de":""},{"name":"Goad","cat":"Keyword Action","cr":"701.15","crtitle":"Goad","crshort":"Certain spells and abilities can goad a creature. Until the next turn of the controller of that spell or ability, that creature is goaded.","reminder":"Goad (Until your next turn, that creature attacks each combat if able and attacks a player other than you if able.)","beginner":"Force a creature to attack someone other than you each turn.","desc":"Target creature attacks each combat if able and attacks a player other than you.","crfull":"701.15a Certain spells and abilities can goad a creature. Until the next turn of the controller of that spell or ability, that creature is goaded.\n701.15b Goaded is a designation a permanent can have. A goaded creature attacks each combat if able and attacks a player other than the controller of the permanent, spell, or ability that caused it to be goaded if able. Goaded is neither an ability nor part of the permanent's copiable values.\n701.15c A creature can be goaded by multiple players. Doing so creates additional combat requirements.\n701.15d Once a player has goaded a creature, the same player goading it again has no effect. Doing so doesn't create additional combat requirements.","de":"Anstacheln"},{"name":"Gold","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Gold tokens have 'Sacrifice this artifact: Add one mana of any color.'","beginner":"An artifact token you can sacrifice for one mana of any color.","desc":"Artifact Token. Sacrifice this: Add one mana of any color.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Gold"},{"name":"Graft","cat":"Keyword Ability","cr":"702.58","crtitle":"Graft","crshort":"Graft represents both a static ability and a triggered ability. \"Graft N\" means \"This permanent enters with N +1/+1 counters on it\" and \"Whenever another creature enters, if this permanent has a +1/+1 counter on it, you may move a +1/+1 counter from this perma...","reminder":"Graft N (This permanent enters the battlefield with N +1/+1 counters on it. Whenever another creature enters the battlefield, you may move a +1/+1 counter from this permanent onto it.)","beginner":"Enters with counters that you can move to other creatures as they enter the battlefield.","desc":"Enters with counters. When another enters, you may move a counter from this to it.","crfull":"702.58a Graft represents both a static ability and a triggered ability. \"Graft N\" means \"This permanent enters with N +1/+1 counters on it\" and \"Whenever another creature enters, if this permanent has a +1/+1 counter on it, you may move a +1/+1 counter from this permanent onto that creature.\"\n702.58b If a permanent has multiple instances of graft, each one works separately.","de":"Pfropfen"},{"name":"Grandeur","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Grandeur  -  Discard another card with the same name as this permanent: [Effect].","beginner":"Discard a copy of reature to trigger later.","desc":"When this/creature dies, exile this card encoded on a target creature.","crfull":"702.55a Haunt is a triggered ability. \"Haunt\" on a permanent means \"When this permanent is put into a graveyard from the battlefield, exile it haunting target creature.\" \"Haunt\" on an instant or sorcery spell means \"When this spell is put into a graveyard during its resolution, exile it haunting target creature.\"\n702.55b Cards that are in the exile zone as the result of a haunt ability \"haunt\" the creature targeted by that ability. The phrase \"creature it haunts\" refers to the object targeted by the haunt ability, regardless of whether or not that object is still a creature.\n702.55c Triggered abilities of cards with haunt that refer to the haunted creature can trigger in the exile zone.","de":"Spuk"},{"name":"Heal","cat":"Keyword Action","cr":"701.69","crtitle":"Heal","crshort":"To heal damage already dealt to a permanent, remove that marked damage from that permanent. If an effect states that damage already dealt to a permanent \"is healed,\" that permanent's controller removes all marked damage from that permanent.","reminder":"To heal damage on a permanent is to remove that damage from it.","beginner":"Wipe the damage already marked on a creature  -  it doesn't change toughness, it just clears what's been dealt.","desc":"Remove damage marked on a permanent. Appears in regeneration reminder text ('...and heal all damage on it') and on damage-removal effects.","crfull":"701.69a To heal damage already dealt to a permanent, remove that marked damage from that permanent. If an effect states that damage already dealt to a permanent \"is healed,\" that permanent's controller removes all marked damage from that permanent.","de":""},{"name":"Heist","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To heist, exile the top card of target opponent's library face down. Until the end of your next turn, you may look at and play th he player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Heroisch"},{"name":"Hexproof","cat":"Keyword Ability","cr":"702.11","crtitle":"Hexproof","crshort":"Hexproof is a static ability. \"Hexproof\" on a permanent means \"This permanent can't be the target of spells or abilities your opponents control.\" \"Hexproof\" on a player means \"You can't be the target of spells or abilities your opponents control.\"","reminder":"Hexproof (This permanent can't be the target of spells or abilities your opponents control.)","beginner":"Your opponents can't target this with their spells or abilities.","desc":"Cannot be the target of spells or abilities your opponents control. See also hexproof from [quality], a restricted form.","crfull":"702.11a Hexproof is a static ability.\n702.11b \"Hexproof\" on a permanent means \"This permanent can't be the target of spells or abilities your opponents control.\"\n702.11c \"Hexproof\" on a player means \"You can't be the target of spells or abilities your opponents control.\"\n702.11d \"Hexproof from [quality]\" is a variant of the hexproof ability. \"Hexproof from [quality]\" on a permanent means \"This permanent can't be the target of [quality] spells your opponents control or abilities your opponents control from [quality] sources.\" A \"hexproof from [quality]\" ability is a hexproof ability.\n702.11e Any effect that causes an object to lose hexproof will cause an object to lose all \"hexproof from [quality]\" abilities. Any effect that allows a player to choose a creature with hexproof as a target as though it didn't have hexproof will allow a player to choose a creature with a \"hexproof from [quality]\" ability. Any effect that looks for a card with hexproof will find a card with a \"hexproof from [quality]\" ability.\n702.11f \"Hexproof from [quality A] and from [quality B]\" is shorthand for \"hexproof from [quality A]\" and \"hexproof from [quality B]\"; it behaves as two separate hexproof abilities.\n702.11g \"Hexproof from each [characteristic]\" is shorthand for \"hexproof from [quality A],\" \"hexproof from [quality B],\" and so on for each possible quality the listed characteristic could have; it behaves as multiple separate hexproof abilities.\n702.11h Multiple instances of the same hexproof ability on the same permanent or player are redundant.","de":"Fluchsicher; Fluchsicherheit"},{"name":"Hexproof From","cat":"Keyword Ability","cr":"702.11","crtitle":"Hexproof","crshort":"Hexproof is a static ability. \"Hexproof\" on a permanent means \"This permanent can't be the target of spells or abilities your opponents control.\" \"Hexproof\" on a player means \"You can't be the target of spells or abilities your opponents control.\"","reminder":"Hexproof from [quality] (This permanent can't be the target of [quality] spells or abilities your opponents control.)","beginner":"Partial hexproof: opponents can't target this with the named thing, but other things still work.","desc":"Restricted Hexproof. Can't be targeted by opponents' spells/abilities of the named quality (e.g. hexproof from black, hexproof from red).","crfull":"702.11a Hexproof is a static ability.\n702.11b \"Hexproof\" on a permanent means \"This permanent can't be the target of spells or abilities your opponents control.\"\n702.11c \"Hexproof\" on a player means \"You can't be the target of spells or abilities your opponents control.\"\n702.11d \"Hexproof from [quality]\" is a variant of the hexproof ability. \"Hexproof from [quality]\" on a permanent means \"This permanent can't be the target of [quality] spells your opponents control or abilities your opponents control from [quality] sources.\" A \"hexproof from [quality]\" ability is a hexproof ability.\n702.11e Any effect that causes an object to lose hexproof will cause an object to lose all \"hexproof from [quality]\" abilities. Any effect that allows a player to choose a creature with hexproof as a target as though it didn't have hexproof will allow a player to choose a creature with a \"hexproof from [quality]\" ability. Any effect that looks for a card with hexproof will find a card with a \"hexproof from [quality]\" ability.\n702.11f \"Hexproof from [quality A] and from [quality B]\" is shorthand for \"hexproof from [quality A]\" and \"hexproof from [quality B]\"; it behaves as two separate hexproof abilities.\n702.11g \"Hexproof from each [characteristic]\" is shorthand for \"hexproof from [quality A],\" \"hexproof from [quality B],\" and so on for each possible quality the listed characteristic could have; it behaves as multiple separate hexproof abilities.\n702.11h Multiple instances of the same hexproof ability on the same permanent or player are redundant.","de":"Fluchsicher vor"},{"name":"Hidden Agenda","cat":"Keyword Ability","cr":"702.106","crtitle":"Hidden Agenda","crshort":"Hidden agenda is a static ability that functions as a conspiracy card with hidden agenda is put into the command zone. \"Hidden agenda\" means \"As you put this conspiracy card into the command zone, turn it face down and secretly choose a card name.\"","reminder":"Hidden agenda (Start the game with this conspiracy face down in the command zone and secretly choose a card name. You may turn this conspiracy face up any time and reveal that name.)","beginner":"Secretly choose a card name at game start and reveal it when needed (Conspiracy format).","desc":"Start game with this face down in command zone. Secretly name a card.","crfull":"702.106a Hidden agenda is a static ability that functions as a conspiracy card with hidden agenda is put into the command zone. \"Hidden agenda\" means \"As you put this conspiracy card into the command zone, turn it face down and secretly choose a card name.\"\n702.106b To secretly choose a card name, note that name on a piece of paper kept with the face-down conspiracy card.\n702.106c Any time you have priority, you may turn a face-down conspiracy card you control in the command zone face up. This is a special action. Doing so will reveal the chosen name. See rule 116.2j.\n702.106d Hidden agenda and another ability of the object with hidden agenda that refers to \"the chosen name\" are linked. The second ability refers only to the card name chosen as a result of that object's hidden agenda ability. See rule 607.2d.\n702.106e If a player leaves the game, all face-down conspiracy cards controlled by that player must be revealed to all players. At the end of each game, all face-down conspiracy cards must be revealed to all players.\n702.106f Double agenda is a variant of the hidden agenda ability. As you put a conspiracy card with double agenda into the command zone, you secretly name two different cards rather than one. You don't reveal that more than one name was secretly chosen until you reveal the chosen names.","de":""},{"name":"Hideaway","cat":"Keyword Ability","cr":"702.75","crtitle":"Hideaway","crshort":"Hideaway is a triggered ability. \"Hideaway N\" means \"When this permanent enters, look at the top N cards of your library. Exile one of them face down and put the rest on the bottom of your library in a random order.","reminder":"Hideaway N (When this permanent enters the battlefield, look at the top N cards of your library, exile one face down, then put the rest on the bottom in a random order.)","beginner":"Look at the top cards when this enters, hide one to cast later when the condition is met.","desc":"Enters tapped. Exile top 4 cards, choose one. Play it later for free if condition met.","crfull":"702.75a Hideaway is a triggered ability. \"Hideaway N\" means \"When this permanent enters, look at the top N cards of your library. Exile one of them face down and put the rest on the bottom of your library in a random order. The exiled card gains 'The player who controls the permanent that exiled this card may look at this card in the exile zone.'\"\n702.75b Previously, the rules for the hideaway ability caused the permanent to enter the battlefield tapped, and the number of cards the player looked at was fixed at four. Cards printed before this rules change had the printed text \"Hideaway\" with no numeral after the word. Those older cards have received errata in the Oracle card reference to have \"Hideaway 4\" and the additional ability \"[This permanent] enters tapped.\"","de":"Refugium"},{"name":"Horsemanship","cat":"Keyword Ability","cr":"702.31","crtitle":"Horsemanship","crshort":"Horsemanship is an evasion ability. A creature with horsemanship can't be blocked by creatures without horsemanship. A creature with horsemanship can block a creature with or without horsemanship. (See rule 509, \"Declare Blockers Step.\")","reminder":"Horsemanship (This creature can't be blocked except by creatures with horsemanship.)","beginner":"Basically unblockable since very few creatures have horsemanship.","desc":"Can't be blocked except by creatures with horsemanship.","crfull":"702.31a Horsemanship is an evasion ability.\n702.31b A creature with horsemanship can't be blocked by creatures without horsemanship. A creature with horsemanship can block a creature with or without horsemanship. (See rule 509, \"Declare Blockers Step.\")\n702.31c Multiple instances of horsemanship on the same creature are redundant.","de":"Reitkunst"},{"name":"Host","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Host creatures have an ability with a blank in it. That ability does nothing until the host is combined with an augment card.","beginner":"An Un-set creature with an incomplete ability, waiting for an Augment card to finish it.","desc":"Un-set mechanic. A creature with an incomplete ability that becomes functional only once an Augment card is combined with it. Pairs with Augment.","crfull":"","de":""},{"name":"Impending","cat":"Keyword Ability","cr":"702.176","crtitle":"Impending","crshort":"Impending is a keyword that represents four abilities. The first is a static ability that functions while the spell with impending is on the stack.","reminder":"Impending [cost] (You may cast this spell for its impending cost. If you do, it enters with N time counters and isn't a creature until the last is removed.)","beginner":"Cast cheaper as a countdown enchantment that becomes a creature when time runs out.","desc":"Cast for alternative cost with time counters. Isn't a creature until counters removed.","crfull":"702.176a Impending is a keyword that represents four abilities. The first is a static ability that functions while the spell with impending is on the stack. The second is static ability that creates a replacement effect that may apply to the permanent with impending as it enters the battlefield from the stack. The third is a static ability that functions on the battlefield. The fourth is a triggered ability that functions on the battlefield. \"Impending N-[cost]\" means \"You may choose to pay [cost] rather than pay this spell's mana cost,\" \"If you chose to pay this permanent's impending cost, it enters with N time counters on it,\" \"As long as this permanent's impending cost was paid and it has a time counter on it, it's not a creature,\" and \"At the beginning of your end step, if this permanent's impending cost was paid and it has a time counter on it, remove a time counter from it.\" Casting a spell for its impending cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Unheilsdrohend"},{"name":"Imprint","cat":"Ability Word","cr":"Glossary","crtitle":"","crshort":"\"Imprint\" used to be a keyword ability. It is now an ability word and has no rules meaning. All cards printed with the imprint keyword have received errata in the Oracle card reference.","reminder":"Imprint  -  [Instructions for exiling card(s). The exiled cards are 'imprinted' and referenced by other abilities.]","beginner":"Exile a card to give this permanent abilities based on the exiled card.","desc":"Exile card to give this abilities.","crfull":"\"Imprint\" used to be a keyword ability. It is now an ability word and has no rules meaning. All cards printed with the imprint keyword have received errata in the Oracle card reference.","de":"Einprägen"},{"name":"Improvise","cat":"Keyword Ability","cr":"702.126","crtitle":"Improvise","crshort":"Improvise is a static ability that functions while the spell with improvise is on the stack. \"Improvise\" means \"For each generic mana in this spell's total cost, you may tap an untapped artifact you control rather than pay that mana.\"","reminder":"Improvise (Your artifacts can help cast this spell. Each artifact you tap after you're done activating mana abilities pays for {1}.)","beginner":"Tap your artifacts to help pay for this spell - each counts as one mana.","desc":"Your artifacts can help cast this spell. Tap artifact for {1}.","crfull":"702.126a Improvise is a static ability that functions while the spell with improvise is on the stack. \"Improvise\" means \"For each generic mana in this spell's total cost, you may tap an untapped artifact you control rather than pay that mana.\"\n702.126b The improvise ability isn't an additional or alternative cost and applies only after the total cost of the spell with improvise is determined.\n702.126c Multiple instances of improvise on the same spell are redundant.","de":"Improvisieren"},{"name":"Incorporate","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To incorporate [mana] and an ability, a card in hand perpetually gains that added mana cost and that ability.","beginner":"A digital-only (Alchemy) upgrade: a card in your hand permanently gains an ability, but also costs more.","desc":"Alchemy / digital-only. A chosen card in hand perpetually gains an additional mana cost and an additional ability.","crfull":"","de":""},{"name":"Increment","cat":"Keyword Ability","cr":"702.191","crtitle":"Increment","crshort":"Increment is a triggered ability. \"Increment\" means \"Whenever you cast a spell, if this permanent is a creature and the amount of mana spent to cast that spell is greater than this creature's power or this creature's toughness, put a +1/+1 counter on this crea...","reminder":"Increment (Whenever you cast a spell, if the amount of mana you spent is greater than this creature's power or toughness, put a +1/+1 counter on this creature.)","beginner":"Whenever you cast a spell, if you spent more mana than this creature's power or toughness, it gets a +1/+1 counter.","desc":"Triggers when you cast a spell. If the mana spent exceeds this creature's power or toughness, put a +1/+1 counter on it.","crfull":"702.191a Increment is a triggered ability. \"Increment\" means \"Whenever you cast a spell, if this permanent is a creature and the amount of mana spent to cast that spell is greater than this creature's power or this creature's toughness, put a +1/+1 counter on this creature.\"\n702.191b If a creature has multiple instances of increment, each one triggers separately.","de":"Inkrement"},{"name":"Incubate","cat":"Keyword Action","cr":"701.53","crtitle":"Incubate","crshort":"To incubate N, create an Incubator token that enters the battlefield with N +1/+1 counters on it. See rule 111.10i.","reminder":"Incubate N (Create an Incubator token with N +1/+1 counters on it. It has '{2}: Transform this artifact.' It transforms into a 0/0 Phyrexian artifact creature.)","beginner":"Create a token with counters that you can pay 2 to flip into a Phyrexian creature.","desc":"Create Incubator token with N +1/+1 counters. ({2}: Transform to 0/0 Phyrexian).","crfull":"701.53a To incubate N, create an Incubator token that enters the battlefield with N +1/+1 counters on it. See rule 111.10i.\n701.53b An Incubator token is a double-faced token. Its front face is a colorless Incubator artifact with \"{2}: Transform this token.\" Its back face is a 0/0 colorless Phyrexian artifact creature named \"Phyrexian Token.\"","de":"Inkubieren"},{"name":"Incubator","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Incubator tokens are transforming double-faced artifact tokens with '{2}: Transform this artifact.' They transform into 0/0 Phyrexian artifact creatures.","beginner":"A token that starts as an artifact with counters and can be transformed into a creature.","desc":"Token that enters with +1/+1 counters. {2}: Transform into 0/0 Phyrexian artifact creature.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Inkubator"},{"name":"Indestructible","cat":"Keyword Ability","cr":"702.12","crtitle":"Indestructible","crshort":"Indestructible is a static ability. A permanent with indestructible can't be destroyed. Such permanents aren't destroyed by lethal damage, and they ignore the state-based action that checks for lethal damage (see rule 704.5g).","reminder":"Indestructible (Damage and effects that say \"destroy\" don't destroy this permanent.)","beginner":"Can't be destroyed by damage or destroy effects (can still be exiled or sacrificed).","desc":"Cannot be destroyed by damage or 'destroy' effects.","crfull":"702.12a Indestructible is a static ability.\n702.12b A permanent with indestructible can't be destroyed. Such permanents aren't destroyed by lethal damage, and they ignore the state-based action that checks for lethal damage (see rule 704.5g).\n702.12c Multiple instances of indestructible on the same permanent are redundant.","de":"Unzerstörbar; Unzerstörbarkeit"},{"name":"Infect","cat":"Keyword Ability","cr":"702.90","crtitle":"Infect","crshort":"Infect is a static ability. Damage dealt to a player by a source with infect doesn't cause that player to lose life. Rather, it causes that source's controller to give the player that many poison counters. See rule 120.3.","reminder":"Infect (This creature deals damage to creatures in the form of -1/-1 counters and to players in the form of poison counters.)","beginner":"Deals damage as -1/-1 counters to creatures and poison counters to players.","desc":"Deals damage to creatures as -1/-1 counters and to players as poison counters.","crfull":"702.90a Infect is a static ability.\n702.90b Damage dealt to a player by a source with infect doesn't cause that player to lose life. Rather, it causes that source's controller to give the player that many poison counters. See rule 120.3.\n702.90c Damage dealt to a creature by a source with infect isn't marked on that creature. Rather, it causes that source's controller to put that many -1/-1 counters on that creature. See rule 120.3.\n702.90d If an object is no longer in the zone it's expected to be in as an effect causes it to deal damage, its last known information is used to determine whether it had infect.\n702.90e The infect rules function no matter what zone an object with infect deals damage from.\n702.90f Multiple instances of infect on the same object are redundant.","de":"Infizieren"},{"name":"Infinity","cat":"Keyword Ability","cr":"702.186","crtitle":"Infinity","crshort":"Infinity (the mathematical symbol for infinity) is a keyword found on Infinity cards. \"Infinity\" is followed by ability text. Together, they represent a static ability.","reminder":"Infinity - [Ability] (As long as this permanent is harnessed, it has [ability].)","beginner":"A bonus ability that only switches on while the permanent is harnessed.","desc":"CR 702.186. The mathematical infinity symbol used as a keyword on Infinity cards, followed by ability text. Together they form a static ability conditional on the permanent being harnessed. See Harness.","crfull":"702.186a Infinity (the mathematical symbol for infinity) is a keyword found on Infinity cards. \"Infinity\" is followed by ability text. Together, they represent a static ability.\n702.186b \"Infinity - [Ability]\" means \"As long as this permanent is harnessed, it has [ability].\" See rule 701.64, \"Harness.\"","de":""},{"name":"Infusion","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Infusion  -  [Effect] if you gained life this turn.","beginner":"Active if you gained life this turn  -  creatures with this ability have a triggered or static effect that requires life gain.","desc":"Ability word (Secrets of Strixhaven, 2026). Condition active if you gained life this turn. Used by Witherbloom mages.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Zusammenarbeiten"},{"name":"Jump-Start","cat":"Keyword Ability","cr":"702.133","crtitle":"Jump-Start","crshort":"Jump-start appears on some instants and sorceries. It represents two static abilities: one that functions while the card is in a player's graveyard and another that functions while the card is on the stack.","reminder":"Jump-start (You may cast this card from your graveyard by discarding a card in addition to paying its other costs. Then exile this card.)","beginner":"Cast from your graveyard by discarding a card, then exile it.","desc":"Cast from graveyard by discarding a card. Exile it after.","crfull":"702.133a Jump-start appears on some instants and sorceries. It represents two static abilities: one that functions while the card is in a player's graveyard and another that functions while the card is on the stack. \"Jump-start\" means \"You may cast this card from your graveyard if the resulting spell is an instant or sorcery spell by discarding a card as an additional cost to cast it\" and \"If this spell was cast using its jump-start ability, exile this card instead of putting it anywhere else any time it would leave the stack.\" Casting a spell using its jump-start ability follows the rules for paying additional costs in rules 601.2b and 601.2f-h.","de":"Katalyse"},{"name":"Junk","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Junk tokens are artifact tokens with '{T}, Sacrifice this artifact: Exile the top card of your library. You may play that card this turn.'","beginner":"A token you can sacrifice to exile and potentially play the top card of your library.","desc":"Artifact Token. {T}, Sacrifice this: Exile top card of library. Play it this turn.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Altmetall"},{"name":"Kicker (Multikicker)","cat":"Keyword Ability","cr":"702.33","crtitle":"Kicker","crshort":"Kicker is a static ability that functions while the spell with kicker is on the stack.","reminder":"Kicker [cost] (You may pay an additional [cost] as you cast this spell.) Multikicker (You may pay an additional [cost] any number of times as you cast this spell.)","beginner":"Pay extra when casting for bonus effects - multikicker can be paid multiple times.","desc":"You may pay an additional cost (any number of times) as you cast for a bonus.","crfull":"702.33a Kicker is a static ability that functions while the spell with kicker is on the stack. \"Kicker [cost]\" means \"You may pay an additional [cost] as you cast this spell.\" Paying a spell's kicker cost(s) follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.33b The phrase \"Kicker [cost 1] and/or [cost 2]\" means the same thing as \"Kicker [cost 1], kicker [cost 2].\"\n702.33c Multikicker is a variant of the kicker ability. \"Multikicker [cost]\" means \"You may pay an additional [cost] any number of times as you cast this spell.\" A multikicker cost is a kicker cost.\n702.33d If a spell's controller declares the intention to pay any of that spell's kicker costs, that spell has been \"kicked.\" If a spell has two kicker costs or has multikicker, it may be kicked multiple times. See rule 601.2b.\n702.33e Objects with kicker or multikicker have additional abilities that specify what happens if they were kicked. These abilities are linked to the kicker or multikicker abilities printed on that object: they can refer only to those specific kicker or multikicker abilities. See rule 607, \"Linked Abilities.\"\n702.33f Objects with more than one kicker cost may also have abilities that each correspond to a specific kicker cost. Those abilities contain the phrases \"if it was kicked with its [A] kicker\" and \"if it was kicked with its [B] kicker,\" where A and B are the first and second kicker costs listed on the card, respectively. Each of those abilities is linked to the appropriate kicker ability.\n702.33g If part of a spell's ability has its effect only if that spell was kicked, and that part of the ability includes any targets, the spell's controller chooses those targets only if that spell was kicked. Otherwise, the spell is cast as if it did not have those targets. See rule 601.2c.\n702.33h Sticker kicker is a keyword ability that represents a kicker ability and an ability that imposes an additional cost if the spell is kicked. \"Sticker kicker [cost]\" means \"Kicker [cost]\" and \"As an additional cost to cast this spell, if it's kicked, you get a ticket counter and you may put a sticker on this spell.\"","de":"Bonus; Multibonus; Bonuskosten"},{"name":"Kindred","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A card type. Whether or not a kindred is a permanent depends on its other card type. See rule 308, \"Kindreds.\"","reminder":"Kindred is a card type (formerly called Tribal). Kindred cards can have creature types even if they're not creatures.","beginner":"A card type that lets non-creature spells have creature types for tribal synergies.","desc":"Card type (formerly Tribal). Allows noncreature cards to have creature types.","crfull":"A card type. Whether or not a kindred is a permanent depends on its other card type. See rule 308, \"Kindreds.\"","de":""},{"name":"Kinship","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together ore activated abilities.\n702.29c Some cards with cycling have abilities that trigger when they're cycled. \"When you cycle this card\" means \"When you discard this card to pay an activation cost of a cycling ability.\" These abilities trigger from whatever zone the card winds up in after it's cycled.\n702.29d Some cards have abilities that trigger whenever a player \"cycles or discards\" a card. These abilities trigger only once when a card is cycled.\n702.29e Typecycling is a variant of the cycling ability. \"[Type]cycling [cost]\" means \"[Cost], Discard this card: Search your library for a [type] card, reveal it, and put it into your hand. Then shuffle your library.\" This type is usually a subtype (as in \"mountaincycling\") but can be any card type, subtype, supertype, or combination thereof (as in \"basic landcycling\").\n702.29f Typecycling abilities are cycling abilities, and typecycling costs are cycling costs. Any cards that trigger when a player cycles a card will trigger when a card is discarded to pay an activation cost of a typecycling ability. Any effect that stops players from cycling cards will stop players from activating cards' typecycling abilities. Any effect that increases or reduces a cycling cost will increase or reduce a typecycling cost. Any effect that looks for a card with cycling will find a card with typecycling.","de":"Landumwandlung; Standardlandumwandlung"},{"name":"Landfall","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Landfall  -  Whenever a land enters the battlefield under your control, [effect].","beginner":"Triggers whenever you play a land.","desc":"Trigger whenever a land enters the battlefield under your control.","crfull":"207.2c An abil ld icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Leutnant"},{"name":"Lifelink","cat":"Keyword Ability","cr":"702.15","crtitle":"Lifelink","crshort":"Lifelink is a static ability. Damage dealt by a source with lifelink causes that source's controller, or its owner if it has no controller, to gain that much life (in addition to any other results that damage causes). See rule 120.3.","reminder":"Lifelink (Damage dealt by this creature also causes you to gain that much life.)","beginner":"You gain life equal to the damage this creature deals.","desc":"Damage dealt by this creature also causes you to gain that much life.","crfull":"702.15a Lifelink is a static ability.\n702.15b Damage dealt by a source with lifelink causes that source's controller, or its owner if it has no controller, to gain that much life (in addition to any other results that damage causes). See rule 120.3.\n702.15c If an object is no longer in the zone it's expected to be in as an effect causes it to deal damage, its last known information is used to determine whether it had lifelink.\n702.15d The lifelink rules fun elow the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Magiefertigkeit"},{"name":"Manifest","cat":"Keyword Action","cr":"701.40","crtitle":"Manifest","crshort":"To manifest a card, turn it face down. It becomes a 2/2 face-down creature card with no text, no name, no subtypes, and no mana cost. Put that card onto the battlefield face down. That permanent is a manifested permanent for as long as it remains face down.","reminder":"Manifest (Put that card onto the battlefield face down as a 2/2 creature. Turn it face up any time for its mana cost if it's a creature card.)","beginner":"Put a card face down as a 2/2 creature - flip it up later if it's a creature.","desc":"Put top card of library onto battlefield face down as 2/2 creature.","crfull":"701.40a To manifest a card, turn it face down. It becomes a 2/2 face-down creature card with no text, no name, no subtypes, and no mana cost. Put that card onto the battlefield face down. That permanent is a manifested permanent for as long as it remains face down. The effect defining its characteristics works while the card is face down and ends when it's turned face up.\n701.40b Any time you have priority, you may turn a manifested permanent you control face up. This is a special action that doesn't use the stack (see rule 116.2b). To do this, show all players that the card representing that permanent is a creature card and what that card's mana cost is, pay that cost, then turn the permanent face up. The effect defining its characteristics while it was face down ends, and it regains its normal characteristics. (If the card representing that permanent isn't a creature card or it doesn't have a mana cost, it can't be turned face up this way.)\n701.40c If a card with morph is manifested, its controller may turn that card face up using either the procedure described in rule 702.37e to turn a face-down permanent with morph face up or the procedure described above to turn a manifested permanent face up.\n701.40d If a card with disguise is manifested, its controller may turn that card face up using either the procedure described in rule 702.168d to turn a face-down permanent with disguise face up or the procedure described above to turn a manifested permanent face up.\n701.40e If an effect instructs a player to manifest multiple cards from their library, those cards are manifested one at a time.\n701.40f If an effect instructs a player to manifest a card and a rule or effect prohibits the face-down object from entering the battlefield, that card isn't manifested. Its characteristics remain unmodified and it remains in its previous zone. If it was face up, it remains face up.\n701.40g If a manifested permanent that's represented by an instant or sorcery card would turn face up, its controller reveals it and leaves it face down. Abilities that trigger whenever a permanent is turned face up won't trigger.\n701.40h See rule 708, \"Face-Down Spells and Permanents,\" for more information.","de":"Manifestieren"},{"name":"Manifest Dread","cat":"Keyword Action","cr":"701.62","crtitle":"Manifest Dread","crshort":"\"Manifest dread\" means \"Look at the top two cards of your library. Manifest one of them, then put the cards you looked at that were not manifested this way into your graveyard.\" See rule 701.40, \"Manifest.\"","reminder":"Manifest dread (Look at the top two cards of your library. Put one onto the battlefield face down as a 2/2 creature and the other into your graveyard. Turn that face-down permanent face up any time for its mana cost if it's a creature card.)","beginner":"Look at top two cards, manifest one face-down and mill the other.","desc":"Look at top 2 cards. Manifest one, graveyard the other.","crfull":"701.62a \"Manifest dread\" means \"Look at the top two cards of your library. Manifest one of them, then put the cards you looked at that were not manifested this way into your graveyard.\" See rule 701.40, \"Manifest.\"\n701.62b An ability that triggers whenever a player manifests dread triggers after the process described in rule 701.62a is complete, even if some or all of those actions were impossible.","de":"Grauen manifestieren"},{"name":"Map","cat":"Token","cr":"Glossary","crtitle":"","crshort":"A Map token is a colorless Map artifact token with \"{1}, {T}, Sacrifice this token: Target creature you control explores. Activate only as a sorcery.\" See rule 701.44, \"Explore.\" For more information about predefined tokens, see rule 111.10.","reminder":"Map tokens are artifact tokens with '{1}, {T}, Sacrifice this artifact: Target creature you control explores. Activate only as a sorcery.'","beginner":"A token you can sacrifice to make a creature explore.","desc":"Artifact Token. {1}, {T}, Sacrifice this: Target creature explores. Sorcery speed.","crfull":"A Map token is a colorless Map artifact token with \"{1}, {T}, Sacrifice this token: Target creature you control explores. Activate only as a sorcery.\" See rule 701.44, \"Explore.\" For more information about predefined tokens, see rule 111.10.","de":"Lageplan"},{"name":"Max Speed","cat":"Keyword Ability","cr":"702.178","crtitle":"Max Speed","crshort":"A max speed ability is a static ability. \"Max speed - [Ability]\" means \"As long as your speed is 4, this object has '[Ability].'\" See rule 702.179, \"Start Your Engines!\"","reminder":"Start your engines! (If you have no speed, it starts at 1. It increases once on each of your turns when an opponent loses life. Max speed is 4.)","beginner":"You gain a speed counter the first time an opponent loses life each turn; at speed 4 (max speed) the strongest abilities switch on.","desc":"Aetherdrift (2
