 identity (see rule 903.4).","de":"Schlagfertig"},{"name":"Replicate","cat":"Keyword Ability","cr":"702.56","crtitle":"Replicate","crshort":"Replicate is a keyword that represents two abilities. The first is a static ability that functions while the spell with replicate is on the stack. The second is a triggered ability that functions while the spell with replicate is on the stack.","reminder":"Replicate [cost] (When you cast this spell, copy it for each time you paid its replicate cost. You may choose new targets for the copies.)","beginner":"Pay extra to create additional copies of this spell.","desc":"When you cast this, copy it for each time you paid its replicate cost.","crfull":"702.56a Replicate is a keyword that represents two abilities. The first is a static ability that functions while the spell with replicate is on the stack. The second is a triggered ability that functions while the spell with replicate is on the stack. \"Replicate [cost]\" means \"As an additional cost to cast this spell, you may pay [cost] any number of times\" and \"When you cast this spell, if a replicate cost was paid for it, copy it for each time its replicate cost was paid. If the spell has any targets, you may choose new targets for any of the copies.\" Paying a spell's replicate cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.56b If a spell has multiple instances of replicate, each is paid separately and triggers based on the payments made for it, not any other instance of replicate.","de":"Reproduktion"},{"name":"Retrace","cat":"Keyword Ability","cr":"702.81","crtitle":"Retrace","crshort":"Retrace is a static ability that functions while the card with retrace is in a player's graveyard.","reminder":"Retrace (You may cast this card from your graveyard by discarding a land card in addition to paying its other costs.)","beginner":"Cast from your graveyard by discarding a land.","desc":"You may cast this card from your graveyard by discarding a land card in addition to paying cost.","crfull":"702.81a Retrace is a static ability that functions while the card with retrace is in a player's graveyard. \"Retrace\" means \"You may cast this card from your graveyard by discarding a land card as an additional cost to cast it.\" Casting a spell using its retrace ability follows the rules for paying additional costs in rules 601.2b and 601.2f-h.","de":"Zurückverfolgen"},{"name":"Reveal","cat":"Keyword Action","cr":"701.20","crtitle":"Reveal","crshort":"To reveal a card, show that card to all players for a brief time. If an effect causes a card to be revealed, it remains revealed for as long as necessary to complete the parts of the effect that card is relevant to.","reminder":"Reveal (Show a card to all players.)","beginner":"Show a card from a hidden zone to all players.","desc":"Show card to all players.","crfull":"701.20a To reveal a card, show that card to all players for a brief time. If an effect causes a card to be revealed, it remains revealed for as long as necessary to complete the parts of the effect that card is relevant to. If the cost to cast a spell or activate an ability includes revealing a card, or if a card is revealed because an ability is activated from a hidden zone (see rule 602.2a), the card remains revealed from the time the spell or ability is announced until the time it leaves the stack. If revealing a card causes a triggered ability to trigger, the card remains revealed until that triggered ability leaves the stack. If that ability isn't put onto the stack the next time a player would receive priority, the card ceases to be revealed.\n701.20b Revealing a card doesn't cause it to leave the zone it's in.\n701.20c A card that is currently revealed may be revealed again.\n701.20d If cards in a player's library are shuffled or otherwise reordered, any revealed cards that are reordered stop being revealed and become new objects.\n701.20e Some effects instruct a player to look at one or more cards. Looking at a card follows the same rules as revealing a card, except that the card is shown only to the specified player.","de":"Aufdecken; Offen vorzeigen"},{"name":"Revolt","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Revolt  -  [Effect] if a permanent you controlled left the battlefield this turn.","beginner":"Active if any of your permanents left the battlefield this turn.","desc":"Effect active if a permanent you controlled left the battlefield this turn.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Rebellion"},{"name":"Ring-bearer","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A designation that a creature can be given as the Ring tempts you. See rule 701.54, \"The Ring Tempts You.\"","reminder":"Whenever the Ring tempts you, you choose a creature you control to become your Ring-bearer. Your Ring-bearer gains the abilities the Ring has accumulated.","beginner":"The creature you pick to carry the Ring  -  it gets every Ring ability you've unlocked so far.","desc":"The Lord of the Rings: Tales of Middle-earth. A designation, not a counter or token. Chosen each time the Ring tempts you; only one Ring-bearer per player. Related to The Ring Tempts You.","crfull":"A designation that a creature can be given as the Ring tempts you. See rule 701.54, \"The Ring Tempts You.\"","de":"Ringträger"},{"name":"Riot","cat":"Keyword Ability","cr":"702.136","crtitle":"Riot","crshort":"Riot is a static ability. \"Riot\" means \"You may have this permanent enter with an additional +1/+1 counter on it. If you don't, it gains haste.\" If a permanent has multiple instances of riot, each works separately.","reminder":"Riot (This creature enters the battlefield with your choice of a +1/+1 counter or haste.)","beginner":"Choose whether this enters with a +1/+1 counter or haste.","desc":"Enters with your choice of a +1/+1 counter or haste.","crfull":"702.136a Riot is a static ability. \"Riot\" means \"You may have this permanent enter with an additional +1/+1 counter on it. If you don't, it gains haste.\"\n702.136b If a permanent has multiple instances of riot, each works separately.","de":"Aufruhr"},{"name":"Ripple","cat":"Keyword Ability","cr":"702.60","crtitle":"Ripple","crshort":"Ripple is a triggered ability that functions only while the card with ripple is on the stack.","reminder":"Ripple N (When you cast this spell, you may reveal the top N cards of your library. You may cast spells with the same name as this spell from among them without paying their mana costs. Put the rest on the bottom of your library.)","beginner":"When cast, reveal top N cards and cast copies of this spell for free from among them.","desc":"Reveal top N cards. You may cast cards with same name without paying mana cost.","crfull":"702.60a Ripple is a triggered ability that functions only while the card with ripple is on the stack. \"Ripple N\" means \"When you cast this spell, you may reveal the top N cards of your library, or, if there are fewer than N cards in your library, you may reveal all the cards in your library. If you reveal cards from your library this way, you may cast any of those cards with the same name as this spell without paying their mana costs, then put all revealed cards not cast this way on the bottom of your library in any order.\"\n702.60b If a spell has multiple instances of ripple, each triggers separately.","de":"Wallung"},{"name":"Role","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"Roles are colorless enchantment tokens. Each one has the Aura and Role subtypes and the enchant creature ability.","reminder":"Roles are enchantment tokens attached to creatures. Each creature can have only one Role at a time. When a new Role is attached, the previous one is put into its owner's graveyard.","beginner":"A special Aura token - creatures can only have one Role, new ones replace old ones.","desc":"Aura Token attached to creature. Only one Role per player per creature (oldest is graveyard). The six Roles are Cursed, Monster, Royal, Sorcerer, Wicked and Young Hero.","crfull":"Roles are colorless enchantment tokens. Each one has the Aura and Role subtypes and the enchant creature ability. If a permanent has more than one Role attached to it controlled by the same player, each of those Roles except the one with the most recent timestamp is put into its owner's graveyard. See rule 303.7 and rules 111.10j-r.","de":"Rolle"},{"name":"Roll to Visit","cat":"Keyword Action","cr":"701.52","crtitle":"Roll to Visit Your Attractions","crshort":"To roll to visit your Attractions, roll a six-sided die. Then if you control one or more Attractions with a number lit up that is equal to that result, each of those Attractions has been \"visited\" and its visit ability triggers.","reminder":"Roll to visit your Attractions (Roll a six-sided die. Visit each Attraction with that number lit up on its Lights.)","beginner":"Roll a die to trigger Attractions with that number (Un-sets mechanic).","desc":"Roll die. Trigger ability of Attraction with that number lit up.","crfull":"701.52a To roll to visit your Attractions, roll a six-sided die. Then if you control one or more Attractions with a number lit up that is equal to that result, each of those Attractions has been \"visited\" and its visit ability triggers. See rule 717, \"Attraction Cards,\" and rule 702.159, \"Visit.\"","de":""},{"name":"Sacrifice","cat":"Keyword Action","cr":"701.21","crtitle":"Sacrifice","crshort":"To sacrifice a permanent, its controller moves it from the battlefield directly to its owner's graveyard. A player can't sacrifice something that isn't a permanent, or something that's a permanent they don't control.","reminder":"Sacrifice (Put a permanent you control into its owner's graveyard.)","beginner":"Put one of your own permanents into your graveyard (can't be prevented).","desc":"Put a permanent you control into owner's graveyard. (Cannot be prevented).","crfull":"701.21a To sacrifice a permanent, its controller moves it from the battlefield directly to its owner's graveyard. A player can't sacrifice something that isn't a permanent, or something that's a permanent they don't control. Sacrificing a permanent doesn't destroy it, so regeneration or other effects that replace destruction can't affect this action.","de":"Opfern"},{"name":"Saddle","cat":"Keyword Ability","cr":"702.171","crtitle":"Saddle","crshort":"Saddle is an activated ability. \"Saddle N\" means \"Tap any number of other untapped creatures you control with total power N or greater: This permanent becomes saddled until end of turn. Activate only as a sorcery.\"","reminder":"Saddle N (Tap any number of other creatures you control with total power N or more: This Mount becomes saddled until end of turn. Saddle only as a sorcery.)","beginner":"Tap creatures with total power N to turn this Mount into a creature this turn.","desc":"Tap creatures with power N: Mount becomes a creature until end of turn. Sorcery speed.","crfull":"702.171a Saddle is an activated ability. \"Saddle N\" means \"Tap any number of other untapped creatures you control with total power N or greater: This permanent becomes saddled until end of turn. Activate only as a sorcery.\"\n702.171b Saddled is a designation that has no rules meaning other than to act as a marker that spells and abilities can identify. Only permanents can be or become saddled. Once a permanent has become saddled, it stays saddled until the end of the turn or it leaves the battlefield. Being saddled is not a part of the permanent's copiable values.\n702.171c A creature \"saddles\" a permanent as it's tapped to pay the cost to activate a permanent's saddle ability.","de":"Aufsatteln"},{"name":"Scavenge","cat":"Keyword Ability","cr":"702.97","crtitle":"Scavenge","crshort":"Scavenge is an activated ability that functions only while the card with scavenge is in a graveyard.","reminder":"Scavenge [cost] ([Cost], Exile this card from your graveyard: Put a number of +1/+1 counters equal to this card's power on target creature. Scavenge only as a sorcery.)","beginner":"Exile this from your graveyard to move its power as +1/+1 counters onto another creature.","desc":"{Cost}, Exile from graveyard: Put +1/+1 counters equal to power on target creature.","crfull":"702.97a Scavenge is an activated ability that functions only while the card with scavenge is in a graveyard. \"Scavenge [cost]\" means \"[Cost], Exile this card from your graveyard: Put a number of +1/+1 counters equal to the power of the card you exiled on target creature. Activate only as a sorcery.\"","de":"Ausplündern"},{"name":"Scry","cat":"Keyword Action","cr":"701.22","crtitle":"Scry","crshort":"To \"scry N\" means to look at the top N cards of your library, then put any number of them on the bottom of your library in any order and the rest on top of your library in any order.","reminder":"Scry N (Look at the top N cards of your library, then put any number of them on the bottom of your library and the rest on top in any order.)","beginner":"Look at the top N cards and rearrange them - send bad cards to the bottom.","desc":"Look at the top N cards of your library, then put any number of them on the bottom of your library and the rest on top in any order.","crfull":"701.22a To \"scry N\" means to look at the top N cards of your library, then put any number of them on the bottom of your library in any order and the rest on top of your library in any order.\n701.22b If a player is instructed to scry 0, no scry event occurs. Abilities that trigger whenever a player scries won't trigger.\n701.22c If multiple players scry at once, each of those players looks at the top cards of their library at the same time. Those players decide in APNAP order (see rule 101.4) where to put those cards, then those cards move at the same time.\n701.22d An ability that triggers whenever a player scries triggers after the process described in rule 701.22a is complete, even if some or all of those actions were impossible.","de":"Hellsicht"},{"name":"Search","cat":"Keyword Action","cr":"701.23","crtitle":"Search","crshort":"To search for a card in a zone, look at all cards in that zone (even if it's a hidden zone) and find a card that matches the given description.","reminder":"Search your library (Look through your library for a card that meets specific criteria.)","beginner":"Look through your library to find a specific card.","desc":"Look through library for a specific card.","crfull":"701.23a To search for a card in a zone, look at all cards in that zone (even if it's a hidden zone) and find a card that matches the given description.\n701.23b If a player is searching a hidden zone for cards with a stated quality, such as a card with a certain card type or color, that player isn't required to find some or all of those cards even if they're present in that zone.\n701.23c If a player is instructed to search a hidden zone for cards that match an undefined quality, that player may still search that zone but can't find any cards.\n701.23d If a player is searching a hidden zone simply for a quantity of cards, such as \"a card\" or \"three cards,\" that player must find that many cards (or as many as possible, if the zone doesn't contain enough cards).\n701.23e If the effect that contains the search instruction doesn't also contain instructions to reveal the found card(s), then they're not revealed.\n701.23f If searching a zone is replaced with searching a portion of that zone, any other instructions that refer to searching the zone still apply. Any abilities that trigger on a library being searched will trigger.\n701.23g If an effect offers a player a choice to search a zone and take additional actions with the cards found, that player may choose to search even if the additional actions are illegal or impossible.\n701.23h An effect may instruct a player to search a library for one or more cards more than once before instructing a player to shuffle that library. This is the same as a single instruction for that player to search that library for all those cards. The player searches that library only once.\n701.23i If multiple players search at once, each of those players looks at the appropriate cards at the same time, then those players decide in APNAP order (see rule 101.4) which card to find.\n701.23j If an effect instructs a player to search outside the game for a card, that player may choose an appropriate card they own from outside the game.","de":"Durchsuchen"},{"name":"Secret Council","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Secret council  -  Each player secretly votes for [options], then the votes are revealed and tallied.","beginner":"All players vote secretly at the same time, then reveal votes together.","desc":"Ability word. Each player secretly votes, then votes are revealed simultaneously.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Geheimes Konzil"},{"name":"Seek","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To seek a card, put a card matching the given criteria at random from your library into your hand. You don't search and the library isn't revealed or shuffled.","beginner":"A digital-only (Alchemy) tutor: you get a random matching card from your library, not one you pick.","desc":"Alchemy / digital-only. Put a random card matching the criteria from your library into your hand. Unlike a search, you don't choose and the library stays hidden.","crfull":"","de":""},{"name":"Set in Motion","cat":"Keyword Action","cr":"701.32","crtitle":"Set in Motion","crshort":"Only a scheme card may be set in motion, and only during an Archenemy game. Only the archenemy may set a scheme card in motion. See rule 314, \"Schemes,\" and rule 904, \"Archenemy.\"","reminder":"Set a scheme in motion (Move the top card of your scheme deck off that deck and turn it face up.)","beginner":"Reveal the top scheme card in Archenemy format.","desc":"Move a scheme off the top of your scheme deck and turn it face up in an Archenemy game.","crfull":"701.32a Only a scheme card may be set in motion, and only during an Archenemy game. Only the archenemy may set a scheme card in motion. See rule 314, \"Schemes,\" and rule 904, \"Archenemy.\"\n701.32b To set a scheme in motion, move it off the top of your scheme deck if it's on top of your scheme deck and turn it face up if it isn't face up. That scheme is considered to have been set in motion even if neither of these actions was performed on it.\n701.32c Schemes may only be set in motion one at a time. If a player is instructed to set multiple schemes in motion, that player sets a scheme in motion that many times.","de":""},{"name":"Shadow","cat":"Keyword Ability","cr":"702.28","crtitle":"Shadow","crshort":"Shadow is an evasion ability. A creature with shadow can't be blocked by creatures without shadow, and a creature without shadow can't be blocked by creatures with shadow. (See rule 509, \"Declare Blockers Step.\")","reminder":"Shadow (This creature can block or be blocked by only creatures with shadow.)","beginner":"Can only block or be blocked by other shadow creatures.","desc":"This creature can block or be blocked by only creatures with shadow.","crfull":"702.28a Shadow is an evasion ability.\n702.28b A creature with shadow can't be blocked by creatures without shadow, and a creature without shadow can't be blocked by creatures with shadow. (See rule 509, \"Declare Blockers Step.\")\n702.28c Multiple instances of shadow on the same creature are redundant.","de":"Irrealität"},{"name":"Shield","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Shield counters (If a permanent with a shield counter on it would be dealt damage or destroyed, remove a shield counter from it instead.)","beginner":"Counter that absorbs one instance of damage or destruction.","desc":"Counter. If permanent would be damaged or destroyed, remove a shield counter instead.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Schild"},{"name":"Shroud","cat":"Keyword Ability","cr":"702.18","crtitle":"Shroud","crshort":"Shroud is a static ability. \"Shroud\" means \"This permanent or player can't be the target of spells or abilities.\" Multiple instances of shroud on the same permanent or player are redundant.","reminder":"Shroud (This permanent can't be the target of spells or abilities.)","beginner":"Can't be targeted by any spells or abilities, including your own.","desc":"This permanent cannot be the target of spells or abilities.","crfull":"702.18a Shroud is a static ability. \"Shroud\" means \"This permanent or player can't be the target of spells or abilities.\"\n702.18b Multiple instances of shroud on the same permanent or player are redundant.","de":"Verhüllt"},{"name":"Shuffle","cat":"Keyword Action","cr":"701.24","crtitle":"Shuffle","crshort":"To shuffle a library or a face-down pile of cards, randomize the cards within it so that no player knows their order.","reminder":"Shuffle your library (Randomize the order of all cards in your library.)","beginner":"Randomize your deck.","desc":"Randomize the order of cards in library.","crfull":"701.24a To shuffle a library or a face-down pile of cards, randomize the cards within it so that no player knows their order.\n701.24b Some effects cause a player to search a library for a card or cards, shuffle that library, then put some or all of the found cards into a different zone or in a certain position in that library. In such cases, the found cards aren't included in the shuffle, even though they remain in the library at that time. Rather, all the cards in that library except those are shuffled. Abilities that trigger when a library is shuffled will still trigger. See also rule 401, \"Library.\"\n701.24c If an effect would cause a player to shuffle one or more specific objects into a library, that library is shuffled even if none of those objects are in the zone they're expected to be in or an effect causes all of those objects to be moved to another zone or remain in their current zone.\n701.24d If an effect would cause a player to shuffle a set of objects into a library, that library is shuffled even if there are no objects in that set.\n701.24e If an effect causes a player to shuffle a library containing zero or one cards, abilities that trigger when a library is shuffled will still trigger.\n701.24f If two or more effects cause a library to be shuffled multiple times simultaneously, abilities that trigger when that library is shuffled will trigger that many times.\n701.24g If an effect would cause a player to shuffle a library at the same time that an object would be put into a certain position in that library, the result is a shuffled library that's randomized except that the object is in the specified position.","de":"Mischen"},{"name":"Siege","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A battle subtype. Only an opponent of a Siege's controller can be its protector. When the last defense counter is removed, its controller exiles the Siege, then they may cast it transformed without paying its mana cost. See rule 310.12.","reminder":"Siege is a battle subtype. A Siege enters with defense counters under an opponent's protection. When the last defense counter is removed, it's exiled and you may cast the back face.","beginner":"A Battle card an opponent defends: attack it to strip its counters, and when they're gone you get to cast its other side.","desc":"Battle subtype (March of the Machine). Enters with defense counters and a protector (an opponent). Attackable. On losing its last defense counter, it is exiled and its controller may cast the back face.","crfull":"A battle subtype. Only an opponent of a Siege's controller can be its protector. When the last defense counter is removed, its controller exiles the Siege, then they may cast it transformed without paying its mana cost. See rule 310.12.","de":"Belagerung"},{"name":"Skulk","cat":"Keyword Ability","cr":"702.118","crtitle":"Skulk","crshort":"Skulk is an evasion ability. A creature with skulk can't be blocked by creatures with greater power. (See rule 509, \"Declare Blockers Step.\") Multiple instances of skulk on the same creature are redundant.","reminder":"Skulk (This creature can't be blocked by creatures with greater power.)","beginner":"Can only be blocked by creatures with equal or less power.","desc":"This creature can't be blocked by creatures with greater power.","crfull":"702.118a Skulk is an evasion ability.\n702.118b A creature with skulk can't be blocked by creatures with greater power. (See rule 509, \"Declare Blockers Step.\")\n702.118c Multiple instances of skulk on the same creature are redundant.","de":"Schleichen"},{"name":"Sneak","cat":"Keyword Ability","cr":"702.190","crtitle":"Sneak","crshort":"Sneak is a keyword that represents a static ability that functions while the spell with sneak is on the stack.","reminder":"Sneak [cost] (You may cast this spell for [cost] if you also return an unblocked attacking creature you control to its owner's hand during the declare blockers step.)","beginner":"Return an unblocked attacker to hand to cast this at a reduced cost.","desc":"You may cast this spell for (mana cost) if you also return an unblocked attacker you control to hand during the declare blockers step.","crfull":"702.190a Sneak is a keyword that represents a static ability that functions while the spell with sneak is on the stack. \"Sneak [cost]\" means \"Any time you could cast an instant during your declare blockers step, you may cast this spell by paying [cost] and returning an unblocked creature you control to its owner's hand rather than paying this spell's mana cost.\"\n702.190b A permanent spell whose sneak cost was paid enters the battlefield tapped and attacking (see rule 506.3a). It will be attacking the same player, planeswalker, or battle as the creature that was returned to its owner's hand to pay the sneak cost of the spell that became that permanent.","de":"Finte"},{"name":"Solved","cat":"Keyword Ability","cr":"702.169","crtitle":"Solved","crshort":"Solved is a keyword ability found on Case cards. See rule 719, \"Case Cards.\" \"Solved\" is followed by ability text. Together, they represent a static ability, a triggered ability, or an activated ability.","reminder":"To solve  -  [Condition]. (If unsolved, solve at the beginning of your end step.)","beginner":"A Case checks its condition at the end of your turn; once met it's solved and its bonus switches on.","desc":"Murders at Karlov Manor. Cases enter unsolved. At the beginning of your end step the game checks the 'to solve' condition, and if it is met the Case becomes solved permanently, enabling its solved ability.","crfull":"702.169a Solved is a keyword ability found on Case cards. See rule 719, \"Case Cards.\" \"Solved\" is followed by ability text. Together, they represent a static ability, a triggered ability, or an activated ability.\n702.169b For a static ability, \"Solved - [Ability text]\" means \"As long as this Case is solved, [ability text].\"\n702.169c For a triggered ability, \"Solved - [Ability text]\" means \"[Ability text]. This ability triggers only if this Case is solved.\"\n702.169d For an activated ability, \"Solved - [Ability text]\" means \"[Ability text]. Activate only if this Case is solved.\"","de":"Gelöst"},{"name":"Soulbond","cat":"Keyword Ability","cr":"702.95","crtitle":"Soulbond","crshort":"Soulbond is a keyword that represents two triggered abilities. \"Soulbond\" means \"When this creature enters, if you control both this creature and another creature and both are unpaired, you may pair this creature with another unpaired creature you control for...","reminder":"Soulbond (You may pair this creature with another unpaired creature when either enters the battlefield. They remain paired for as long as you control both of them.)","beginner":"Pair with another creature - both gain shared abilities while paired.","desc":"You may pair this with another unpaired creature. Both gain abilities while paired.","crfull":"702.95a Soulbond is a keyword that represents two triggered abilities. \"Soulbond\" means \"When this creature enters, if you control both this creature and another creature and both are unpaired, you may pair this creature with another unpaired creature you control for as long as both remain creatures on the battlefield under your control\" and \"Whenever another creature you control enters, if you control both that creature and this one and both are unpaired, you may pair that creature with this creature for as long as both remain creatures on the battlefield under your control.\"\n702.95b A creature becomes \"paired\" with another as the result of a soulbond ability. Abilities may refer to a paired creature, the creature another creature is paired with, or whether a creature is paired. An \"unpaired\" creature is one that is not paired.\n702.95c When the soulbond ability resolves, if either object that would be paired is no longer a creature, no longer on the battlefield, or no longer under the control of the player who controls the soulbond ability, neither object becomes paired.\n702.95d A creature can be paired with only one other creature.\n702.95e A paired creature becomes unpaired if any of the following occur: another player gains control of it or the creature it's paired with; it or the creature it's paired with stops being a creature; or it or the creature it's paired with leaves the battlefield.","de":"Seelengebunden"},{"name":"Soulshift","cat":"Keyword Ability","cr":"702.46","crtitle":"Soulshift","crshort":"Soulshift is a triggered ability. \"Soulshift N\" means \"When this permanent is put into a graveyard from the battlefield, you may return target Spirit card with mana value N or less from your graveyard to your hand.\"","reminder":"Soulshift N (When this permanent dies, you may return target Spirit card with mana value N or less from your graveyard to your hand.)","beginner":"When this dies, return a cheaper Spirit from your graveyard to hand.","desc":"When this dies, return Spirit card with lower mana value from graveyard to hand.","crfull":"702.46a Soulshift is a triggered ability. \"Soulshift N\" means \"When this permanent is put into a graveyard from the battlefield, you may return target Spirit card with mana value N or less from your graveyard to your hand.\"\n702.46b If a permanent has multiple instances of soulshift, each triggers separately.","de":"Seelenwanderung"},{"name":"Space Sculptor","cat":"Keyword Ability","cr":"702.158","crtitle":"Space Sculptor","crshort":"One card (Space Beleren) has the space sculptor ability. This keyword ability causes creatures to gain sector designations.","reminder":"Space Sculptor is an Unfinity mechanic that creates and modifies space sectors.","beginner":"A creature that creates space sectors in Unfinity (Un-set mechanic).","desc":"Creature creates space sectors (Unfinity mechanic).","crfull":"702.158a One card (Space Beleren) has the space sculptor ability. This keyword ability causes creatures to gain sector designations.\n702.158b A sector designation is a designation a permanent can have. The sector designations are alpha sector, beta sector, and gamma sector. Only permanents can have a sector designation. Once a permanent gets a sector designation, it keeps it until no player controls a permanent with space sculptor or an ability whose source has space sculptor. A sector designation is not part of the permanent's copiable values.\n702.158c Any time a permanent with space sculptor and any creatures without a sector designation are on the battlefield at the same time, each player who controls one or more of those creatures and doesn't control a permanent with space sculptor chooses a sector designation for each of those creatures they control. Then, each other player who controls one or more of those creatures chooses a sector designation for each of those creatures they control. This is a state-based action (see rule 704.5u).\n702.158d Some abilities include an instruction to choose a sector along with an instruction to perform an action on each creature in that sector. To do this, choose one of the three sector designations, then perform that action on each creature with that sector designation.\n702.158e Two permanents are in the same sector if each has the same sector designation.","de":""},{"name":"Specialize","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Specialize [cost] ([Cost], Discard a card: This permanent perpetually becomes the specialized version matching that card's color. Specialize only as a sorcery.)","beginner":"A digital-only (Alchemy) mechanic: discard a card to permanently upgrade this into a color-specific version.","desc":"Alchemy / digital-only. {Cost}, Discard a card: this permanent perpetually becomes the specialized version for the discarded card's color. Sorcery speed only.","crfull":"","de":""},{"name":"Spectacle","cat":"Keyword Ability","cr":"702.137","crtitle":"Spectacle","crshort":"Spectacle is a static ability that functions on the stack. \"Spectacle [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if an opponent lost life this turn.\" Casting a spell for its spectacle cost follows the rules for paying alternative...","reminder":"Spectacle [cost] (You may cast this spell for its spectacle cost rather than its mana cost if an opponent lost life this turn.)","beginner":"Cast this cheaper if an opponent lost any life this turn.","desc":"You may cast this for Spectacle cost if an opponent lost life this turn.","crfull":"702.137a Spectacle is a static ability that functions on the stack. \"Spectacle [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if an opponent lost life this turn.\" Casting a spell for its spectacle cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Spektakel"},{"name":"Spell Mastery","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Spell mastery  -  [Effect] if there are two or more instant and/or sorcery cards in your graveyard.","beginner":"Active when you have 2+ instant/sorcery cards in your graveyard.","desc":"Ability word. Effect active if you have two or more instant and/or sorcery cards in your graveyard.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Zauberkunst"},{"name":"Splice","cat":"Keyword Ability","cr":"702.47","crtitle":"Splice","crshort":"Splice is a static ability that functions while a card is in your hand. \"Splice onto [quality] [cost]\" means \"You may reveal this card from your hand as you cast a [quality] spell.","reminder":"Splice onto [quality] [cost] (As you cast a [quality] spell, you may reveal this card from your hand and pay its splice cost. If you do, add this card's effects to that spell.)","beginner":"Reveal this from your hand while casting an Arcane spell to add this effect to it.","desc":"Reveal this from hand, pay cost: Add this card's effects to target Arcane spell.","crfull":"702.47a Splice is a static ability that functions while a card is in your hand. \"Splice onto [quality] [cost]\" means \"You may reveal this card from your hand as you cast a [quality] spell. If you do, that spell gains the text of this card's rules text and you pay [cost] as an additional cost to cast that spell.\" Paying a card's splice cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.47b You can't choose to use a splice ability if you can't make the required choices (targets, etc.) for that card's rules text. You can't splice any one card onto the same spell more than once. If you're splicing more than one card onto a spell, reveal them all at once and choose the order in which their effects will happen. The effects of the main spell must happen first.\n702.47c The spell has the characteristics of the main spell, plus the rules text of each of the spliced cards. This is a text-changing effect (see rule 612, \"Text-Changing Effects\"). The spell doesn't gain any other characteristics (name, mana cost, color, supertypes, card types, subtypes, etc.) of the spliced cards. Text gained by the spell that refers to a card by name refers to the spell on the stack, not the card from which the text was copied.\n702.47d Choose targets for the added text normally (see rule 601.2c). Note that a spell with one or more targets won't resolve if all of its targets are illegal on resolution.\n702.47e The spell loses any splice changes once it leaves the stack for any reason.","de":"Kopplung; Arkane Kopplung"},{"name":"Split Second","cat":"Keyword Ability","cr":"702.61","crtitle":"Split Second","crshort":"Split second is a static ability that functions only while the spell with split second is on the stack. \"Split second\" means \"As long as this spell is on the stack, players can't cast other spells or activate abilities that aren't mana abilities.\"","reminder":"Split second (As long as this spell is on the stack, players can't cast spells or activate abilities that aren't mana abilities.)","beginner":"Once cast, this can't be responded to with other spells or abilities.","desc":"As long as this spell is on the stack, players can't cast spells or activate abilities.","crfull":"702.61a Split second is a static ability that functions only while the spell with split second is on the stack. \"Split second\" means \"As long as this spell is on the stack, players can't cast other spells or activate abilities that aren't mana abilities.\"\n702.61b Players may activate mana abilities and take special actions while a spell with split second is on the stack. Triggered abilities trigger and are put on the stack as normal while a spell with split second is on the stack.\n702.61c Multiple instances of split second on the same spell are redundant.","de":"Sekundenbruchteil"},{"name":"Spree","cat":"Keyword Ability","cr":"702.172","crtitle":"Spree","crshort":"Spree is a static ability found on some modal spells (see rule 700.2) that applies while the spell on the stack. Spree means \"Choose one or more modes. As an additional cost to cast this spell, pay the costs associated with those modes.\"","reminder":"Spree (Choose one or more additional costs.)","beginner":"Choose and pay for one or more modes when casting.","desc":"Choose one or more modes. Pay additional costs for each mode.","crfull":"702.172a Spree is a static ability found on some modal spells (see rule 700.2) that applies while the spell on the stack. Spree means \"Choose one or more modes. As an additional cost to cast this spell, pay the costs associated with those modes.\"\n702.172b Cards with the spree ability have a plus sign icon in the upper right corner of the card, and use a plus sign (+) rather than traditional bullet points. These symbols are a visual reminder that this card requires an additional cost to be cast, and do not have additional rules meaning.","de":"Exzess"},{"name":"Squad","cat":"Keyword Ability","cr":"702.157","crtitle":"Squad","crshort":"Squad is a keyword that represents two linked abilities. The first is a static ability that functions while the creature spell with squad is on the stack. The second is a triggered ability that functions when the creature with squad enters the battlefield.","reminder":"Squad [cost] (As an additional cost to cast this spell, you may pay [cost] any number of times. When this creature enters the battlefield, create that many tokens that are copies of it.)","beginner":"Pay extra when casting to create token copies when it enters.","desc":"You may pay extra cost any number of times. Create that many token copies.","crfull":"702.157a Squad is a keyword that represents two linked abilities. The first is a static ability that functions while the creature spell with squad is on the stack. The second is a triggered ability that functions when the creature with squad enters the battlefield. \"Squad [cost]\" means \"As an additional cost to cast this spell, you may pay [cost] any number of times\" and \"When this creature enters, if its squad cost was paid, create a token that's a copy of it for each time its squad cost was paid.\" Paying a spell's squad cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.157b If a spell has multiple instances of squad, each is paid separately. If a permanent has multiple instances of squad, each triggers based on the payments made for that squad ability as it was cast, not based on payments for any other instance of squad.","de":"Trupp"},{"name":"Start Your Engines!","cat":"Keyword Ability","cr":"702.179","crtitle":"Start Your Engines!","crshort":"Start your engines! is a static ability. If a player controls a permanent with start your engines! and that player has no speed, their speed becomes 1. This is a state-based action. See rule 704.","reminder":"Start your engines (If you have no speed counters, start with one. Then when an opponent loses life during your turn, add a speed counter. Max speed is 4.)","beginner":"Gain speed counters when opponents lose life, up to a maximum of 4.","desc":"If you have no speed, it starts at 1. It increases once on each of your turns when an opponent loses life. Max speed is 4.","crfull":"702.179a Start your engines! is a static ability. If a player controls a permanent with start your engines! and that player has no speed, their speed becomes 1. This is a state-based action. See rule 704.\n702.179b Players do not have speed until a rule or effect sets their speed to a specific value.\n702.179c If a player has no speed and they are instructed to increase their speed by a certain value, their speed becomes that value.\n702.179d There is an inherent triggered ability associated with a player having 1 or more speed. This ability has no source and is controlled by that player. That ability is \"Whenever one or more opponents lose life during your turn, if your speed is less than 4, your speed increases by 1. This ability triggers only once each turn.\"\n702.179e Rules and effects may refer to whether a player has \"max speed.\" A player has max speed if their speed is 4.\n702.179f Some effects refer to a player's speed. If that player has no speed, their speed is 0 for the purpose of an effect that refers to speed.","de":"Starte die Motoren"},{"name":"Station","cat":"Keyword Ability","cr":"702.184","crtitle":"Station","crshort":"Station is an activated ability. \"Station\" means \"Tap another untapped creature you control: Put a number of charge counters on this permanent equal to the tapped creature's power. Activate only as a sorcery.\"","reminder":"Station (Tap another creature you control: Put charge counters equal to its power on this Spacecraft. Station only as a sorcery. It's an artifact creature at N+.)","beginner":"Tap your creatures to load charge counters onto the Spacecraft; once it hits the printed threshold it becomes a creature itself.","desc":"Edge of Eternities (2025). Spacecraft and Planet keyword. Tap another creature you control to put charge counters equal to its power on this permanent, sorcery speed only. At the printed counter thresholds it turns on stronger abilities and becomes an artifact creature.","crfull":"702.184a Station is an activated ability. \"Station\" means \"Tap another untapped creature you control: Put a number of charge counters on this permanent equal to the tapped creature's power. Activate only as a sorcery.\"\n702.184b Each card printed with a station ability is known as a station card. It has a nonstandard layout and includes station symbols that are themselves keyword abilities. See rule 721, \"Station Cards.\"\n702.184c Static abilities may modify the result of a station ability by causing it to use a characteristic other than the tapped creature's power to determine the number of counters placed on the permanent with the station ability.","de":"Station"},{"name":"Storied","cat":"Keyword Ability","cr":"702.195","crtitle":"Storied","crshort":"Storied is a static ability. It means \"Any time you control three or more permanents that are artifacts, Sagas, and/or legendary and you don't have an enduring story, you have an enduring story for the rest of the game.\"","reminder":"Storied (If you control three or more artifacts, legendaries, and/or Sagas, you have an enduring story for the rest of the game.)","beginner":"Control three artifacts/legendaries/Sagas once and you permanently unlock the enduring story bonus.","desc":"Designation mechanic, like the city's blessing. Once you control three or more artifacts, legendary permanents and/or Sagas, you have an enduring story for the rest of the game.","crfull":"702.195a Storied is a static ability. It means \"Any time you control three or more permanents that are artifacts, Sagas, and/or legendary and you don't have an enduring story, you have an enduring story for the rest of the game.\"\n702.195b Enduring story is a designation that has no rules meaning other than to act as a marker that other rules and effects can identify. Any number of players may have the enduring story designation at the same time.\n702.195c After a player gets an enduring story, continuous effects are reapplied before the game checks to see if the game state or preceding events have matched any trigger conditions.","de":"Sagenumwoben"},{"name":"Storm","cat":"Keyword Ability","cr":"702.40","crtitle":"Storm","crshort":"Storm is a triggered ability that functions on the stack. \"Storm\" means \"When you cast this spell, copy it for each other spell that was cast before it this turn. If the spell has any targets, you may choose new targets for any of the copies.\"","reminder":"Storm (When you cast this spell, copy it for each spell cast before it this turn. You may choose new targets for the copies.)","beginner":"Copy this spell for each other spell cast this turn.","desc":"When you cast this, copy it for each spell cast before it this turn.","crfull":"702.40a Storm is a triggered ability that functions on the stack. \"Storm\" means \"When you cast this spell, copy it for each other spell that was cast before it this turn. If the spell has any targets, you may choose new targets for any of the copies.\"\n702.40b If a spell has multiple instances of storm, each triggers separately.","de":"Sturm"},{"name":"Strive","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Strive  -  This spell costs [cost] more to cast for each target beyond the first.","beginner":"Pay extra to target additional creatures or players.","desc":"Ability word. Pay extra cost for each target beyond the first.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Streben"},{"name":"Stun","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Stun counters (If a permanent with a stun counter would become untapped, remove one from it instead.)","beginner":"Counter that must be removed instead of untapping.","desc":"Counter. If permanent would untap, remove a stun counter instead.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Betäubung"},{"name":"Sunburst","cat":"Keyword Ability","cr":"702.44","crtitle":"Sunburst","crshort":"Sunburst is a static ability that functions as an object is entering the battlefield.","reminder":"Sunburst (This enters the battlefield with a +1/+1 counter or charge counter on it for each color of mana spent to cast it.)","beginner":"Gets counters based on how many different colors of mana you spent to cast it.","desc":"Enters with +1/+1 (or charge) counters for each color of mana spent to cast it.","crfull":"702.44a Sunburst is a static ability that functions as an object is entering the battlefield. \"Sunburst\" means \"If this object is entering as a creature, ignoring any type-changing effects that would affect it, it enters with a +1/+1 counter on it for each color of mana spent to cast it. Otherwise, it enters with a charge counter on it for each color of mana spent to cast it.\"\n702.44b Sunburst adds counters only if the object with sunburst is entering the battlefield from the stack as a resolving spell and only if one or more colored mana was spent on its costs, including additional or alternative costs.\n702.44c Sunburst can also be used to set a variable number for another ability. If the keyword is used in this way, it doesn't matter whether the ability is on a creature spell or on a noncreature spell.\n702.44d If an object has multiple instances of sunburst, each one works separately.","de":"Sonneneruption"},{"name":"Support","cat":"Keyword Action","cr":"701.41","crtitle":"Support","crshort":"\"Support N\" on a permanent means \"Put a +1/+1 counter on each of up to N other target creatures.\" \"Support N\" on an instant or sorcery spell means \"Put a +1/+1 counter on each of up to N target creatures.\"","reminder":"Support N (Put a +1/+1 counter on each of up to N target creatures.)","beginner":"Put a +1/+1 counter on up to N other creatures.","desc":"Put a +1/+1 counter on each of up to N other target creatures.","crfull":"701.41a \"Support N\" on a permanent means \"Put a +1/+1 counter on each of up to N other target creatures.\" \"Support N\" on an instant or sorcery spell means \"Put a +1/+1 counter on each of up to N target creatures.\"","de":"Beistand"},{"name":"Surge","cat":"Keyword Ability","cr":"702.117","crtitle":"Surge","crshort":"Surge is a static ability that functions while the spell with surge is on the stack.","reminder":"Surge [cost] (You may cast this spell for its surge cost if you or a teammate has cast another spell this turn.)","beginner":"Cast this cheaper if you or a teammate already cast a spell this turn.","desc":"You may cast for Surge cost if you or a teammate has cast a spell this turn.","crfull":"702.117a Surge is a static ability that functions while the spell with surge is on the stack. \"Surge [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost as you cast this spell if you or one of your teammates has cast another spell this turn.\" Casting a spell for its surge cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Schwall"},{"name":"Surveil","cat":"Keyword Action","cr":"701.25","crtitle":"Surveil","crshort":"To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.","reminder":"Surveil N (Look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.)","beginner":"Look at top N cards - mill some and keep others on top.","desc":"Look at top N cards. Put any number into graveyard, rest on top.","crfull":"701.25a To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.\n701.25b If an effect allows you to look at additional cards while you surveil, those cards are included among the cards you may put into your graveyard and on top of your library in any order.\n701.25c If a player is instructed to surveil 0, no surveil event occurs. Abilities that trigger whenever a player surveils won't trigger.\n701.25d An ability that triggers whenever a player surveils triggers after the process described in rule 701.25a is complete, even if some or all of those actions were impossible.","de":"Überwachen"},{"name":"Survival","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Survival  -  At the beginning of your second main phase, if this creature is tapped, [effect].","beginner":"Trigger during your second main phase if this is tapped (usually from attacking).","desc":"At second main phase, if tapped, trigger effect.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. reatures as an extra cost to unlock a bonus effect on this spell.","desc":"Optional additional cost: tap untapped creatures you control with total power N or greater to get the spell's teamwork bonus.","crfull":"702.194a Teamwork represents a static ability that functions while the spell with teamwork is on the stack. \"Teamwork N\" means \"As an additional cost to cast this spell, you may tap any number of creatures you control with total power N or more.\" Paying a spell's teamwork cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.194b Abilities may refer to a spell cast \"using teamwork\" or similar. Such phrases refer to whether the player who cast the spell declared the intention to pay the spell's teamwork cost as they cast that spell.\n702.194c If part of a spell's ability has its effect only if teamwork was used to cast it, and that part of the ability includes any targets, the spell's controller chooses those targets only if teamwork was used to cast that spell. Otherwise, the spell is cast as if it did not have those targets. See rule 601.2c.","de":"Teamwork"},{"name":"Tempting Offer","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Tempting offer  -  Each opponent may [accept the offer]. For each opponent who does, [effect]. Then you also [effect].","beginner":"Opponents choose whether to accept a benefit - you get it too, stronger if more accept.","desc":"Ability word. Each opponent may accept an offer. You and those who accept get a benefit.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but the es, it has \"Whenever your Ring-bearer deals combat damage to a player, each opponent loses 3 life.\"\n701.54d Some abilities trigger \"Whenever the Ring tempts you.\" The Ring tempts a player whenever they complete the actions in 701.54a, even if some or all of those actions were impossible.\n701.54e Some abilities check to see if a creature \"is your Ring-bearer.\" For the purposes of those abilities, that condition is true if that creature is on the battlefield under your control and has the Ring-bearer designation.","de":"Der Ring führt dich in Versuchung"},{"name":"Threshold","cat":"Ability Word","cr":"Glossary","crtitle":"","crshort":"\"Threshold\" used to be a keyword ability. It is now an ability word and has no rules meaning. All cards printed with the threshold keyword have received errata in the Oracle card reference.","reminder":"Threshold  -  [Effect] if seven or more cards are in your graveyard.","beginner":"Active when you have 7+ cards in your graveyard.","desc":"Effect active if you have seven or more cards in your graveyard.","crfull":"\"Threshold\" used to be a keyword ability. It is now an ability word and has no rules meaning. All cards printed with the threshold keyword have received errata in the Oracle card reference.","de":"Grenzwert"},{"name":"Ticket","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Ticket counters are a counter type on players. You can spend ticket counters to visit Attractions.","beginner":"Counters you spend to visit Attraction cards (Un-sets).","desc":"Counter on player. Spend them to visit Attractions.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect
