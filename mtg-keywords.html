 cards, that player puts that many cards from the top of their library into their graveyard.","crfull":"701.17a For a player to mill a number of cards, that player puts that many cards from the top of their library into their graveyard.\n701.17b A player can't mill a number of cards greater than the number of cards in their library. If given the choice to do so, they can't choose to take that action. If instructed to do so, they mill as many as possible. Similarly, the player can't pay a cost that includes milling a number of cards greater than the number of cards in their library.\n701.17c An effect that refers to a milled card can find that card in the zone it moved to from the library, as long as that zone is a public zone.\n701.17d Some spells and abilities mill a single card and then ask for information about the milled card. If more than one card is milled due to replacement effects and the effect of a spell or ability asks for information about the milled card, such as a characteristic or mana value, it gets information from each milled card and will get multiple answers. If these answers are used to determine the value of a variable, the sum of the answers is used. If that effect grants a player permission to cast or play \"that\" card, the permission applies to each of the milled cards. If that effect performs any actions on \"the\" card, it performs that action on each milled card. If that effect performs any actions on \"a\" card, the controller of the spell or ability chooses which card is affected.","de":"Millen"},{"name":"Miracle","cat":"Keyword Ability","cr":"702.94","crtitle":"Miracle","crshort":"Miracle is a static ability linked to a triggered ability. (See rule 603.11.) \"Miracle [cost]\" means \"You may reveal this card from your hand as you draw it if it's the first card you've drawn this turn.","reminder":"Miracle [cost] (You may cast this card for its miracle cost when you draw it if it's the first card you drew this turn.)","beginner":"If this is the first card you draw in a turn, you can cast it for its cheaper miracle cost.","desc":"You may cast this for Miracle cost if it's the first card you drew this turn.","crfull":"702.94a Miracle is a static ability linked to a triggered ability. (See rule 603.11.) \"Miracle [cost]\" means \"You may reveal this card from your hand as you draw it if it's the first card you've drawn this turn. When you reveal this card this way, you may cast it by paying [cost] rather than its mana cost.\"\n702.94b If a player chooses to reveal a card using its miracle ability, they play with that card revealed until that card leaves their hand, that ability resolves, or that ability otherwise leaves the stack. (See rule 701.20a.)","de":"Mirakulum"},{"name":"Mobilize","cat":"Keyword Ability","cr":"702.181","crtitle":"Mobilize","crshort":"Mobilize is a triggered ability. \"Mobilize N\" means \"Whenever this creature attacks, create N 1/1 red Warrior creature tokens. Those tokens enter tapped and attacking. Sacrifice them at the beginning of the next end step.\"","reminder":"Mobilize N (Whenever this creature attacks, create N tapped and attacking 1/1 red Warrior creature tokens. Sacrifice them at the beginning of the next end step.)","beginner":"Attacking brings along N temporary 1/1 Warriors that vanish at end of turn.","desc":"Tarkir: Dragonstorm (2025). On attack, create N tapped and attacking 1/1 red Warrior tokens, sacrificed at the beginning of the next end step. Good with sacrifice outlets and attack triggers.","crfull":"702.181a Mobilize is a triggered ability. \"Mobilize N\" means \"Whenever this creature attacks, create N 1/1 red Warrior creature tokens. Those tokens enter tapped and attacking. Sacrifice them at the beginning of the next end step.\"","de":"Mobilisieren"},{"name":"Modified","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A modified creature is a creature that has a counter on it, is equipped, or is enchanted by an Aura its controller also controls. See rule 700.9.","reminder":"Modified (A creature is modified if it has an Equipment or Aura attached to it or has a counter on it.)","beginner":"A creature is 'modified' if it's equipped, enchanted by your Aura, or has counters.","desc":"Ability word. Refers to a creature that is equipped, enchanted by an Aura you control, or has a counter on it.","crfull":"A modified creature is a creature that has a counter on it, is equipped, or is enchanted by an Aura its controller also controls. See rule 700.9.","de":"Modifiziert"},{"name":"Modular","cat":"Keyword Ability","cr":"702.43","crtitle":"Modular","crshort":"Modular represents both a static ability and a triggered ability. \"Modular N\" means \"This permanent enters with N +1/+1 counters on it\" and \"When this permanent is put into a graveyard from the battlefield, you may put a +1/+1 counter on target artifact creatu...","reminder":"Modular N (This creature enters the battlefield with N +1/+1 counters on it. When it dies, you may put its +1/+1 counters on target artifact creature.)","beginner":"When this dies, move its +1/+1 counters to another artifact creature.","desc":"Enters with N +1/+1 counters. When it dies, put its counters on target artifact creature.","crfull":"702.43a Modular represents both a static ability and a triggered ability. \"Modular N\" means \"This permanent enters with N +1/+1 counters on it\" and \"When this permanent is put into a graveyard from the battlefield, you may put a +1/+1 counter on target artifact creature for each +1/+1 counter on this permanent.\"\n702.43b If a creature has multiple instances of modular, each one works separately.","de":"Bausteine"},{"name":"Monarch","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"A designation a player can have. Some effects instruct a player to become the monarch. The monarch draws a card at the beginning of their end step. Dealing combat damage to the monarch steals the title from that player. See rule 725, \"The Monarch.\"","reminder":"The monarch is a designation a player can have. At the beginning of your end step, if you're the monarch, you draw a card. Whenever a creature deals combat damage to the monarch, its controller becomes the monarch.","beginner":"Being the monarch lets you draw an extra card each turn, but opponents can steal it by dealing combat damage to you.","desc":"Designation. At your end step, draw a card. If you take combat damage, attacker becomes Monarch.","crfull":"A designation a player can have. Some effects instruct a player to become the monarch. The monarch draws a card at the beginning of their end step. Dealing combat damage to the monarch steals the title from that player. See rule 725, \"The Monarch.\"","de":"Monarch"},{"name":"Monstrosity","cat":"Keyword Action","cr":"701.37","crtitle":"Monstrosity","crshort":"\"Monstrosity N\" means \"If this permanent isn't monstrous, put N +1/+1 counters on it and it becomes monstrous.\"","reminder":"Monstrosity N ([Cost]: If this creature isn't monstrous, put N +1/+1 counters on it and it becomes monstrous.)","beginner":"Pay once to make this permanently bigger and unlock 'monstrous' bonuses.","desc":"{Cost}: If not monstrous, put N +1/+1 counters on it and it becomes monstrous.","crfull":"701.37a \"Monstrosity N\" means \"If this permanent isn't monstrous, put N +1/+1 counters on it and it becomes monstrous.\"\n701.37b Monstrous is a designation that has no rules meaning other than to act as a marker that the monstrosity action and other spells and abilities can identify. Only permanents can be or become monstrous. Once a permanent becomes monstrous, it stays monstrous until it leaves the battlefield. Monstrous is neither an ability nor part of the permanent's copiable values.\n701.37c If a permanent's ability instructs a player to \"monstrosity X,\" other abilities of that permanent may also refer to X. The value of X in those abilities is equal to the value of X as that permanent became monstrous.","de":"Monstrum; Monströs"},{"name":"Morbid","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Morbid  -  [Effect] if a creature died this turn.","beginner":"Active if any creature died this turn.","desc":"Effect active if a creature died this turn.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Morbide"},{"name":"More Than Meets the Eye","cat":"Keyword Ability","cr":"702.162","crtitle":"More Than Meets the Eye","crshort":"More Than Meets the Eye represents a static ability that functions in any zone from which the spell may be cast.","reminder":"More Than Meets the Eye [cost] (You may cast this card converted for [cost].)","beginner":"Pay the alternate cost to cast this as its other mode (Transformers mechanic).","desc":"You may cast this card converted for its alternative cost.","crfull":"702.162a More Than Meets the Eye represents a static ability that functions in any zone from which the spell may be cast. \"More Than Meets the Eye [cost]\" means \"You may cast this card converted by paying [cost] rather than its mana cost.\" Casting a spell using its More Than Meets the Eye ability follows the rules for paying alternative costs (see 601.2b and 601.2f-h). See rule 701.28, \"Convert.\"","de":""},{"name":"Morph","cat":"Keyword Ability","cr":"702.37","crtitle":"Morph","crshort":"Morph is a static ability that functions in any zone from which you could play the card it's on, and the morph effect works any time the card is face down.","reminder":"Morph [cost] (You may cast this card face down as a 2/2 creature for {3}. Turn it face up any time for its morph cost.)","beginner":"Cast face-down as a 2/2 for 3 mana, then flip it up later by paying its morph cost.","desc":"Cast face down as 2/2 for {3}. Turn face up anytime for morph cost. See also megamorph, which adds a +1/+1 counter when turned face up.","crfull":"702.37a Morph is a static ability that functions in any zone from which you could play the card it's on, and the morph effect works any time the card is face down. \"Morph [cost]\" means \"You may cast this card as a 2/2 face-down creature with no text, no name, no subtypes, and no mana cost by paying {3} rather than paying its mana cost.\" (See rule 708, \"Face-Down Spells and Permanents.\")\n702.37b Megamorph is a variant of the morph ability. \"Megamorph [cost]\" means \"You may cast this card as a 2/2 face-down creature with no text, no name, no subtypes, and no mana cost by paying {3} rather than paying its mana cost\" and \"As this permanent is turned face up, put a +1/+1 counter on it if its megamorph cost was paid to turn it face up.\" A megamorph cost is a morph cost.\n702.37c To cast a card using its morph ability, turn it face down and announce that you're using a morph ability. It becomes a 2/2 face-down creature card with no text, no name, no subtypes, and no mana cost. Any effects or prohibitions that would apply to casting a card with these characteristics (and not the face-up card's characteristics) are applied to casting this card. These values are the copiable values of that object's characteristics. (See rule 613, \"Interaction of Continuous Effects,\" and rule 707, \"Copying Objects.\") Put it onto the stack (as a face-down spell with the same characteristics), and pay {3} rather than pay its mana cost. This follows the rules for paying alternative costs. You can use a morph ability to cast a card from any zone from which you could normally cast it. When the spell resolves, it enters the battlefield with the same characteristics the spell had. The morph effect applies to the face-down object wherever it is, and it ends when the permanent is turned face up.\n702.37d You can't normally cast a card face down. A morph ability allows you to do so.\n702.37e Any time you have priority, you may turn a face-down permanent you control with a morph ability face up. This is a special action; it doesn't use the stack (see rule 116). To do this, show all players what the permanent's morph cost would be if it were face up, pay that cost, then turn the permanent face up. (If the permanent wouldn't have a morph cost if it were face up, it can't be turned face up this way.) The morph effect on it ends, and it regains its normal characteristics. Any abilities relating to the permanent entering the battlefield don't trigger when it's turned face up and don't have any effect, because the permanent has already entered the battlefield.\n702.37f If a permanent's morph cost includes X, other abilities of that permanent may also refer to X. The value of X in those abilities is equal to the value of X chosen as the morph special action was taken.\n702.37g See rule 708, \"Face-Down Spells and Permanents,\" for more information about how to cast cards with a morph ability.","de":"Morph"},{"name":"Mountainwalk","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"See Landwalk.","reminder":"Mountainwalk (This creature can't be blocked as long as defending player controls a Mountain.)","beginner":"Can't be blocked if your opponent has a Mountain.","desc":"This creature is unblockable if defending player controls a Mountain.","crfull":"See Landwalk.","de":"Gebirgstarnung"},{"name":"Mutagen","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Mutagen tokens have '{1}, {T}, Sacrifice this token: Put a +1/+1 counter on target creature. Activate only as a sorcery.'","beginner":"An artifact token you can tap and sacrifice for 1 mana to put a +1/+1 counter on any creature.","desc":"Predefined Artifact Token  -  Mutagen. {1}, {T}, Sacrifice this: Put a +1/+1 counter on target creature. Activate only as a sorcery. (Introduced in Teenage Mutant Ninja Turtles 2026.)","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Mutagen"},{"name":"Mutate","cat":"Keyword Ability","cr":"702.140","crtitle":"Mutate","crshort":"Mutate appears on some creature cards. It represents a static ability that functions while the spell with mutate is on the stack. \"Mutate [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost.","reminder":"Mutate [cost] (If you cast this spell for its mutate cost, put it over or under target non-Human creature you own. They mutate into the creature on top plus all abilities from under it.)","beginner":"Cast this onto another creature to merge them into one super creature with combined abilities.","desc":"Cast this over or under target non-Human creature. They mutate into one creature.","crfull":"702.140a Mutate appears on some creature cards. It represents a static ability that functions while the spell with mutate is on the stack. \"Mutate [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost. If you do, it becomes a mutating creature spell and targets a non-Human creature with the same owner as this spell.\" Casting a spell using its mutate ability follows the rules for paying alternative costs (see 601.2b and 601.2f-h).\n702.140b As a mutating creature spell begins resolving, if its target is illegal, it ceases to be a mutating creature spell and continues resolving as a creature spell and will be put onto the battlefield under the control of the spell's controller.\n702.140c As a mutating creature spell resolves, if its target is legal, it doesn't enter the battlefield. Rather, it merges with the target creature and becomes one object represented by more than one card or token (see rule 730, \"Merging with Permanents\"). The spell's controller chooses whether the spell is put on top of the creature or on the bottom. The resulting permanent is a mutated permanent.\n702.140d An ability that triggers whenever a creature mutates triggers when a spell merges with a creature as a result of a resolving mutating creature spell.\n702.140e A mutated permanent has all abilities of each card and token that represents it. Its other characteristics are derived from the topmost card or token.\n702.140f Any effect that refers to or modifies the mutating creature spell refers to or modifies the mutated permanent it merges with as it resolves.","de":"Mutation"},{"name":"Myriad","cat":"Keyword Ability","cr":"702.116","crtitle":"Myriad","crshort":"Myriad is a triggered ability that may also create a delayed triggered ability. \"Myriad\" means \"Whenever this creature attacks, for each opponent other than defending player, you may create a token that's a copy of this creature that's tapped and attacking tha...","reminder":"Myriad (Whenever this creature attacks, for each opponent other than defending player, you may create a token that's a copy of this creature that's tapped and attacking that player or a planeswalker they control. Exile the tokens at end of combat.)","beginner":"When this attacks, create token copies attacking each other opponent, then exile them after combat.","desc":"Attack: Create token copies tapped and attacking each other opponent. Exile at end of combat.","crfull":"702.116a Myriad is a triggered ability that may also create a delayed triggered ability. \"Myriad\" means \"Whenever this creature attacks, for each opponent other than defending player, you may create a token that's a copy of this creature that's tapped and attacking that player or a planeswalker they control. If one or more tokens are created this way, exile the tokens at end of combat.\"\n702.116b If a creature has multiple instances of myriad, each triggers separately.","de":"Myriade"},{"name":"Nightbound","cat":"Keyword Ability","cr":"702.145","crtitle":"Daybound and Nightbound","crshort":"Daybound and nightbound are found on opposite faces of some double-faced cards (see rule 712, \"Double-Faced Cards\"). Daybound is found on the front faces of some double-faced cards and represents three static abilities.","reminder":"Nightbound (If a player casts at least two spells during their own turn, it becomes day next turn.)","beginner":"If it becomes day, this transforms back to its daybound side.","desc":"As it becomes day, if this permanent is back face up, transform it.","crfull":"702.145a Daybound and nightbound are found on opposite faces of some double-faced cards (see rule 712, \"Double-Faced Cards\").\n702.145b Daybound is found on the front faces of some double-faced cards and represents three static abilities. \"Daybound\" means \"If it is night and this permanent is represented by a double-faced card, it enters transformed,\" \"As it becomes night, if this permanent is front face up, transform it,\" and \"This permanent can't transform except due to its daybound ability.\" See rule 731, \"Day and Night.\"\n702.145c Any time a player controls a permanent that is front face up with daybound and it's night, that player transforms that permanent. This happens immediately and isn't a state-based action.\n702.145d Any time a player controls a permanent with daybound, if it's neither day nor night, it becomes day.\n702.145e Nightbound is found on the back faces of some double-faced cards and represents two static abilities. \"Nightbound\" means \"As it becomes day, if this permanent is back face up, transform it\" and \"This permanent can't transform except due to its nightbound ability.\"\n702.145f Any time a player controls a permanent that is back face up with nightbound and it's day, that player transforms that permanent. This happens immediately and isn't a state-based action.\n702.145g Any time a player controls a permanent with nightbound, if it's neither day nor night and there are no permanents with daybound on the battlefield, it becomes night.","de":"Nachtaktiv"},{"name":"Ninjutsu","cat":"Keyword Ability","cr":"702.49","crtitle":"Ninjutsu","crshort":"Ninjutsu is an activated ability that functions only while the card with ninjutsu is in a player's hand.","reminder":"Ninjutsu [cost] ([Cost], Return an unblocked attacker you control to hand: Put this card onto the battlefield from your hand tapped and attacking.)","beginner":"Return an unblocked attacker to your hand to sneak this creature into play attacking.","desc":"{Cost}, Return unblocked attacker to hand: Put this onto battlefield attacking.","crfull":"702.49a Ninjutsu is an activated ability that functions only while the card with ninjutsu is in a player's hand. \"Ninjutsu [cost]\" means \"[Cost], Reveal this card from your hand, Return an unblocked attacking creature you control to its owner's hand: Put this card onto the battlefield from your hand tapped and attacking.\"\n702.49b The card with ninjutsu remains revealed from the time the ability is announced until the ability leaves the stack.\n702.49c The creature put onto the battlefield with the ninjutsu ability enters attacking the same player, planeswalker, or battle as the creature that was returned to its owner's hand.\n702.49d Commander ninjutsu is a variant of the ninjutsu ability that also functions while the card with commander ninjutsu is in the command zone. \"Commander ninjutsu [cost]\" means \"[Cost], Reveal this card from your hand or from the command zone, Return an unblocked attacking creature you control to its owner's hand: Put this card onto the battlefield tapped and attacking.\"","de":"Ninjutsu"},{"name":"Nonbasic Landwalk","cat":"Keyword Ability","cr":"702.14","crtitle":"Landwalk","crshort":"Landwalk is a generic term that appears within an object's rules text as \"[type]walk,\" where [type] is usually a land type, but it can also be the card type land plus any combination of land types, card types, and/or supertypes.","reminder":"Nonbasic landwalk (This creature can't be blocked as long as defending player controls a nonbasic land.)","beginner":"Can't be blocked if your opponent has any nonbasic lands.","desc":"This creature is unblockable if defending player controls a nonbasic land.","crfull":"702.14a Landwalk is a generic term that appears within an object's rules text as \"[type]walk,\" where [type] is usually a land type, but it can also be the card type land plus any combination of land types, card types, and/or supertypes.\n702.14b Landwalk is an evasion ability.\n702.14c A creature with landwalk can't be blocked as long as the defending player controls at least one land with the specified land type (as in \"islandwalk\"), with the specified type or supertype (as in \"artifact landwalk\"), without the specified type or supertype (as in \"nonbasic landwalk\"), or with both the specified type or supertype and the specified subtype (as in \"snow swampwalk\"). (See rule 509, \"Declare Blockers Step.\")\n702.14d Landwalk abilities don't \"cancel\" one another.\n702.14e Multiple instances of the same kind of landwalk on the same creature are redundant.","de":"Nichtstandardlandtarnung"},{"name":"Offering","cat":"Keyword Ability","cr":"702.48","crtitle":"Offering","crshort":"Offering is a static ability that functions while the spell with offering is on the stack. \"[Quality] offering\" means \"As an additional cost to cast this spell, you may sacrifice a [quality] permanent.","reminder":"[Type] offering (You may cast this card any time you could cast an instant by sacrificing a [type] and paying the difference in mana costs between this and that creature. Mana cost includes color.)","beginner":"Sacrifice a creature of the specified type to cast this at instant speed for a reduced cost.","desc":"You may cast this any time you could cast an instant by sacrificing a [Type] and paying difference.","crfull":"702.48a Offering is a static ability that functions while the spell with offering is on the stack. \"[Quality] offering\" means \"As an additional cost to cast this spell, you may sacrifice a [quality] permanent. If you chose to pay the additional cost, this spell's total cost is reduced by the sacrificed permanent's mana cost, and you may cast this spell any time you could cast an instant.\"\n702.48b You choose which permanent to sacrifice as you make choices for the spell (see rule 601.2b), and you sacrifice that permanent as you pay the total cost (see rule 601.2h).\n702.48c Generic mana in the sacrificed permanent's mana cost reduces generic mana in the spell's total cost. Colored and colorless mana in the sacrificed permanent's mana cost reduces mana of the same type in spell's total cost, and any excess reduces that much generic mana in spell's total cost. (See rule 118.7.)","de":"Opfer"},{"name":"Offspring","cat":"Keyword Ability","cr":"702.175","crtitle":"Offspring","crshort":"Offspring represents two abilities. \"Offspring [cost]\" means \"You may pay an additional [cost] as you cast this spell\" and \"When this permanent enters, if its offspring cost was paid, create a token that's a copy of it, except it's 1/1.\"","reminder":"Offspring [cost] (You may pay an additional [cost] as you cast this spell. If you do, when this permanent enters the battlefield, create a 1/1 token copy of it.)","beginner":"Pay extra to create a 1/1 token copy when this enters.","desc":"You may pay extra cost. If you do, create a 1/1 token copy when this enters.","crfull":"702.175a Offspring represents two abilities. \"Offspring [cost]\" means \"You may pay an additional [cost] as you cast this spell\" and \"When this permanent enters, if its offspring cost was paid, create a token that's a copy of it, except it's 1/1.\"\n702.175b If a spell has multiple instances of offspring, each is paid separately and triggers based on the payments made for it, not any other instances of offspring.","de":"Nachwuchs"},{"name":"Oil","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Oil counters are a counter type used by Phyrexian cards for various abilities.","beginner":"A counter type used by Phyrexians for timing abilities or as a resource.","desc":"Counter used by Phyrexian cards for various abilities (timer, payment, scaling).","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Öl"},{"name":"Open an Attraction","cat":"Keyword Action","cr":"701.51","crtitle":"Open an Attraction","crshort":"A player may open an Attraction only during a game in which that player is playing with an Attraction deck (see rule 717, \"Attraction Cards\").","reminder":"Open an Attraction (Put the top card of your Attraction deck onto the battlefield.)","beginner":"Put the top card of your special Attraction deck onto the battlefield (Un-sets).","desc":"Put top card of your Attraction deck onto battlefield.","crfull":"701.51a A player may open an Attraction only during a game in which that player is playing with an Attraction deck (see rule 717, \"Attraction Cards\").\n701.51b To open an Attraction, move the top card of your Attraction deck off the Attraction deck, turn it face up, and put it onto the battlefield under your control.\n701.51c An ability which triggers whenever a player opens an Attraction triggers when that player puts an Attraction card onto the battlefield while performing the instruction in the above rule. If an effect prevents that Attraction from entering the battlefield or replaces entering the battlefield with another event, that ability doesn't trigger.","de":""},{"name":"Opus","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Opus  -  Whenever you cast an instant or sorcery spell, [effect]. If five or more mana was spent to cast that spell, [bigger effect].","beginner":"Whenever you cast an instant or sorcery spell, something happens. If you spent 5 or more mana on it, the effect is bigger.","desc":"Ability word. Triggers when you cast an instant or sorcery spell, with an enhanced effect if five or more mana was spent.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Opus"},{"name":"Outlast","cat":"Keyword Ability","cr":"702.107","crtitle":"Outlast","crshort":"Outlast is an activated ability. \"Outlast [cost]\" means \"[Cost], {T}: Put a +1/+1 counter on this creature. Activate only as a sorcery.\"","reminder":"Outlast [cost] ([Cost], {T}: Put a +1/+1 counter on this creature. Outlast only as a sorcery.)","beginner":"Tap this during your main phase to put a +1/+1 counter on it.","desc":"{Cost}, {T}: Put a +1/+1 counter on this. Sorcery speed.","crfull":"702.107a Outlast is an activated ability. \"Outlast [cost]\" means \"[Cost], {T}: Put a +1/+1 counter on this creature. Activate only as a sorcery.\"","de":"Standhaft"},{"name":"Overload","cat":"Keyword Ability","cr":"702.96","crtitle":"Overload","crshort":"Overload is a keyword that represents two static abilities that function while the spell with overload is on the stack.","reminder":"Overload [cost] (You may cast this spell for its overload cost. If you do, change its text by replacing all instances of \"target\" with \"each.\")","beginner":"Pay the overload cost to affect all valid targets instead of just one.","desc":"You may cast for Overload cost. If you do, change its text from 'target' to 'each'.","crfull":"702.96a Overload is a keyword that represents two static abilities that function while the spell with overload is on the stack. Overload [cost] means \"You may choose to pay [cost] rather than pay this spell's mana cost\" and \"If you chose to pay this spell's overload cost, change its text by replacing all instances of the word 'target' with the word 'each.'\" Casting a spell using its overload ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.96b If a player chooses to pay the overload cost of a spell, that spell won't require any targets. It may affect objects that couldn't be chosen as legal targets if the spell were cast without its overload cost being paid.\n702.96c Overload's second ability creates a text-changing effect. See rule 612, \"Text-Changing Effects.\"","de":"Überlast"},{"name":"Pack Tactics","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar funct e Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Verhandlungen"},{"name":"Partner","cat":"Keyword Ability","cr":"702.124","crtitle":"Partner","crshort":"Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins.","reminder":"Partner (You can have two commanders if both have Partner.)","beginner":"You can play with two commanders instead of one, provided they both have this ability.","desc":"You can have two commanders if both have Partner. Variants: partner with [name], friends forever, doctor's companion and choose a Background.","crfull":"702.124a Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins. Each partner ability allows you to designate two legendary cards as your commander rather than one. Each partner ability has its own requirements for those two commanders. The partner abilities are: partner, partner-[text], partner with [name], choose a Background, and Doctor's companion.\n702.124b Your deck must contain exactly 100 cards, including its two commanders. Both commanders begin the game in the command zone.\n702.124c A rule or effect that refers to your commander's color identity refers to the combined color identities of your two commanders. See rule 903.4.\n702.124d Except for determining the color identity of your commander, the two commanders function independently. When casting a commander with partner, ignore how many times your other commander has been cast (see rule 903.8). When determining whether a player has been dealt 21 or more combat damage by the same commander, consider damage from each of your two commanders separately (see rule 903.10a).\n702.124e If an effect refers to your commander while you have two commanders, it refers to either one. If an effect causes you to perform an action on your commander and it could affect both, you choose which it refers to at the time the effect is applied.\n702.124f Different partner abilities are distinct from one another and cannot be combined. For example, you cannot designate two cards as your commander if one of them has \"partner\" and the other has \"partner with [name].\"\n702.124g If a legendary card has more than one partner ability, you may choose which one to use when designating your commander, but you can't use both. Notably, no partner ability or combination of partner abilities can ever let a player have more than two commanders.\n702.124h \"Partner\" means \"You may designate two legendary cards as your commander rather than one if each of them has partner.\"\n702.124i \"Partner-[text]\" means \"You may designate two legendary cards as your commander rather than one if each of them has the same 'partner-[text]' ability.\" The \"partner-[text]\" abilities are \"partner-Character select,\" \"partner-Father & son,\" \"partner-Friends forever,\" and \"partner-Survivors.\"\n702.124j \"Partner with [name]\" represents two abilities. It means \"You may designate two legendary cards as your commander rather than one if each has a 'partner with [name]' ability with the other's name\" and \"When this permanent enters, target player may search their library for a card named [name], reveal it, put it into their hand, then shuffle.\"\n702.124k \"Choose a Background\" means \"You may designate two cards as your commander rather than one if one of them is this card and the other is a legendary Background enchantment card.\" You can't designate two cards as your commander if one has a \"choose a Background\" ability and the other is not a legendary Background enchantment card, and legendary Background enchantment cards can't be your commander unless you have also designated a commander with \"choose a Background.\"\n702.124m \"Doctor's companion\" means \"You may designate two legendary creature cards as your commander rather than one if one of them is this card and the other is a legendary Time Lord Doctor creature card that has no other creature types.\"\n702.124n If an effect refers to a partner ability by name, it means only that partner ability and not any others. If an effect refers to the partner ability or cards with partner and doesn't mention a specific variant of the partner ability by name, it is referring only to partner, partner-[text], partner with [name], or cards with any of those abilities, and it does not refer to any other partner variant.","de":"Partner"},{"name":"Partner With","cat":"Keyword Ability","cr":"702.124","crtitle":"Partner","crshort":"Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins.","reminder":"Partner with [name] (When this creature enters, target player may put [name] into their hand from their library, then shuffle.)","beginner":"A named pair: this card can share the commander slot with one specific other card, and fetches it when it enters.","desc":"Paired Partner variant. Both named cards may be your commanders together. On entry, target player may tutor the partner card to hand.","crfull":"702.124a Partner abilities are keyword abilities that modify the rules for deck construction in the Commander variant (see rule 903), and they function before the game begins. Each partner ability allows you to designate two legendary cards as your commander rather than one. Each partner ability has its own requirements for those two commanders. The partner abilities are: partner, partner-[text], partner with [name], choose a Background, and Doctor's companion.\n702.124b Your deck must contain exactly 100 cards, including its two commanders. Both commanders begin the game in the command zone.\n702.124c A rule or effect that refers to your commander's color identity refers to the combin
