ed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":""},{"name":"Tiered","cat":"Keyword Ability","cr":"702.183","crtitle":"Tiered","crshort":"Tiered is a static ability found on some modal spells (see rule 700.2) that applies while the spell is on the stack. Tiered means \"Choose one. As an additional cost to cast this spell, pay the cost associated with that mode.\"","reminder":"Tiered (Choose one additional cost.)","beginner":"Pick one of several extra costs when casting; bigger cost, bigger effect.","desc":"Final Fantasy (2025). The spell lists multiple additional costs in tiers; choose exactly one when casting. Higher tiers give stronger effects.","crfull":"702.183a Tiered is a static ability found on some modal spells (see rule 700.2) that applies while the spell is on the stack. Tiered means \"Choose one. As an additional cost to cast this spell, pay the cost associated with that mode.\"","de":"Stufenmagie"},{"name":"Time","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Time counters are a counter type used for Vanishing, Suspend, and Fading mechanics.","beginner":"Counters that track how long until something happens (used by Suspend, Vanishing, Fading).","desc":"Counter used for Vanishing, Suspend, and Fading.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Zeit; Zeitmarke"},{"name":"Time Travel","cat":"Keyword Action","cr":"701.56","crtitle":"Time Travel","crshort":"To time travel means to choose any number of permanents you control with one or more time counters on them and/or suspended cards you own in exile with one or more time counters on them and, for each of those objects, put a time counter on it or remove a time...","reminder":"Time travel (Choose a permanent you control with a time counter or counter on a player. Add or remove a time counter from it.)","beginner":"Add or remove a time counter from a permanent or player.","desc":"Add or remove a time counter from a permanent/player with one.","crfull":"701.56a To time travel means to choose any number of permanents you control with one or more time counters on them and/or suspended cards you own in exile with one or more time counters on them and, for each of those objects, put a time counter on it or remove a time counter from it. See rule 702.62, \"Suspend.\"","de":"Durch die Zeit reisen"},{"name":"Totem Armor","cat":"Keyword Ability","cr":"702.89","crtitle":"Umbra Armor","crshort":"Umbra armor is a static ability that appears on some Auras. \"Umbra armor\" means \"If enchanted permanent would be destroyed, instead remove all damage marked on it and destroy this Aura.\" Some older cards were printed with the ability \"totem armor\" or reference...","reminder":"Totem armor (If enchanted permanent would be destroyed, instead remove all damage from it and destroy this Aura.)","beginner":"Saves the enchanted permanent once by destroying this Aura instead.","desc":"If enchanted permanent would be destroyed, remove all damage and destroy this Aura instead.","crfull":"702.89a Umbra armor is a static ability that appears on some Auras. \"Umbra armor\" means \"If enchanted permanent would be destroyed, instead remove all damage marked on it and destroy this Aura.\"\n702.89b Some older cards were printed with the ability \"totem armor\" or referenced that ability. The text of these cards has been updated in the Oracle card reference to refer to umbra armor instead.","de":"Totembeistand"},{"name":"Toxic","cat":"Keyword Ability","cr":"702.164","crtitle":"Toxic","crshort":"Toxic is a static ability. It is written \"toxic N,\" where N is a number. Some rules and effects refer to a creature's \"total toxic value.\" A creature's total toxic value is the sum of all N values of toxic abilities that creature has.","reminder":"Toxic N (Players dealt combat damage by this creature also get N poison counters.)","beginner":"Gives poison counters equal to its toxic number when it deals combat damage.","desc":"Deals combat damage to players in the form of N poison counters.","crfull":"702.164a Toxic is a static ability. It is written \"toxic N,\" where N is a number.\n702.164b Some rules and effects refer to a creature's \"total toxic value.\" A creature's total toxic value is the sum of all N values of toxic abilities that creature has.\n702.164c Combat damage dealt to a player by a creature with toxic causes that creature's controller to give the player a number of poison counters equal to that creature's total toxic value, in addition to the damage's other results. See rule 120.3.","de":"Toxisch"},{"name":"Training","cat":"Keyword Ability","cr":"702.149","crtitle":"Training","crshort":"Training is a triggered ability. \"Training\" means \"Whenever this creature and at least one other creature with power greater than this creature's power attack, put a +1/+1 counter on this creature.\"","reminder":"Training (Whenever this creature attacks with another creature with greater power, put a +1/+1 counter on this creature.)","beginner":"Gets a +1/+1 counter when it attacks alongside a bigger creature.","desc":"Whenever this attacks with a creature of greater power, put a +1/+1 counter on this.","crfull":"702.149a Training is a triggered ability. \"Training\" means \"Whenever this creature and at least one other creature with power greater than this creature's power attack, put a +1/+1 counter on this creature.\"\n702.149b If a creature has multiple instances of training, each triggers separately.\n702.149c Some creatures with training have abilities that trigger when they train. \"When this creature trains\" means \"When a resolving training ability puts one or more +1/+1 counters on this creature.\"","de":"Training"},{"name":"Trample","cat":"Keyword Ability","cr":"702.19","crtitle":"Trample","crshort":"Trample is a static ability that modifies the rules for assigning an attacking creature's combat damage. The ability has no effect when a creature with trample is blocking or is dealing noncombat damage. (See rule 510, \"Combat Damage Step.\")","reminder":"Trample (This creature can deal excess combat damage to the player or planeswalker it's attacking.)","beginner":"Leftover damage after killing blockers carries through to the opponent.","desc":"Excess combat damage can be dealt to the defending player or planeswalker.","crfull":"702.19a Trample is a static ability that modifies the rules for assigning an attacking creature's combat damage. The ability has no effect when a creature with trample is blocking or is dealing noncombat damage. (See rule 510, \"Combat Damage Step.\")\n702.19b The controller of an attacking creature with trample first assigns damage to the creature(s) blocking it. Once all those blocking creatures are assigned lethal damage, any excess damage is assigned as its controller chooses among those blocking creatures and the player, planeswalker, or battle the creature is attacking. When checking for assigned lethal damage, take into account damage already marked on the creature and damage from other creatures that's being assigned during the same combat damage step, but not any abilities or effects that might change the amount of damage that's actually dealt. The attacking creature's controller need not assign lethal damage to all those blocking creatures but in that case can't assign any damage to the player or planeswalker it's attacking.\n702.19c Trample over planeswalkers is a variant of trample that modifies the rules for assigning combat damage to planeswalkers. The controller of a creature with trample over planeswalkers assigns that creature's combat damage as described in rule 702.19b, with one exception. If that creature is attacking a planeswalker, after lethal damage is assigned to all blocking creatures and damage at least equal to the loyalty of the planeswalker the creature is attacking is assigned to that planeswalker, further excess damage may be assigned as the attacking creature's controller chooses among those blocking creatures, that planeswalker, and that planeswalker's controller. When checking for assigned damage equal to a planeswalker's loyalty, take into account damage from other creatures that's being assigned during the same combat damage step, but not any abilities or effects that might change the amount of damage that's actually dealt.\n702.19d If an attacking creature with trample or trample over planeswalkers is blocked, but there are no creatures blocking it when damage is assigned, its damage is assigned to the defending player and/or planeswalker as though all blocking creatures have been assigned lethal damage.\n702.19e If a creature with trample over planeswalkers is attacking a planeswalker and that planeswalker is removed from combat, the creature's damage may be assigned to the defending player once all blocking creatures have been dealt lethal damage or, if there are no blocking creatures when damage is assigned, all its damage is assigned to the defending player. This is an exception to rule 506.4c, and it does not cause the creature to be attacking that player.\n702.19f If a creature without trample over planeswalkers is attacking a planeswalker, none of its combat damage can be assigned to the defending player, even if that planeswalker has been removed from combat or the damage the attacking creature could assign is greater than the planeswalker's loyalty.\n702.19g Multiple instances of trample on the same creature are redundant. Multiple instances of trample over planeswalkers on the same creature are redundant.","de":"Verursacht Trampelschaden; Trampelschaden"},{"name":"Transfigure","cat":"Keyword Ability","cr":"702.71","crtitle":"Transfigure","crshort":"Transfigure is an activated ability. \"Transfigure [cost]\" means \"[Cost], Sacrifice this permanent: Search your library for a creature card with the same mana value as this permanent and put it onto the battlefield. Then shuffle your library.","reminder":"Transfigure [cost] ([Cost], Sacrifice this creature: Search your library for a creature card with the same mana value as this creature, put that card onto the battlefield, then shuffle. Transfigure only as a sorcery.)","beginner":"Sacrifice this to tutor a creature with the same mana value directly onto the battlefield.","desc":"{Cost}, Sacrifice this: Search library for creature with same mana value and put onto battlefield.","crfull":"702.71a Transfigure is an activated ability. \"Transfigure [cost]\" means \"[Cost], Sacrifice this permanent: Search your library for a creature card with the same mana value as this permanent and put it onto the battlefield. Then shuffle your library. Activate only as a sorcery.\"","de":"Umgestalten"},{"name":"Transform","cat":"Keyword Action","cr":"701.27","crtitle":"Transform","crshort":"To transform a permanent, turn it over so that its other face is up. Only permanents represented by double-faced tokens and double-faced cards can transform. (See rule 712, \"Double-Faced Cards.\")","reminder":"Transform (Turn this card to its other face.)","beginner":"Flip a double-faced card to its other side.","desc":"Turn a double-faced card to its other face.","crfull":"701.27a To transform a permanent, turn it over so that its other face is up. Only permanents represented by double-faced tokens and double-faced cards can transform. (See rule 712, \"Double-Faced Cards.\")\n701.27b Although transforming a permanent uses the same physical action as turning a permanent face up or face down, they are different game actions. Abilities that trigger when a permanent is turned face down won't trigger when that permanent transforms, and so on.\n701.27c If a spell or ability instructs a player to transform a permanent that isn't represented by a double-faced token or a double-faced card, nothing happens.\n701.27d If a spell or ability instructs a player to transform a permanent, and the face that permanent would transform into is an instant or sorcery face nothing happens.\n701.27e Some triggered abilities trigger when an object \"transforms into\" an object with a specified characteristic. Such an ability triggers if the object either transforms or converts (see rule 701.28) and has the specified characteristic immediately after it does so.\n701.27f If an activated or triggered ability of a permanent that isn't a delayed triggered ability of that permanent tries to transform it, the permanent does so only if it hasn't transformed or converted since the ability was put onto the stack. If a delayed triggered ability of a permanent tries to transform that permanent, the permanent does so only if it hasn't transformed or converted since that delayed triggered ability was created. In both cases, if the permanent has already transformed or converted, an instruction to do either is ignored.\n701.27g Some spells and abilities refer to a \"transformed permanent.\" This phrase refers to a double-faced permanent on the battlefield with its back face up. A permanent with its front face up is never considered a transformed permanent, even if it had its back face up previously. Similarly, an object represented by more than one card, such as a melded or merged permanent, is never considered a transformed permanent, even if it has components that are back face up. See rules 701.42, \"Meld,\" and 730, \"Merging with Permanents.\"","de":"Transformieren"},{"name":"Transmute","cat":"Keyword Ability","cr":"702.53","crtitle":"Transmute","crshort":"Transmute is an activated ability that functions only while the card with transmute is in a player's hand.","reminder":"Transmute [cost] ([Cost], Discard this card: Search your library for a card with the same mana value as this card, reveal it, put it into your hand, then shuffle. Transmute only as a sorcery.)","beginner":"Discard this to search for any card with the same mana value.","desc":"{Cost}, Discard this: Search library for card with same mana value.","crfull":"702.53a Transmute is an activated ability that functions only while the card with transmute is in a player's hand. \"Transmute [cost]\" means \"[Cost], Discard this card: Search your library for a card with the same mana value as the discarded card, reveal that card, and put it into your hand. Then shuffle your library. Activate only as a sorcery.\"\n702.53b Although the transmute ability can be activated only if the card is in a player's hand, it continues to exist while the object is on the battlefield and in all other zones. Therefore objects with transmute will be affected by effects that depend on objects having one or more activated abilities.","de":"Transmutation"},{"name":"Treasure","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Treasure tokens have '{T}, Sacrifice this artifact: Add one mana of any color.'","beginner":"An artifact token that sacrifices for one mana of any color.","desc":"Artifact Token. {T}, Sacrifice this: Add one mana of any color.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Schatz"},{"name":"Tribute","cat":"Keyword Ability","cr":"702.104","crtitle":"Tribute","crshort":"Tribute is a static ability that functions as the creature with tribute is entering the battlefield. \"Tribute N\" means \"As this creature enters, choose an opponent. That player may put an additional N +1/+1 counters on it as it enters.\"","reminder":"Tribute N (As this creature enters the battlefield, an opponent of your choice may put N +1/+1 counters on it.)","beginner":"Opponent chooses: make this bigger or trigger an alternative effect.","desc":"Opponent chooses: Put +1/+1 counters on this, or an alternative effect happens.","crfull":"702.104a Tribute is a static ability that functions as the creature with tribute is entering the battlefield. \"Tribute N\" means \"As this creature enters, choose an opponent. That player may put an additional N +1/+1 counters on it as it enters.\"\n702.104b Objects with tribute have triggered abilities that check \"if tribute wasn't paid.\" This condition is true if the opponent chosen as a result of the tribute ability didn't have the creature enter the battlefield with +1/+1 counters as specified by the creature's tribute ability.","de":"Tribut"},{"name":"Triple","cat":"Keyword Action","cr":"701.11","crtitle":"Triple","crshort":"Tripling a creature's power and/or toughness creates a continuous effect. This effect modifies that creature's power and/or toughness but doesn't set those characteristics to a specific value. See rule 613.4c.","reminder":"To triple a number is to add twice that number to it.","beginner":"Make a value three times as large.","desc":"Multiply a value by three. Parallel keyword action to Double. Used for damage, counters, life totals and similar values.","crfull":"701.11a Tripling a creature's power and/or toughness creates a continuous effect. This effect modifies that creature's power and/or toughness but doesn't set those characteristics to a specific value. See rule 613.4c.\n701.11b To triple a creature's power, that creature gets +X/+0, where X is twice that creature's power as the spell or ability that triples its power resolves. Similarly, an effect that triples a creature's toughness gives it +0/+X, where X is twice that creature's toughness. Tripling a creature's power and toughness gives it +X/+Y, where X is twice its power and Y is twice its toughness.\n701.11c If a creature's power is less than 0 when it's tripled, tripling that creature's power instead means that the creature gets -X/-0, where X is twice the difference between 0 and its power. Similarly, if its toughness is less than 0 when tripled, it gets -0/-X. If one characteristic's value is negative but the other isn't when both are tripled, it gets -X/+Y or +X/-Y, as appropriate.","de":"Verdreifachen"},{"name":"Typecycling","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"A variant of the cycling ability. See rule 702.29, \"Cycling.\"","reminder":"[Type]cycling [cost] ([Cost], Discard this card: Search your library for a [type] card, reveal it, put it into your hand, then shuffle.)","beginner":"Discard this to search for a card of a specific type.","desc":"{Cost}, Discard this: Search for card of specific type. Variants include basic landcycling, plainscycling, islandcycling, swampcycling, mountaincycling, forestcycling, slivercycling, wizardcycling, halflingcycling and affinitycycling.","crfull":"A variant of the cycling ability. See rule 702.29, \"Cycling.\"","de":"Typumwandlung; Ebenenumwandlung; Inselumwandlung; Sumpfumwandlung; Gebirgsumwandlung; Waldumwandlung"},{"name":"Umbra Armor","cat":"Keyword Ability","cr":"702.89","crtitle":"Umbra Armor","crshort":"Umbra armor is a static ability that appears on some Auras. \"Umbra armor\" means \"If enchanted permanent would be destroyed, instead remove all damage marked on it and destroy this Aura.\"","reminder":"Umbra armor (Same as Totem armor: If enchanted permanent would be destroyed, instead remove all damage from it and destroy this Aura.)","beginner":"Alternative name for Totem Armor - protects enchanted permanent.","desc":"If enchanted permanent would be destroyed, remove all damage and destroy this Aura instead.","crfull":"702.89a Umbra armor is a static ability that appears on some Auras. \"Umbra armor\" means \"If enchanted permanent would be destroyed, instead remove all damage marked on it and destroy this Aura.\"\n702.89b Some older cards were printed with the ability \"totem armor\" or referenced that ability. The text of these cards has been updated in the Oracle card reference to refer to umbra armor instead.","de":"Totembeistand; Schattenbeistand"},{"name":"Undaunted","cat":"Keyword Ability","cr":"702.125","crtitle":"Undaunted","crshort":"Undaunted is a static ability that functions while the spell with undaunted is on the stack. Undaunted means \"This spell costs {1} less to cast for each opponent you have.\"","reminder":"Undaunted (This spell costs {1} less to cast for each opponent.)","beginner":"Costs less in multiplayer games based on number of opponents.","desc":"This spell costs {1} less to cast for each opponent.","crfull":"702.125a Undaunted is a static ability that functions while the spell with undaunted is on the stack. Undaunted means \"This spell costs {1} less to cast for each opponent you have.\"\n702.125b Players who have left the game are not counted when determining how many opponents you have.\n702.125c If a spell has multiple instances of undaunted, each of them applies.","de":"Unverzagt"},{"name":"Undercity","cat":"Rules Term","cr":"726","crtitle":"","crshort":"The initiative is a designation a player can have. There is no initiative in a game until an effect instructs a player to take the initiative. A player who currently has the initiative designation is said to have the initiative.","reminder":"Undercity is a dungeon associated with the initiative. A player who takes the initiative ventures into the Undercity.","beginner":"The special dungeon tied to the Initiative mechanic  -  taking the initiative moves you through it.","desc":"Commander Legends: Battle for Baldur's Gate. A dungeon entered by taking or keeping the initiative, rather than by Venture into the Dungeon. Related to Initiative and Venture into the Dungeon.","crfull":"726.1. The initiative is a designation a player can have. There is no initiative in a game until an effect instructs a player to take the initiative. A player who currently has the initiative designation is said to have the initiative.\n726.2. There are three inherent triggered abilities associated with having the initiative. These triggered abilities have no source and are controlled by the player who had the initiative at the time the abilities triggered. This is an exception to rule 113.8. The full text of these abilities are \"At the beginning of the upkeep of the player who has the initiative, that player ventures into Undercity,\" \"Whenever one or more creatures a player controls deal combat damage to the player who has the initiative, the controller of those creatures takes the initiative,\" and \"Whenever a player takes the initiative, that player ventures into Undercity.\" See rule 701.49, \"Venture into the Dungeon.\"\n726.3. Only one player can have the initiative at a time. As a player takes the initiative, the player who currently has the initiative ceases to have it.\n726.4. If the player who has the initiative leaves the game, the active player takes the initiative at the same time that player leaves the game. If the active player is leaving the game or if there is no active player, the next player in turn order takes the initiative.\n726.5. If the player who currently has the initiative is instructed to take the initiative, this causes the last triggered ability in 726.2 to trigger but does not create a second initiative designation.","de":""},{"name":"Undergrowth","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Undergrowth  -  [Effect] for each creature card in your graveyard.","beginner":"Effect scales based on how many creatures are in your graveyard.","desc":"Effect based on number of creature cards in your graveyard.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Totenwelt"},{"name":"Undying","cat":"Keyword Ability","cr":"702.93","crtitle":"Undying","crshort":"Undying is a triggered ability. \"Undying\" means \"When this permanent is put into a graveyard from the battlefield, if it had no +1/+1 counters on it, return it to the battlefield under its owner's control with a +1/+1 counter on it.\"","reminder":"Undying (When this creature dies, if it had no +1/+1 counters on it, return it to the battlefield under its owner's control with a +1/+1 counter on it.)","beginner":"When this dies, it comes back once with a +1/+1 counter.","desc":"When this dies, if it had no +1/+1 counters, return it with a +1/+1 counter.","crfull":"702.93a Undying is a triggered ability. \"Undying\" means \"When this permanent is put into a graveyard from the battlefield, if it had no +1/+1 counters on it, return it to the battlefield under its owner's control with a +1/+1 counter on it.\"","de":"Unverwüstlich"},{"name":"Unearth","cat":"Keyword Ability","cr":"702.8 th the most votes or tied for most votes wins.)","beginner":"All players vote on options - majority or tie wins.","desc":"Players choose an option for an effect.","crfull":"701.38a Some spells and abilities instruct players to vote for one choice from a list of options to determine some aspect of the effect of that spell or ability. To vote, each player, starting with a specified player and proceeding in turn order, chooses one of those choices.\n701.38b The listed choices may be objects, words with no rules meaning that are each connected to a different effect, or other variables relevant to the resolution of the spell or ability.\n701.38c If the text of a spell or ability refers to \"voting,\" it refers only to an actual vote, not to any spell or ability that involves the players making choices or decisions without using the word \"vote.\"\n701.38d If an effect gives a player multiple votes, those votes all happen at the same time the player would otherwise have voted.","de":"Abstimmen"},{"name":"Walker","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Walker tokens are 2/2 black Zombie creature tokens.","beginner":"A 2/2 black Zombie creature token.","desc":"Create a Walker token (2/2 black Zombie).","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":""},{"name":"Ward","cat":"Keyword Ability","cr":"702.21","crtitle":"Ward","crshort":"Ward is a triggered ability. Ward [cost] means \"Whenever this permanent becomes the target of a spell or ability an opponent controls, counter that spell or ability unless that player pays [cost].\"","reminder":"Ward [cost] (Whenever this permanent becomes the target of a spell or ability an opponent controls, counter it unless that player pays [cost].)","beginner":"Opponents must pay a cost to target this, or their spell/ability is countered.","desc":"Counter spell/ability targeting this unless opponent pays cost.","crfull":"702.21a Ward is a triggered ability. Ward [cost] means \"Whenever this permanent becomes the target of a spell or ability an opponent controls, counter that spell or ability unless that player pays [cost].\"\n702.21b Some ward abilities include an X in their cost and state what X is equal to. This value is determined at the time the ability resolves, not locked in as the ability triggers.","de":"Abwehr"},{"name":"Warp","cat":"Keyword Ability","cr":"702.185","crtitle":"Warp","crshort":"Warp represents two static abilities that function while the card with warp is on the stack, one of which may create a delayed triggered ability.","reminder":"Warp [cost] (You may cast this spell by paying [cost] rather than its mana cost. If you do, exile the permanent it becomes at the beginning of the next end step. You may cast it from exile on a later turn.)","beginner":"Pay an alternative cost to cast this spell instead of its normal mana cost. The trade-off: the card gets exiled when it's done instead of going to your graveyard.","desc":"Alternative casting mechanic. Warp [cost]: You may cast this spell by paying its warp cost rather than its mana cost. If you do, the permanent it becomes is exiled at the beginning of the next end step, becoming a 'warped card.' You may then cast it from exile on a later turn.","crfull":"702.185a Warp represents two static abilities that function while the card with warp is on the stack, one of which may create a delayed triggered ability. \"Warp [cost]\" means \"You may cast this card from your hand by paying [cost] rather than its mana cost\" and \"If this spell's warp cost was paid, exile the permanent this spell becomes at the beginning of the next end step. Its owner may cast this card after the current turn has ended for as long as it remains exiled.\" Casting a spell for its warp cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.185b Some effects refer to \"warped\" cards in exile. A warped card in exile is one that was exiled by the delayed triggered ability created by a warp ability.\n702.185c Some effects refer to whether \"a spell was warped this turn.\" This means that a spell was cast for its warp cost this turn.","de":"Warp"},{"name":"Waterbend","cat":"Keyword Action","cr":"701.67","crtitle":"Waterbend","crshort":"\"Waterbend [cost]\" means \"Pay [cost]. For each generic mana in that cost, you may tap an untapped artifact or creature you control rather than pay that mana.\"","reminder":"Waterbend (You may pay generic mana costs by tapping untapped artifacts and/or creatures you control.)","beginner":"Tap your artifacts or creatures to pay for generic mana costs (convoke variant).","desc":"Pay generic mana costs by tapping untapped artifacts or creatures you control.","crfull":"701.67a \"Waterbend [cost]\" means \"Pay [cost]. For each generic mana in that cost, you may tap an untapped artifact or creature you control rather than pay that mana.\"\n701.67b If a waterbend cost is part of the total cost to cast a spell or activate an ability (usually because the waterbend cost itself is an additional cost), the alternate method to pay for mana described in rule 701.67a may be used only to pay for the amount of generic mana in the waterbend cost, even if the total cost to cast that spell or activate that ability includes other generic mana components.\n701.67c An ability that triggers whenever a player waterbends triggers whenever that player pays a waterbend cost, regardless of how they paid that cost.","de":"Wasserbändigen"},{"name":"Web-slinging","cat":"Keyword Ability","cr":"702.188","crtitle":"Web-slinging","crshort":"Web-slinging is a static ability that functions while the spell with web-slinging is on the stack.","reminder":"Web-slinging is an alternative casting cost mechanic from the Spider-Man set.","beginner":"Alternative casting cost from Spider-Man cards.","desc":"Alternative casting cost (Spider-Man mechanic).","crfull":"702.188a Web-slinging is a static ability that functions while the spell with web-slinging is on the stack. \"Web-slinging [cost]\" means \"You may cast this spell by paying [cost] and returning a tapped creature you control to its owner's hand rather than paying its mana cost.\" Casting a spell using its web-slinging ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Netzschuss"},{"name":"Will of the Council","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Will of the council  -  Starting with you, each player votes for [option A] or [option B]. [Effect] is determined by the votes.","beginner":"Players vote on options - effect determined by majority vote.","desc":"Ability word. Players vote for one of two or more options. Effect is determined by the vote.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Wille des Konzils"},{"name":"Will of the Planeswalkers","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Will of the Planeswalkers  -  Starting with you, each player votes for planeswalk or chaos. If planeswalk gets more votes, planeswalk. If chaos gets more votes or the vote is tied, chaos ensues.","beginner":"A Planechase vote: the table decides whether you move to a new plane or set off the chaos effect.","desc":"Ability word on Planechase plane cards. Each player votes for planeswalk or chaos; planeswalk needs a strict majority, otherwise chaos ensues. Distinct from Will of the Council.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Wille der Planeswalker"},{"name":"Wither","cat":"Keyword Ability","cr":"702.80","crtitle":"Wither","crshort":"Wither is a static ability. Damage dealt to a creature by a source with wither isn't marked on that creature. Rather, it causes that source's controller to put that many -1/-1 counters on that creature. See rule 120.3.","reminder":"Wither (This deals damage to creatures in the form of -1/-1 counters.)","beginner":"Damage to creatures is dealt as -1/-1 counters instead of regular damage.","desc":"Deals damage to creatures in the form of -1/-1 counters.","crfull":"702.80a Wither is a static ability. Damage dealt to a creature by a source with wither isn't marked on that creature. Rather, it causes that source's controller to put that many -1/-1 counters on that creature. See rule 120.3.\n702.80b If an object is no longer in the zone it's expected to be in as an effect causes it to deal damage, its last known information is used to determine whether it had wither.\n702.80c The wither rules function no matter what zone an object with wither deals damage from.\n702.80d Multiple instances of wither on the same object are redundant.","de":"Verdorren"}],"links":{"exalted":"Exalted","absorb":"Absorb","renown":"Renown","flag bearer":"Flag Bearer","specialize":"Specialize","activate":"Activate","delirium":"Delirium","exile":"Exile","sneak":"Sneak","discard":"Discard","threshold":"Threshold","venture into the dungeon":"Venture into the Dungeon","abandon":"Abandon","charge counters":"Counter (noun)","cipher":"Cipher","airbend":"Airbend","lifelink":"Lifelink","will of the council":"Will of the Council","evoke":"Evoke","adventure":"Adventure","convert":"Convert","tap/untap":"Tap/Untap","daybound":"Daybound / Nightbound","bloodthirst":"Bloodthirst","assimilate":"Assimilate","solved":"Solved","morbid":"Morbid","reinforce":"Reinforce","umbra armor":"Umbra Armor","heist":"Heist","conspire":"Conspire","intensity":"Intensity","forage":"Forage","amass":"Amass","exhaust":"Exhaust","shield":"Shield","jump-start":"Jump-Start","council's dilemma":"Council's Dilemma","background":"Background","hexproof from":"Hexproof From","equip":"Equip","clash":"Clash","collect evidence":"Collect Evidence","imprint":"Imprint","changeling":"Changeling","offspring":"Offspring","artifact landwalk":"Artifact Landwalk","doctor's companion":"Doctor's Companion","friends forever":"Friends Forever","prowess":"Prowess","counters on it":"Counter (noun)","raid":"Raid","undaunted":"Undaunted","fateful hour":"Fateful Hour","foretell":"Foretell","split second":"Split Second","manifest dread":"Manifest Dread","champion":"Champion","populate":"Populate","awaken":"Awaken","double strike":"Double Strike","start your engines!":"Start Your Engines!","evolve":"Evolve","bushido":"Bushido","convoke":"Convoke","kicker":"Kicker (Multikicker)","devour":"Devour","encore":"Encore","infinity":"Infinity","counter that spell":"Counter (verb)","freerunning":"Freerunning","search":"Search","gravestorm":"Gravestorm","start your engines":"Start Your Engines!","suspect":"Suspect","scavenge":"Scavenge","face <script>
(function () {
  var NL = String.fromCharCode(10);
  var D = JSON.parse(document.getElementById("kwdata").textContent);
  var E = D.entries;
  E.sort(function (a, b) { return a.name.localeCompare(b.name); });

  var CATS = [
    { key: "", label: "Alle" },
    { key: "*", label: "★ Favoriten" },
    { key: "Keyword Ability", label: "Keyword Abilities", v: "--c-ability" },
    { key: "Keyword Action", label: "Keyword Actions", v: "--c-action" },
    { key: "Ability Word", label: "Ability Words", v: "--c-word" },
    { key: "Rules Term", label: "Regelbegriffe", v: "--c-term" },
    { key: "Token", label: "Tokens", v: "--c-token" },
    { key: "Counter", label: "Counter", v: "--c-counter" }
  ];
  var catVar = {};
  CATS.forEach(function (c) { if (c.v) catVar[c.key] = c.v; });

  // Lowercase and drop accents so "lebensverknupfung" finds "Lebensverknüpfung".
  var MARKS = new RegExp("[" + String.fromCharCode(0x300) + "-" + String.fromCharCode(0x36f) + "]", "g");
  function fold(s) { return s.normalize("NFD").replace(MARKS, "").toLowerCase().replace(/ß/g, "ss"); }

  var byName = {};
  E.forEach(function (e, i) {
    e.i = i;
    e.lname = fold(e.name);
    e.deList = e.de ? e.de.split("; ") : [];
    e.lde = e.deList.map(fold);
    e.hay = fold([e.name, e.de, e.crtitle, e.cr, e.reminder, e.desc, e.beginner, e.crshort].join(" "));
    byName[e.name] = e;
  });

  // Cross references: terms bucketed by first character, longest first.
  var buckets = {};
  Object.keys(D.links).forEach(function (t) {
    var target = byName[D.links[t]];
    if (!target || !t) return;
    var lt = t.toLowerCase();
    (buckets[lt[0]] = buckets[lt[0]] || []).push([lt, target.i]);
  });
  Object.keys(buckets).forEach(function (k) { buckets[k].sort(function (a, b) { return b[0].length - a[0].length; }); });

  function isWord(c) { return !!c && (c.toLowerCase() !== c.toUpperCase() || (c >= "0" && c <= "9")); }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function linkify(text, selfIdx, used) {
    var lower = text.toLowerCase(), out = "", plain = "", i = 0;
    if (lower.length !== text.length) return esc(text);
    while (i < text.length) {
      var hit = null, b = !isWord(text[i - 1]) && buckets[lower[i]];
      if (b) {
        for (var k = 0; k < b.length; k++) {
          var t = b[k][0];
          if (lower.substr(i, t.length) === t && !isWord(text[i + t.length])) { hit = b[k]; break; }
        }
      }
      if (hit) {
        var len = hit[0].length, piece = text.substr(i, len);
        if (hit[1] !== selfIdx && !used[hit[1]]) {
          used[hit[1]] = 1;
          out += esc(plain) + '<a class="xref" data-go="' + hit[1] + '">' + esc(piece) + "</a>";
        } else {
          out += esc(plain) + esc(piece);
        }
        plain = "";
        i += len;
      } else {
        plain += text[i];
        i++;
      }
    }
    return out + esc(plain);
  }

  // State
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem("mtgkw-favs") || "{}") || {}; } catch (err) { favs = {}; }
  function saveFavs() { try { localStorage.setItem("mtgkw-favs", JSON.stringify(favs)); } catch (err) {} }
  var state = { q: "", cat: "", open: {}, full: {} };
  var backStack = [];

  var listEl = document.getElementById("list");
  var qEl = document.getElementById("q");
  var clearEl = document.getElementById("clear");
  var countEl = document.getElementById("count");
  var chipsEl = document.getElementById("chips");
  var backEl = document.getElementById("back");

  chipsEl.innerHTML = CATS.map(function (c) {
    var dot = c.v ? '<span class="dot" style="--cat:var(' + c.v + ')"></span>' : "";
    return '<button type="button" class="chip" data-cat="' + esc(c.key) + '" aria-pressed="' + (c.key === state.cat) + '">' + dot + esc(c.label) + "</button>";
  }).join("");

  function results() {
    var q = fold(state.q.trim());
    var words = q.split(" ").filter(Boolean);
    var res = [];
    E.forEach(function (e) {
      if (state.cat === "*" ? !favs[e.name] : (state.cat && e.cat !== state.cat)) return;
      var s;
      if (!q) s = 0;
      else if (e.lname === q || e.lde.indexOf(q) >= 0) s = 0;
      else if (e.lname.indexOf(q) === 0 || e.lde.some(function (d) { return d.indexOf(q) === 0; })) s = 1;
      else if (e.lname.indexOf(q) > 0 || e.lde.some(function (d) { return d.indexOf(q) > 0; }) || e.cr.indexOf(q) === 0) s = 2;
      else if (e.hay.indexOf(q) >= 0) s = 3;
      else if (words.length > 1 && words.every(function (w) { return e.hay.indexOf(w) >= 0; })) s = 4;
      else return;
      res.push([s, e]);
    });
    res.sort(function (a, b) { return a[0] - b[0] || a[1].i - b[1].i; });
    return res.map(function (r) { return r[1]; });
  }

  function fullHtml(e) {
    var used = {};
    return e.crfull.split(NL).filter(Boolean).map(function (line) {
      var m = /^([0-9]+[.][0-9a-z.]*) ([^]*)$/.exec(line);
      if (!m) return "<p>" + linkify(line, e.i, used) + "</p>";
      var sub = /[a-z]$/.test(m[1]) ? ' class="sub"' : "";
      return "<p" + sub + '><span class="rn">' + esc(m[1]) + "</span>" + linkify(m[2], e.i, used) + "</p>";
    }).join("");
  }

  function detailHtml(e) {
    var used = {}, h = "";
    if (e.reminder) h += '<div><p class="label">Reminder Text</p><div class="reminder">' + linkify(e.reminder, e.i, used) + "</div></div>";
    if (e.beginner) h += '<div><p class="label">Kurz erklärt</p><p class="plain">' + linkify(e.beginner, e.i, used) + "</p></div>";
    if (e.crshort) {
      var crLabel = e.cr && e.cr !== "Glossary" ? "CR " + e.cr : "CR Glossar";
      h += '<div><p class="label">Regel <span class="crnum">' + esc(crLabel) + (e.crtitle && e.crtitle !== e.name ? " · " + esc(e.crtitle) : "") + '</span></p><p class="rule">' + linkify(e.crshort, e.i, used) + "</p></div>";
    }
    if (e.crfull && e.crfull !== e.crshort) {
      if (state.full[e.i]) h += '<div class="full">' + fullHtml(e) + '</div><button type="button" class="more" data-full="' + e.i + '">Volle Regel ausblenden</button>';
      else h += '<button type="button" class="more" data-full="' + e.i + '">Volle Regel anzeigen</button>';
    }
    return h;
  }

  function entryHtml(e) {
    var open = !!state.open[e.i];
    var fav = !!favs[e.name];
    var cr = e.cr && e.cr !== "Glossary" ? " · " + e.cr : "";
    return '<section class="entry' + (open ? " open" : "") + '" id="e' + e.i + '" style="--cat:var(' + (catVar[e.cat] || "--c-term") + ')">' +
      '<div class="head"><button type="button" class="toggle" data-open="' + e.i + '" aria-expanded="' + open + '">' +
      '<span class="nameline"><span class="name">' + esc(e.name) + '</span><span class="meta">' + esc(e.cat) + esc(cr) + "</span></span>" +
      (e.de ? '<span class="de">' + esc(e.deList.join(" · ")) + "</span>" : "") +
      '<span class="desc">' + esc(e.desc) + "</span></button>" +
      '<button type="button" class="fav" data-fav="' + e.i + '" aria-pressed="' + fav + '" aria-label="Favorit">★</button></div>' +
      (open ? '<div class="detail">' + detailHtml(e) + "</div>" : "") +
      "</section>";
  }

  function render() {
    var res = results();
    var q = fold(state.q.trim());
    if (q && res.length && (res[0].lname === q || res[0].lde.indexOf(q) >= 0 || res.length === 1)) state.open[res[0].i] = 1;
    countEl.textContent = res.length === E.length ? E.length + " Einträge" : res.length + " / " + E.length;
    listEl.innerHTML = res.length ? res.map(entryHtml).join("") :
      '<p class="empty">' + (state.cat === "*" ? "Noch keine Favoriten. Tippe auf den Stern bei einem Eintrag." : "Nichts gefunden für „" + esc(state.q.trim()) + "“.") + "</p>";
    clearEl.hidden = !state.q;
    updateBack();
  }

  function rerenderEntry(i) {
    var el = document.getElementById("e" + i);
    if (!el) return;
    var tmp = document.createElement("div");
    tmp.innerHTML = entryHtml(E[i]);
    el.replaceWith(tmp.firstChild);
  }

  function updateBack() {
    var top = backStack[backStack.length - 1];
    backEl.hidden = !top;
    if (top) backEl.textContent = "← Zurück zu " + E[top.from].name;
  }

  function goTo(i, from) {
    if (from !== undefined) backStack.push({ from: from, q: state.q, cat: state.cat, y: window.scrollY });
    state.open[i] = 1;
    var visible = results().some(function (e) { return e.i === i; });
    if (!visible) { state.q = ""; state.cat = ""; qEl.value = ""; syncChips(); }
    render();
    var el = document.getElementById("e" + i);
    if (el) {
      var headerH = document.querySelector("header").offsetHeight;
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - headerH - 8 });
      el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    }
  }

  function syncChips() {
    chipsEl.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.cat === state.cat)); });
  }

  qEl.addEventListener("input", function () { state.q = qEl.value; backStack = []; render(); window.scrollTo({ top: 0 }); });
  qEl.addEventListener("keydown", function (ev) { if (ev.key === "Enter") qEl.blur(); });
  clearEl.addEventListener("click", function () { qEl.value = ""; state.q = ""; render(); qEl.focus(); });
  chipsEl.addEventListener("click", function (ev) {
    var c = ev.target.closest(".chip");
    if (!c) return;
    state.cat = c.dataset.cat; backStack = []; syncChips(); render(); window.scrollTo({ top: 0 });
  });

  listEl.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-go],[data-open],[data-fav],[data-full]");
    if (!t) return;
    if (t.dataset.go !== undefined) {
      ev.preventDefault();
      var from = +t.closest(".entry").id.slice(1);
      goTo(+t.dataset.go, from);
    } else if (t.dataset.open !== undefined) {
      var i = +t.dataset.open;
      if (state.open[i]) delete state.open[i]; else state.open[i] = 1;
      rerenderEntry(i);
    } else if (t.dataset.fav !== undefined) {
      var e = E[+t.dataset.fav];
      if (favs[e.name]) delete favs[e.name]; else favs[e.name] = 1;
      saveFavs();
      if (state.cat === "*") render(); else t.setAttribute("aria-pressed", String(!!favs[e.name]));
    } else if (t.dataset.full !== undefined) {
      var f = +t.dataset.full;
      if (state.full[f]) delete state.full[f]; else state.full[f] = 1;
      rerenderEntry(f);
    }
  });

  backEl.addEventListener("click", function () {
    var top = backStack.pop();
    if (!top) return;
    state.q = top.q; state.cat = top.cat; qEl.value = top.q; syncChips();
    render();
    var el = document.getElementById("e" + top.from);
    if (el) {
      var headerH = document.querySelector("header").offsetHeight;
      window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - headerH - 8 });
    } else {
      window.scrollTo({ top: top.y });
    }
  });

  render();
})();
</script>

</body></html>
