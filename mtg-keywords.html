<style>
/* Layout: one sticky search header over a single-column list of expandable rule entries, sized for one-hand phone use. */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --fg: #161a23;
  --muted: #5a6274;
  --line: #d5d9e1;
  --accent: #2c5a88;
  --accent-soft: #dfe8f2;
  --box: #f6f2e9;
  --box-line: #e2d9c4;
  --star: #b88a1b;
  --c-ability: #2f68a8;
  --c-action: #b4432f;
  --c-word: #3d7f4a;
  --c-term: #6a6f7c;
  --c-token: #9a7414;
  --c-counter: #7a4a9c;
  --f-name: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-card: "Alegreya", "Palatino Linotype", Georgia, serif;
  --f-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --surface: #1a1e27; --fg: #e5e7ed; --muted: #9aa2b4; --line: #2b3240;
    --accent: #8db6e3; --accent-soft: #233144; --box: #221f19; --box-line: #3a3428; --star: #e3b542;
    --c-ability: #7fb0ea; --c-action: #ec8a74; --c-word: #84c891; --c-term: #a7adba; --c-token: #dcb453; --c-counter: #c39ae0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #1a1e27; --fg: #e5e7ed; --muted: #9aa2b4; --line: #2b3240;
  --accent: #8db6e3; --accent-soft: #233144; --box: #221f19; --box-line: #3a3428; --star: #e3b542;
  --c-ability: #7fb0ea; --c-action: #ec8a74; --c-word: #84c891; --c-term: #a7adba; --c-token: #dcb453; --c-counter: #c39ae0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--f-ui); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px 8px;
}
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; }
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 700 1.15rem/1.2 var(--f-name); letter-spacing: 0.02em; }
#count { font: 500 0.75rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.search { position: relative; margin-top: 8px; }
#q {
  width: 100%; font: 400 1.05rem var(--f-ui); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 40px 11px 12px; -webkit-appearance: none; appearance: none;
}
#q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; color: var(--muted); font-size: 1.3rem; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font: 600 0.8rem var(--f-ui); padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--muted)); flex: none; }

main { padding-block: 8px 96px; }
#list { display: flex; flex-direction: column; gap: 6px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.entry.open { border-color: var(--cat); }
.head { display: grid; grid-template-columns: 1fr auto; align-items: start; }
.toggle { text-align: left; padding: 10px 4px 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nameline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name { font: 700 1.08rem/1.2 var(--f-name); letter-spacing: 0.01em; }
.meta { font: 500 0.68rem var(--f-mono); color: var(--cat); letter-spacing: 0.02em; text-transform: uppercase; }
.de { font: italic 400 0.95rem/1.25 var(--f-card); color: var(--fg); opacity: 0.8; }
.desc { color: var(--muted); font-size: 0.88rem; line-height: 1.35; }
.entry.open .desc { display: none; }
.fav { width: 44px; height: 44px; font-size: 1.25rem; color: var(--line); }
.fav[aria-pressed="true"] { color: var(--star); }

.detail { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.label { font: 600 0.68rem var(--f-ui); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 3px; }
.reminder {
  background: var(--box); border: 1px solid var(--box-line); border-radius: 6px;
  padding: 9px 11px; font: italic 400 1.06rem/1.4 var(--f-card);
}
.plain { margin: 0; font-size: 0.97rem; }
.rule { margin: 0; font-size: 0.92rem; }
.crnum { font: 500 0.78rem var(--f-mono); color: var(--accent); }
.more { align-self: flex-start; font: 600 0.85rem var(--f-ui); color: var(--accent); padding: 4px 0; }
.full { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; border-left: 2px solid var(--line); padding-left: 10px; }
.full p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.full .rn { font: 500 0.75rem var(--f-mono); color: var(--accent); margin-right: 4px; }
.full .sub { padding-left: 12px; }
a.xref { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; cursor: pointer; }
.reminder a.xref { color: inherit; text-decoration-color: var(--accent); }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
#back {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); font: 600 0.9rem var(--f-ui);
  padding: 10px 16px; border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent-soft); } to { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>

</header>

<script type="application/json" id="kwdata">{"entries":[{"name":"Abandon","cat":"Keyword Action","cr":"701.33","crtitle":"Abandon","crshort":"Only a face-up ongoing scheme card may be abandoned, and only during an Archenemy game. See rule 314, \"Schemes,\" and rule 904, \"Archenemy.\" To abandon a scheme, turn it face down and put it on the bottom of its owner's scheme deck.","reminder":"Abandon (Turn a scheme card face down and put it on the bottom of its owner's scheme deck.)","beginner":"End the current scheme in Archenemy format.","desc":"Turn a scheme face down and put it on the bottom of its owner's scheme deck.","crfull":"701.33a Only a face-up ongoing scheme card may be abandoned, and only during an Archenemy game. See rule 314, \"Schemes,\" and rule 904, \"Archenemy.\"\n701.33b To abandon a scheme, turn it face down and put it on the bottom of its owner's scheme deck.","de":""},{"name":"Absorb","cat":"Keyword Ability","cr":"702.64","crtitle":"Absorb","crshort":"Absorb is a static ability. \"Absorb N\" means \"If a source would deal damage to this creature, prevent N of that damage.\"","reminder":"If a source would deal damage to this creature, prevent N of that damage.","beginner":"This creature takes N less damage from everything that would damage it.","desc":"If a source would deal damage to this, prevent N of that damage.","crfull":"702.64a Absorb is a static ability. \"Absorb N\" means \"If a source would deal damage to this creature, prevent N of that damage.\"\n702.64b Each absorb ability can prevent only N damage from any one source at any one time. It will apply separately to damage from other sources, or to damage dealt by the same source at a different time.\n702.64c If an object has multiple instances of absorb, each applies separately.","de":""},{"name":"Acorn","cat":"Rules Term","cr":"","crtitle":"","crshort":"","reminder":"Cards with the acorn security stamp are not legal for constructed play.","beginner":"These cards are for casual/un-set games only, not tournament legal.","desc":"Counter used for external visits/stickers (Un-sets). Has no inherent rules effect.","crfull":"","de":"Eichel"},{"name":"Activate","cat":"Keyword Action","cr":"701.2","crtitle":"Activate","crshort":"To activate an activated ability is to put it onto the stack and pay its costs, so that it will eventually resolve and have its effect.","reminder":"To activate an activated ability, pay its costs and put it on the stack.","beginner":"Pay the cost shown before the colon to use the ability after it.","desc":"To pay the cost of an activated ability and put it on the stack.","crfull":"701.2a To activate an activated ability is to put it onto the stack and pay its costs, so that it will eventually resolve and have its effect. Only an object's controller (or its owner, if it doesn't have a controller) can activate its activated ability unless the object specifically says otherwise. A player may activate an ability if they have priority. See rule 602, \"Activating Activated Abilities.\"","de":"Aktivieren"},{"name":"Adamant","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Adamant  -  This spell has additional or different effects if three mana of the same color was spent to cast it.","beginner":"Get a bonus if you used three or more mana of the same color to cast this spell.","desc":"Ability word. Effect active if you spent three mana of the same color to cast this spell.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Adamant"},{"name":"Adapt","cat":"Keyword Action","cr":"701.46","crtitle":"Adapt","crshort":"\"Adapt N\" means \"If this permanent has no +1/+1 counters on it, put N +1/+1 counters on it.\"","reminder":"If this creature has no +1/+1 counters on it, put N +1/+1 counters on it.","beginner":"Pay the cost to make this creature permanently bigger, but only works once.","desc":"{Cost}: If this has no +1/+1 counters, put N +1/+1 counters on it.","crfull":"701.46a \"Adapt N\" means \"If this permanent has no +1/+1 counters on it, put N +1/+1 counters on it.\"","de":"Adaptieren"},{"name":"Addendum","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Addendum  -  This spell has an additional effect if you cast it during your main phase.","beginner":"Cast this during your main phase (not on your opponent's turn) to get an extra bonus.","desc":"Ability word. Bonus effect if you cast this spell during your main phase.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Addendum"},{"name":"Adventure","cat":"Keyword Ability","cr":"715","crtitle":"","crshort":"Adventurer cards have a two-part card frame, with a smaller frame inset within their text box. The text that appears in the inset frame on the left defines alternative characteristics that the object may have while it's a spell.","reminder":"You may cast this card as an Adventure spell. Exile it, then you may cast the creature from exile.","beginner":"Choose to cast either the small spell first (then the creature later) or just cast the creature normally.","desc":"Cast as Adventure spell (exile it). Cast creature later from exile.","crfull":"715.1. Adventurer cards have a two-part card frame, with a smaller frame inset within their text box.\n715.2. The text that appears in the inset frame on the left defines alternative characteristics that the object may have while it's a spell. The card's normal characteristics appear as usual, although with a smaller text box on the right.\n715.2a If an effect refers to a card, spell, or permanent that \"has an Adventure,\" it refers to an object that has the alternative characteristics of an Adventure spell, even if the object currently doesn't use them.\n715.2b The existence and values of these alternative characteristics are part of the object's copiable values.\n715.2c Although adventurer cards are printed with multiple sets of characteristics, each adventurer card is only one card. For example, a player who has drawn or discarded an adventurer card has drawn or discarded one card, not two.\n715.3. As a player plays an adventurer card, the player chooses whether they play the card normally or as an Adventure.\n715.3a When casting an adventurer card as an Adventure, only the alternative characteristics are evaluated to see if it can be cast.\n715.3b While on the stack as an Adventure, the spell has only its alternative characteristics.\n715.3c If an Adventure spell is copied, the copy is also an Adventure. It has the alternative characteristics of the spell and not the normal characteristics of the card that represents the Adventure spell. Any rule or effect that refers to a spell cast as an Adventure refers to the copy as well.\n715.3d Instead of putting a spell that was cast as an Adventure into its owner's graveyard as it resolves, its controller exiles it. For as long as that card remains exiled, that player may play it. It can't be cast as an Adventure this way, although other effects that allow a player to cast it may allow a player to cast it as an Adventure.\n715.4. In every zone except the stack, and while on the stack not as an Adventure, an adventurer card has only its normal characteristics.\n715.5. If an effect instructs a player to choose a card name and the player wants to choose an adventurer card's alternative name, the player may do so.","de":"Abenteuer"},{"name":"Affinity","cat":"Keyword Ability","cr":"702.41","crtitle":"Affinity","crshort":"Affinity is a static ability that functions while the spell with affinity is on the stack. \"Affinity for [text]\" means \"This spell costs {1} less to cast for each [text] you control.\" If a spell has multiple instances of affinity, each of them applies.","reminder":"Affinity for [text] (This spell costs {1} less to cast for each [text] you control.)","beginner":"This costs less to cast based on how many of the specified permanents you have.","desc":"Cost to cast is reduced by 1 for each permanent of the specified type you control.","crfull":"702.41a Affinity is a static ability that functions while the spell with affinity is on the stack. \"Affinity for [text]\" means \"This spell costs {1} less to cast for each [text] you control.\"\n702.41b If a spell has multiple instances of affinity, each of them applies.","de":"Affinität"},{"name":"Afflict","cat":"Keyword Ability","cr":"702.130","crtitle":"Afflict","crshort":"Afflict is a triggered ability. \"Afflict N\" means \"Whenever this creature becomes blocked, defending player loses N life.\" If a creature has multiple instances of afflict, each triggers separately.","reminder":"Afflict N (Whenever this creature becomes blocked, defending player loses N life.)","beginner":"Even if this creature is blocked, the blocking player still loses life.","desc":"Whenever this creature becomes blocked, defending player loses N life.","crfull":"702.130a Afflict is a triggered ability. \"Afflict N\" means \"Whenever this creature becomes blocked, defending player loses N life.\"\n702.130b If a creature has multiple instances of afflict, each triggers separately.","de":"Pestilenz"},{"name":"Afterlife","cat":"Keyword Ability","cr":"702.135","crtitle":"Afterlife","crshort":"Afterlife is a triggered ability. \"Afterlife N\" means \"When this permanent is put into a graveyard from the battlefield, create N 1/1 white and black Spirit creature tokens with flying.\"","reminder":"Afterlife N (When this creature dies, create N 1/1 white and black Spirit creature tokens with flying.)","beginner":"When this creature dies, you get flying Spirit tokens as compensation.","desc":"When this dies, create N 1/1 white and black Spirit creature tokens with flying.","crfull":"702.135a Afterlife is a triggered ability. \"Afterlife N\" means \"When this permanent is put into a graveyard from the battlefield, create N 1/1 white and black Spirit creature tokens with flying.\"\n702.135b If a permanent has multiple instances of afterlife, each triggers separately.","de":"Seelenwandlung"},{"name":"Aftermath","cat":"Keyword Ability","cr":"702.127","crtitle":"Aftermath","crshort":"Aftermath is an ability found on some split cards (see rule 709, \"Split Cards\"). It represents three static abilities.","reminder":"Aftermath (Cast this spell only from your graveyard. Then exile it.)","beginner":"The right half of this split card can only be cast from your graveyard after the first half resolves.","desc":"Cast this half from your graveyard. Then exile it.","crfull":"702.127a Aftermath is an ability found on some split cards (see rule 709, \"Split Cards\"). It represents three static abilities. \"Aftermath\" means \"You may cast this half of this split card from your graveyard,\" \"This half of this split card can't be cast from any zone other than a graveyard,\" and \"If this spell was cast from a graveyard, exile it instead of putting it anywhere else any time it would leave the stack.\"","de":"Nachhall"},{"name":"Airbend","cat":"Keyword Action","cr":"701.65","crtitle":"Airbend","crshort":"Certain spells and abilities instruct a player to airbend one or more permanents and/or spells. To do so, that player exiles those objects.","reminder":"Airbend  -  Exile target [permanent/spell]. For as long as it remains exiled, its owner may cast it by paying [cost].","beginner":"Temporarily remove something from the game, but the owner can bring it back by paying a cost.","desc":"Exile a permanent or spell. Its owner can cast it later for a specific cost.","crfull":"701.65a Certain spells and abilities instruct a player to airbend one or more permanents and/or spells. To do so, that player exiles those objects. For each card exiled this way, for as long as it remains exiled, its owner may cast it by paying {2} rather than paying its mana cost.\n701.65b An ability that triggers whenever a player airbends triggers when that player exiles one or more objects as a result of an instruction to airbend.","de":"Luftbändigen"},{"name":"Alliance","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Alliance  -  Whenever another creature enters the battlefield under your control, [effect].","beginner":"This triggers every time you play or create another creature.","desc":"Ability word. Trigger whenever another creature enters the battlefield under your control.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Allianz"},{"name":"Amass","cat":"Keyword Action","cr":"701.47","crtitle":"Amass","crshort":"To amass [subtype] N means \"If you don't control an Army creature, create a 0/0 black [subtype] Army creature token. Choose an Army creature you control. Put N +1/+1 counters on that creature.","reminder":"Amass [Subtype] N (Put N +1/+1 counters on an Army you control. It's also a [Subtype]. If you don't control an Army, create a 0/0 black [Subtype] Army creature token first.)","beginner":"Build up your Army token by adding +1/+1 counters, or create one if you don't have one yet.","desc":"Put +1/+1 counters on an Army you control. If none, create a 0/0 Zombie Army first.","crfull":"701.47a To amass [subtype] N means \"If you don't control an Army creature, create a 0/0 black [subtype] Army creature token. Choose an Army creature you control. Put N +1/+1 counters on that creature. If it isn't a [subtype], it becomes a [subtype] in addition to its other types.\"\n701.47b A player \"amassed\" after the process described in rule 701.47a is complete, even if some or all of those actions were impossible.\n701.47c The phrases \"the Army you amassed\" and \"the amassed Army\" refer to the creature you chose, whether or not it received counters.\n701.47d Some older cards were printed with amass N without including a subtype. Those cards have received errata in the Oracle card reference so that they read \"amass Zombies N.\"","de":"Aufmarsch"},{"name":"Amplify","cat":"Keyword Ability","cr":"702.38","crtitle":"Amplify","crshort":"Amplify is a static ability. \"Amplify N\" means \"As this object enters, reveal any number of cards from your hand that share a creature type with it. This permanent enters with N +1/+1 counters on it for each card revealed this way.","reminder":"Amplify N (As this enters the battlefield, reveal any number of cards from your hand that share a creature type with it. This creature enters the battlefield with N +1/+1 counters on it for each card revealed this way.)","beginner":"Reveal matching creature types from your hand when this enters to make it start bigger.","desc":"As this enters, reveal cards of same type from hand. Get +1/+1 counters for each.","crfull":"702.38a Amplify is a static ability. \"Amplify N\" means \"As this object enters, reveal any number of cards from your hand that share a creature type with it. This permanent enters with N +1/+1 counters on it for each card revealed this way. You can't reveal this card or any other cards that are entering the battlefield at the same time as this card.\"\n702.38b If a creature has multiple instances of amplify, each one works separately.","de":"Verstärkung"},{"name":"Annihilator","cat":"Keyword Ability","cr":"702.86","crtitle":"Annihilator","crshort":"Annihilator is a triggered ability. \"Annihilator N\" means \"Whenever this creature attacks, defending player sacrifices N permanents.\" If a creature has multiple instances of annihilator, each triggers separately.","reminder":"Annihilator N (Whenever this creature attacks, defending player sacrifices N permanents.)","beginner":"When this attacks, your opponent must sacrifice permanents before declaring blockers.","desc":"Whenever this attacks, defending player sacrifices N permanents.","crfull":"702.86a Annihilator is a triggered ability. \"Annihilator N\" means \"Whenever this creature attacks, defending player sacrifices N permanents.\"\n702.86b If a creature has multiple instances of annihilator, each triggers separately.","de":"Vernichter"},{"name":"Ante","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"1. A zone used only when playing \"for keeps.\" 2. To put a card into the ante zone. See rule 407, \"Ante.\"","reminder":"Before the game begins, each player puts a card from their deck into the ante zone. The winner of the game takes all cards in the ante zone.","beginner":"An obsolete mechanic where players bet cards from their deck - winner takes all (not legal in any format).","desc":"(Obsolete) Before the game, each player puts a card from their deck into the ante zone. Winner takes all ante cards.","crfull":"1. A zone used only when playing \"for keeps.\" 2. To put a card into the ante zone. See rule 407, \"Ante.\"","de":""},{"name":"Artifact Landwalk","cat":"Rules Term","cr":"702.14","crtitle":"Landwalk","crshort":"Landwalk is a generic term that appears within an object's rules text as \"[type]walk,\" where [type] is usually a land type, but it can also be the card type land plus any combination of land types, card types, and/or supertypes.","reminder":"Artifact landwalk (This creature can't be blocked as long as defending player controls an artifact land.)","beginner":"This creature can't be blocked if your opponent has an artifact land.","desc":"This creature is unblockable if defending player controls an Artifact Land.","crfull":"702.14a Landwalk is a generic term that appears within an object's rules text as \"[type]walk,\" where [type] is usually a land type, but it can also be the card type land plus any combination of land types, card types, and/or supertypes.\n702.14b Landwalk is an evasion ability.\n702.14c A creature with landwalk can't be blocked as long as the defending player controls at least one land with the specified land type (as in \"islandwalk\"), with the specified type or supertype (as in \"artifact landwalk\"), without the specified type or supertype (as in \"nonbasic landwalk\"), or with both the specified type or supertype and the specified subtype (as in \"snow swampwalk\"). (See rule 509, \"Declare Blockers Step.\")\n702.14d Landwalk abilities don't \"cancel\" one another.\n702.14e Multiple instances of the same kind of landwalk on the same creature are redundant.","de":"Artefaktlandtarnung"},{"name":"Ascend","cat":"Keyword Ability","cr":"702.131","crtitle":"Ascend","crshort":"Ascend on an instant or sorcery spell represents a spell ability. It means \"If you control ten or more permanents and you don't have the city's blessing, you get the city's blessing for the rest of the game.\"","reminder":"Ascend (If you control ten or more permanents, you get the city's blessing for the rest of the game.)","beginner":"Once you have 10 permanents, you permanently unlock the city's blessing for various bonuses.","desc":"If you control ten or more permanents, you get the city's blessing for the rest of the game.","crfull":"702.131a Ascend on an instant or sorcery spell represents a spell ability. It means \"If you control ten or more permanents and you don't have the city's blessing, you get the city's blessing for the rest of the game.\"\n702.131b Ascend on a permanent represents a static ability. It means \"Any time you control ten or more permanents and you don't have the city's blessing, you get the city's blessing for the rest of the game.\"\n702.131c The city's blessing is a designation that has no rules meaning other than to act as a marker that other rules and effects can identify. Any number of players may have the city's blessing at the same time.\n702.131d After a player gets the city's blessing, continuous effects are reapplied before the game checks to see if the game state or preceding events have matched any trigger conditions.","de":"Aufstieg"},{"name":"Assemble","cat":"Keyword Action","cr":"701.45","crtitle":"Assemble","crshort":"Assemble is a keyword action in the Unstable set that puts Contraptions onto the battlefield. Outside of silver-bordered cards, only one card (Steamflogger Boss) refers to assembling a Contraption.","reminder":"Assemble (Put a Contraption card from your Contraption deck face up onto one of your sprockets.)","beginner":"Put a Contraption from your special deck onto the battlefield on one of your three sprockets.","desc":"Put a Contraption onto the battlefield on a sprocket.","crfull":"701.45a Assemble is a keyword action in the Unstable set that puts Contraptions onto the battlefield. Outside of silver-bordered cards, only one card (Steamflogger Boss) refers to assembling a Contraption. Cards and mechanics from the Unstable set aren't included in these rules. See the Unstable FAQ for more information.","de":""},{"name":"Assimilate","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"To assimilate a creature card, put it onto the battlefield under your control with a +1/+1 counter. It's a Borg artifact creature and loses all other creature types.","beginner":"Reanimate an opponent's creature under your control, bigger, and turn it into a Borg.","desc":"Star Trek Commander. Put the target creature card onto the battlefield under your control with a +1/+1 counter; it becomes a Borg artifact creature and loses all other creature types.","crfull":"","de":""},{"name":"Assist","cat":"Keyword Ability","cr":"702.132","crtitle":"Assist","crshort":"Assist is a static ability that modifies the rules of paying for the spell with assist (see rules 601.2g-h).","reminder":"Assist (Another player can pay up to [cost] of this spell's cost.)","beginner":"An opponent or teammate can help pay for this spell if they want to.","desc":"Another player can pay up to N of this spell's generic mana cost.","crfull":"702.132a Assist is a static ability that modifies the rules of paying for the spell with assist (see rules 601.2g-h). If the total cost to cast a spell with assist includes a generic mana component, before you activate mana abilities while casting it, you may choose another player. That player has a chance to activate mana abilities. Once that player chooses not to activate any more mana abilities, you have a chance to activate mana abilities. Before you begin to pay the total cost of the spell, the player you chose may pay for any amount of the generic mana in the spell's total cost.","de":""},{"name":"Attach","cat":"Keyword Action","cr":"701.3","crtitle":"Attach","crshort":"To attach an Aura, Equipment, or Fortification to an object or player means to take it from where it currently is and put it onto that object or player.","reminder":"To attach an Equipment, Aura, or Fortification to a permanent.","beginner":"Put the Equipment, Aura, or Fortification onto a permanent it can legally attach to.","desc":"To equip Equipment, enchant with Aura, or fortify with Fortification to a permanent.","crfull":"701.3a To attach an Aura, Equipment, or Fortification to an object or player means to take it from where it currently is and put it onto that object or player. If something is attached to a permanent on the battlefield, it's customary to place it so that it's physically touching the permanent. An Aura, Equipment, or Fortification can't be attached to an object or player it couldn't enchant, equip, or fortify, respectively.\n701.3b If an effect tries to attach an Aura, Equipment, or Fortification to an object or player it can't be attached to, the Aura, Equipment, or Fortification doesn't move. If an effect tries to attach an Aura, Equipment, or Fortification to the object or player it's already attached to, the effect does nothing. If an effect tries to attach an object that isn't an Aura, Equipment, or Fortification to another object or player, the effect does nothing and the first object doesn't move.\n701.3c Attaching an Aura, Equipment, or Fortification on the battlefield to a different object or player causes the Aura, Equipment, or Fortification to receive a new timestamp.\n701.3d To \"unattach\" an Equipment from a creature means to move it away from that creature so the Equipment is on the battlefield but is not equipping anything. It should no longer be physically touching any creature. If an Aura, Equipment, or Fortification that was attached to an object or player ceases to be attached to it, that counts as \"becoming unattached [from that object or player]\"; this includes if that Aura, Equipment, or Fortification leaves the battlefield, the object leaves the zone it was in, or that player leaves the game.","de":"Anlegen"},{"name":"Augment","cat":"Keyword Ability","cr":"","crtitle":"","crshort":"","reminder":"Augment [cost] ([Cost], Reveal this card from your hand: Combine it with target host. Augment only as a sorcery.)","beginner":"An Un-set mechanic: combine this half-card with a host creature to build a single creature from two halves.","desc":"Un-set mechanic. {Cost}, Reveal from hand: Combine with a target host creature. Sorcery speed only. Pairs with Host.","crfull":"","de":""},{"name":"Aura","cat":"Rules Term","cr":"303.4","crtitle":"","crshort":"Some enchantments have the subtype \"Aura.\" An Aura enters the battlefield attached to an object or player. What an Aura can be attached to is defined by its enchant keyword ability (see rule 702.5, \"Enchant\").","reminder":"Enchant [quality] (Target a [quality] as you cast this. This card enters the battlefield attached to that permanent.)","beginner":"An enchantment that attaches to something specific - if that thing leaves play, the Aura goes to the graveyard.","desc":"Enchantment subtype. Attached to a permanent. If the permanent leaves, Aura goes to graveyard.","crfull":"303.4. Some enchantments have the subtype \"Aura.\" An Aura enters the battlefield attached to an object or player. What an Aura can be attached to is defined by its enchant keyword ability (see rule 702.5, \"Enchant\"). Other effects can limit what a permanent can be enchanted by.\n303.4a An Aura spell requires a target, which is defined by its enchant ability.\n303.4b The object or player an Aura is attached to is called enchanted. The Aura is attached to, or \"enchants,\" that object or player.\n303.4c If an Aura is enchanting an illegal object or player as defined by its enchant ability and other applicable effects, the object it was attached to no longer exists, or the player it was attached to has left the game, the Aura is put into its owner's graveyard. (This is a state-based action. See rule 704.)\n303.4d An Aura can't enchant itself. If this occurs somehow, the Aura is put into its owner's graveyard. An Aura that's also a creature can't enchant anything. If this occurs somehow, the Aura becomes unattached, then is put into its owner's graveyard. (These are state-based actions. See rule 704.) An Aura can't enchant more than one object or player. If a spell or ability would cause an Aura to become attached to more than one object or player, the Aura's controller chooses which object or player it becomes attached to.\n303.4e An Aura's controller is separate from the enchanted object's controller or the enchanted player; the two need not be the same. If an Aura enchants an object, changing control of the object doesn't change control of the Aura, and vice versa. Only the Aura's controller can activate its abilities. However, if the Aura grants an ability to the enchanted object (with \"gains\" or \"has\"), the enchanted object's controller is the only one who can activate that ability.\n303.4f If an Aura is entering the battlefield under a player's control by any means other than by resolving as an Aura spell, and the effect putting it onto the battlefield doesn't specify the object or player the Aura will enchant, that player chooses what it will enchant as the Aura enters the battlefield. The player must choose a legal object or player according to the Aura's enchant ability and any other applicable effects.\n303.4g If an Aura is entering the battlefield and there is no legal object or player for it to enchant, the Aura remains in its current zone, unless that zone is the stack. In that case, the Aura is put into its owner's graveyard instead of entering the battlefield. If the Aura is a token, it isn't created.\n303.4h If an effect attempts to put a permanent that isn't an Aura, Equipment, or Fortification onto the battlefield attached to an object or player, it enters the battlefield unattached.\n303.4i If an effect attempts to put an Aura onto the battlefield attached to either an object or player it can't legally enchant or an object or player that is undefined, the Aura remains in its current zone, unless that zone is the stack. In that case, the Aura is put into its owner's graveyard instead of entering the battlefield. If the Aura is a token, it isn't created.\n303.4j If an effect attempts to attach an Aura on the battlefield to an object or player it can't legally enchant, the Aura doesn't move.\n303.4k If an effect allows an Aura that's being turned face up to become attached to an object or player, the Aura's controller considers the characteristics of that Aura as it would exist if it were face up to determine what it may be attached to, and they must choose a legal object or player according to the Aura's enchant ability and any other applicable effects.\n303.4m An ability of a permanent that refers to the \"enchanted [object or player]\" refers to whatever object or player that permanent is attached to, even if the permanent with the ability isn't an Aura.\n303.5. Some enchantments have the subtype \"Saga.\" See rule 714 for more information about Saga cards.\n303.6. Some enchantments have the subtype \"Class.\" See rule 716 for more information about Class cards.\n303.7. Some Aura enchantments also have the subtype \"Role.\"\n303.7a If a permanent has more than one Role controlled by the same player attached to it, each of those Roles except the one with the most recent timestamp is put into its owner's graveyard. This is a state-based action. See rule 704.","de":"Aura"},{"name":"Aura Swap","cat":"Keyword Ability","cr":"702.65","crtitle":"Aura Swap","crshort":"Aura swap is an activated ability of some Aura cards. \"Aura swap [cost]\" means \"[Cost]: You may exchange this permanent with an Aura card in your hand.\" If either half of the exchange can't be completed, the ability has no effect.","reminder":"Aura swap [cost] ([Cost]: Exchange this Aura with an Aura card in your hand.)","beginner":"Pay the cost to trade this Aura for a different Aura from your hand.","desc":"{Cost}: Exchange this Aura with an Aura card in your hand.","crfull":"702.65a Aura swap is an activated ability of some Aura cards. \"Aura swap [cost]\" means \"[Cost]: You may exchange this permanent with an Aura card in your hand.\"\n702.65b If either half of the exchange can't be completed, the ability has no effect.","de":"Aurentausch"},{"name":"Awaken","cat":"Keyword Ability","cr":"702.113","crtitle":"Awaken","crshort":"Awaken appears on some instants and sorceries. It represents two abilities: a static ability that functions while the spell with awaken is on the stack and a spell ability.","reminder":"Awaken N - [cost] (If you cast this spell for [cost], also put N +1/+1 counters on target land you control and it becomes a 0/0 Elemental creature with haste. It's still a land.)","beginner":"Pay extra to also turn one of your lands into a creature with +1/+1 counters.","desc":"Put N +1/+1 counters on target land you control. It becomes a 0/0 Elemental creature with haste.","crfull":"702.113a Awaken appears on some instants and sorceries. It represents two abilities: a static ability that functions while the spell with awaken is on the stack and a spell ability. \"Awaken N-[cost]\" means \"You may pay [cost] rather than pay this spell's mana cost as you cast this spell\" and \"If this spell's awaken cost was paid, put N +1/+1 counters on target land you control. That land becomes a 0/0 Elemental creature with haste. It's still a land.\" Casting a spell using its awaken ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.113b The controller of a spell with awaken chooses the target of the awaken spell ability only if that player chose to pay the spell's awaken cost. Otherwise the spell is cast as if it didn't have that target.","de":"Erwecken"},{"name":"Background","cat":"Rules Term","cr":"Glossary","crtitle":"","crshort":"An enchantment type that, in combination with the \"choose a Background\" ability, may allow a legendary enchantment card to be your commander. See rule 702.124, \"Partner,\" and rule 903, \"Commander.\"","reminder":"This enchantment can be your commander along with a legendary creature with 'Choose a Background.'","beginner":"In Commander, this can be your second commander if your main commander has 'Choose a Background.'","desc":"Enchantment type that can be chosen as a Background for specific commanders. Works with 'Choose a Background.'","crfull":"An enchantment type that, in combination with the \"choose a Background\" ability, may allow a legendary enchantment card to be your commander. See rule 702.124, \"Partner,\" and rule 903, \"Commander.\"","de":"Hintergrund"},{"name":"Backup","cat":"Keyword Ability","cr":"702.165","crtitle":"Backup","crshort":"Backup is a triggered ability. \"Backup N\" means \"When this creature enters, put N +1/+1 counters on target creature.","reminder":"Backup N (When this creature enters the battlefield, put N +1/+1 counters on target creature. If that's another creature, it gains the following abilities until end of turn.)","beginner":"When this enters, boost another creature and temporarily give it this creature's abilities.","desc":"Enters with N +1/+1 counters on target. If that's another creature, it gains this creature's abilities.","crfull":"702.165a Backup is a triggered ability. \"Backup N\" means \"When this creature enters, put N +1/+1 counters on target creature. If that's another creature, it also gains the non-backup abilities of this creature printed below this one until end of turn.\" Cards with backup have one or more abilities printed after the backup ability. (Some cards with backup also have abilities printed before the backup ability.)\n702.165b If a permanent enters the battlefield as a copy of a permanent with a backup ability or a token is created that is a copy of that permanent, the order of abilities printed on it is maintained.\n702.165c Only abilities printed on the object with backup are granted by its backup ability. Any abilities gained by a permanent, whether due to a copy effect, an effect that grants an ability to a permanent, or an effect that creates a token with certain abilities, are not granted by a backup ability.\n702.165d The abilities that a backup ability grants are determined as the ability is put on the stack. They won't change if the permanent with backup loses any abilities after the ability is put on the stack but before it resolves.","de":"Hilfestellung"},{"name":"Banding","cat":"Keyword Ability","cr":"702.22","crtitle":"Banding","crshort":"Banding is a static ability that modifies the rules for combat. \"Bands with other\" is a special form of banding. If an effect causes a permanent to lose banding, the permanent loses all \"bands with other\" abilities as well.","reminder":"Banding (Any creatures with banding, and up to one without, can attack in a band. Bands are blocked as a group. If any creatures with banding you control are blocking or being blocked by a creature, you divide that creature's combat damage, not its controller, among any of the creatures it's being blocked by or is blocking.)","beginner":"Attack or block as a group and you decide how combat damage is divided among them.","desc":"Creatures attack/block in a band. You choose how combat damage is assigned to them.","crfull":"702.22a Banding is a static ability that modifies the rules for combat.\n702.22b \"Bands with other\" is a special form of banding. If an effect causes a permanent to lose banding, the permanent loses all \"bands with other\" abilities as well.\n702.22c As a player declares attackers, they may declare that one or more attacking creatures with banding and up to one attacking creature without banding (even if it has \"bands with other\") are all in a \"band.\" They may also declare that one or more attacking [quality] creatures with \"bands with other [quality]\" and any number of other attacking [quality] creatures are all in a band. A player may declare as many attacking bands as they want, but each creature may be a member of only one of them. (Defending players can't declare bands but may use banding in a different way; see rule 702.22j.)\n702.22d All creatures in an attacking band must attack the same player, planeswalker, or battle.\n702.22e Once an attacking band has been announced, it lasts for the rest of combat, even if something later removes banding or \"bands with other\" from one or more of the creatures in the band.\n702.22f An attacking creature that's removed from combat is also removed from the band it was in.\n702.22g Banding doesn't cause attacking creatures to share abilities, nor does it remove any abilities. The attacking creatures in a band are separate permanents.\n702.22h If an attacking creature becomes blocked by a creature, each other creature in the same band as the attacking creature becomes blocked by that same blocking creature.\n702.22i If one member of a band would become blocked due to an effect, the entire band becomes blocked.\n702.22j During the combat damage step, if an attacking creature is being blocked by a creature with banding, or by both a [quality] creature with \"bands with other [quality]\" and another [quality] creature, the defending player (rather than the active player) chooses how the attacking creature's damage is assigned. That player can divide that creature's combat damage as they choose among any creatures blocking it. This is an exception to the procedure described in rule 510.1c.\n702.22k During the combat damage step, if a blocking creature is blocking a creature with banding, or both a [quality] creature with \"bands with other [quality]\" and another [quality] creature, the active player (rather than the defending player) chooses how the blocking creature's damage is assigned. That player can divide that creature's combat damage as they choose among any creatures it's blocking. This is an exception to the procedure described in rule 510.1d.\n702.22m Multiple instances of banding on the same creature are redundant. Multiple instances of \"bands with other\" of the same kind on the same creature are redundant.","de":"Bündnisfähigkeit"},{"name":"Bargain","cat":"Keyword Ability","cr":"702.166","crtitle":"Bargain","crshort":"Bargain is a static ability that functions while the spell with bargain is on the stack.","reminder":"Bargain (You may sacrifice an artifact, enchantment, or token as you cast this spell.)","beginner":"You can sacrifice an artifact, enchantment, or token when casting this for an additional effect.","desc":"You may sacrifice an artifact, enchantment, or token as an additional cost.","crfull":"702.166a Bargain is a static ability that functions while the spell with bargain is on the stack. \"Bargain\" means \"As an additional cost to cast this spell, you may sacrifice an artifact, enchantment, or token.\" Paying a spell's bargain cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.\n702.166b If a spell's controller declares the intention to pay that spell's bargain cost, that spell has been \"bargained.\" See rule 601.2b.\n702.166c Objects with bargain have additional abilities that specify what happens if they were bargained. These abilities are linked to the bargain ability printed on that object: they can refer only to that specific bargain ability. See rule 607, \"Linked Abilities.\"\n702.166d If part of a spell's ability has its effect only if that spell was bargained and that part of the ability includes any targets, the spell's controller chooses those targets only if that spell was bargained. Otherwise, the spell is cast as if it did not have those targets. See rule 601.2c.","de":"Feilschen"},{"name":"Battalion","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Battalion  -  Whenever this creature and at least two other creatures attack, [effect].","beginner":"Attack with this and at least two other creatures to trigger the bonus effect.","desc":"Trigger when this and at least two other creatures attack.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Bataillon"},{"name":"Battle Cry","cat":"Keyword Ability","cr":"702.91","crtitle":"Battle Cry","crshort":"Battle cry is a triggered ability. \"Battle cry\" means \"Whenever this creature attacks, each other attacking creature gets +1/+0 until end of turn.\" If a creature has multiple instances of battle cry, each triggers separately.","reminder":"Battle cry (Whenever this creature attacks, each other attacking creature gets +1/+0 until end of turn.)","beginner":"When this attacks, all your other attacking creatures get a temporary power boost.","desc":"Whenever this creature attacks, each other attacking creature gets +1/+0 until end of turn.","crfull":"702.91a Battle cry is a triggered ability. \"Battle cry\" means \"Whenever this creature attacks, each other attacking creature gets +1/+0 until end of turn.\"\n702.91b If a creature has multiple instances of battle cry, each triggers separately.","de":"Schlachtruf"},{"name":"Behold","cat":"Keyword Action","cr":"701.4","crtitle":"Behold","crshort":"\"Behold a [quality]\" means \"Reveal a [quality] card from your hand or choose a [quality] permanent you control on the battlefield.\"","reminder":"Behold [quality]  -  [Effect] if you control a permanent with [quality] or reveal a card with [quality] from your hand.","beginner":"Get a bonus if you control or reveal a card with the specified quality.","desc":"Condition met if you control a permanent of the specified type or reveal one from your hand.","crfull":"701.4a \"Behold a [quality]\" means \"Reveal a [quality] card from your hand or choose a [quality] permanent you control on the battlefield.\"\n701.4b The phrase \"if a [quality] was beheld\" refers to whether or not the object had that quality at the time the player took that action, regardless of whether or not the revealed card or chosen permanent still has that quality as the spell or ability including that phrase resolves.","de":"Erblicken"},{"name":"Bestow","cat":"Keyword Ability","cr":"702.103","crtitle":"Bestow","crshort":"Bestow represents a static ability that functions in any zone from which you could play the card it's on. \"Bestow [cost]\" means \"As you cast this spell, you may choose to cast it bestowed.","reminder":"Bestow [cost] (If you cast this card for its bestow cost, it's an Aura spell with enchant creature. It becomes a creature again if it's not attached to a creature.)","beginner":"Choose to cast this as a creature or pay the bestow cost to attach it to another creature as an Aura.","desc":"Cast as creature or Aura. If cast as Aura, it becomes a creature again if it's not attached.","crfull":"702.103a Bestow represents a static ability that functions in any zone from which you could play the card it's on. \"Bestow [cost]\" means \"As you cast this spell, you may choose to cast it bestowed. If you do, you pay [cost] rather than its mana cost.\" Casting a spell using its bestow ability follows the rules for paying alternative costs (see 601.2b and 601.2f-h).\n702.103b As a spell cast bestowed is put onto the stack, it becomes an Aura enchantment and gains enchant creature. It is a bestowed Aura spell, and the permanent it becomes as it resolves will be a bestowed Aura. These effects last until the spell or the permanent it becomes ceases to be bestowed (see rules 702.103e-g). Because the spell is an Aura spell, its controller must choose a legal target for that spell as defined by its enchant creature ability and rule 601.2c. See also rule 303.4.\n702.103c If a bestowed Aura spell is copied, the copy is also a bestowed Aura spell. Any rule that refers to a spell cast bestowed applies to the copy as well.\n702.103d When casting a spell bestowed, only its characteristics as modified by the bestow ability are evaluated to determine if it can be cast.\n702.103e As a bestowed Aura spell begins resolving, if its target is illegal, it ceases to be bestowed and the effect making it an Aura spell ends. It continues resolving as a creature spell. See rule 608.3b.\n702.103f If a bestowed Aura becomes unattached, it ceases to be bestowed. If a bestowed Aura is attached to an illegal object or player, it becomes unattached and ceases to be bestowed. This is an exception to rule 704.5m.\n702.103g If a bestowed Aura phases in unattached, it ceases to be bestowed. See rule 702.26, \"Phasing.\"","de":"Göttergabe"},{"name":"Blight","cat":"Keyword Action","cr":"701.68","crtitle":"Blight","crshort":"To \"blight N\" means to put N -1/-1 counters on a creature you control. If a player is given the choice to blight but is unable to put N -1/-1 counters on a creature they control (usually because they control no creatures), they can't choose to blight.","reminder":"Blight N (Put N -1/-1 counters on target creature you control.)","beginner":"Put -1/-1 counters on your own creature as a cost for a powerful effect.","desc":"Put N -1/-1 counters on a creature you control.","crfull":"701.68a To \"blight N\" means to put N -1/-1 counters on a creature you control.\n701.68b If a player is given the choice to blight but is unable to put N -1/-1 counters on a creature they control (usually because they control no creatures), they can't choose to blight.\n701.68c Some spells and abilities that instruct a player to blight refer to the \"blighted creature.\" This phrase refers to the object that the player who was instructed to blight chose to put -1/-1 counters on when blighting.\n701.68d An ability that triggers whenever a player blights triggers after the process described in rule 701.68a is complete, regardless of what events actually occurred.","de":"Fäulnis"},{"name":"Blitz","cat":"Keyword Ability","cr":"702.152","crtitle":"Blitz","crshort":"Blitz represents three abilities: two static abilities that function while the card with blitz is on the stack, one of which may create a delayed triggered ability, and a static ability that functions while the object with blitz is on the battlefield.","reminder":"Blitz [cost] (If you cast this spell for its blitz cost, it gains haste and \"When this creature dies, draw a card.\" Sacrifice it at the beginning of the next end step.)","beginner":"Pay the blitz cost to get this creature immediately with haste, then sacrifice it and draw a card at end of turn.","desc":"Cast for Blitz cost. It gains haste and 'When this dies, draw a card'. Sacrifice it at end step.","crfull":"702.152a Blitz represents three abilities: two static abilities that function while the card with blitz is on the stack, one of which may create a delayed triggered ability, and a static ability that functions while the object with blitz is on the battlefield. \"Blitz [cost]\" means \"You may cast this card by paying [cost] rather than its mana cost,\" \"If this spell's blitz cost was paid, sacrifice the permanent this spell becomes at the beginning of the next end step,\" and \"As long as this permanent's blitz cost was paid, it has haste and 'When this permanent is put into a graveyard from the battlefield, draw a card.'\" Casting a spell for its blitz cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.152b If a spell has multiple instances of blitz, only one may be used to cast that spell. If a permanent has multiple instances of blitz, each one refers only to payments made for that blitz ability as the spell was cast, not to any payments made for other instances of blitz.","de":"Blitz"},{"name":"Blood","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Blood tokens are artifact tokens with \"{1}, {T}, Discard a card, Sacrifice this artifact: Draw a card.\"","beginner":"A token you can sacrifice to discard a card and draw a new one.","desc":"Artifact Token. {1}, {T}, Discard a card, Sacrifice this: Draw a card.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Blut"},{"name":"Bloodrush","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Bloodrush  -  [Cost], Discard this card: Target attacking creature gets [bonus] until end of turn.","beginner":"Instead of casting this creature, discard it to pump up an attacking creature.","desc":"{Cost}, Discard: Target attacking creature gets stats/abilities.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, di odthirst","crshort":"Bloodthirst is a static ability. \"Bloodthirst N\" means \"If an opponent was dealt damage this turn, this permanent enters with N +1/+1 counters on it.\"","reminder":"Bloodthirst N (If an opponent was dealt damage this turn, this creature enters the battlefield with N +1/+1 counters on it.)","beginner":"If you damaged an opponent this turn, this creature enters with +1/+1 counters.","desc":"If an opponent was dealt damage this turn, this enters with N +1/+1 counters.","crfull":"702.54a Bloodthirst is a static ability. \"Bloodthirst N\" means \"If an opponent was dealt damage this turn, this permanent enters with N +1/+1 counters on it.\"\n702.54b \"Bloodthirst X\" is a variant of the bloodthirst ability. \"Bloodthirst X\" means \"This permanent enters with X +1/+1 counters on it, where X is the total damage your opponents have been dealt this turn.\"\n702.54c If an object has multiple instances of bloodthirst, each applies separately.","de":"Blutdurst"},{"name":"Boast","cat":"Keyword Ability","cr":"702.142","crtitle":"Boast","crshort":"Boast is a keyword that adds additional rules to the activated ability that follows it. \"Boast - [Cost]: [Effect]\" means \"[Cost]: [Effect]. Activate only if this creature attacked this turn and only once each turn.\"","reminder":"Boast  -  [Cost]: [Effect]. (Activate only if this creature attacked this turn and only once each turn.)","beginner":"After this creature attacks, you can activate this ability once.","desc":"Activate this ability only if this creature attacked this turn and only once each turn.","crfull":"702.142a Boast is a keyword that adds additional rules to the activated ability that follows it. \"Boast - [Cost]: [Effect]\" means \"[Cost]: [Effect]. Activate only if this creature attacked this turn and only once each turn.\"\n702.142b Effects may refer to boast abilities. If an effect refers to a creature boasting, it means its boast ability being activated.","de":"Prahlen"},{"name":"Bolster","c ntil end of turn.","crfull":"702.45a Bushido is a triggered ability. \"Bushido N\" means \"Whenever this creature blocks or becomes blocked, it gets +N/+N until end of turn.\" (See rule 509, \"Declare Blockers Step.\")\n702.45b If a creature has multiple instances of bushido, each triggers separately.","de":"Bushido"},{"name":"Buyback","cat":"Keyword Ability","cr":"702.27","crtitle":"Buyback","crshort":"Buyback appears on some instants and sorceries. It represents two static abilities that function while the spell is on the stack.","reminder":"Buyback [cost] (You may pay an additional [cost] as you cast this spell. If the buyback cost was paid, put this spell into its owner's hand instead of into that player's graveyard as it resolves.)","beginner":"Pay extra when casting to get the spell back to your hand instead of the graveyard.","desc":"You may pay additional cost as you cast this. If you do, return it to hand as it resolves.","crfull":"702.27a Buyback appears on some instants and sorceries. It represents two static abilities that function while the spell is on the stack. \"Buyback [cost]\" means \"You may pay an additional [cost] as you cast this spell\" and \"If the buyback cost was paid, put this spell into its owner's hand instead of into that player's graveyard as it resolves.\" Paying a spell's buyback cost follows the rules for paying additional costs in rules 601.2b and 601.2f-h.","de":"Rückkauf"},{"name":"Cascade","cat":"Keyword Ability","cr":"702.85","crtitle":"Cascade","crshort":"Cascade is a triggered ability that functions only while the spell with cascade is on the stack.","reminder":"Cascade (When you cast this spell, exile cards from the top of your library until you exile a nonland card that costs less. You may cast it without paying its mana cost. Put the exiled cards on the bottom of your library in a random order.)","beginner":"When you cast this, flip cards off your library until you find a cheaper spell you can cast for free.","desc":"Exile
