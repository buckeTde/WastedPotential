o their hand, then shuffle.\"\n702.124k \"Choose a Background\" means \"You may designate two cards as your commander rather than one if one of them is this card and the other is a legendary Background enchantment card.\" You can't designate two cards as your commander if one has a \"choose a Background\" ability and the other is not a legendary Background enchantment card, and legendary Background enchantment cards can't be your commander unless you have also designated a commander with \"choose a Background.\"\n702.124m \"Doctor's companion\" means \"You may designate two legendary creature cards as your commander rather than one if one of them is this card and the other is a legendary Time Lord Doctor creature card that has no other creature types.\"\n702.124n If an effect refers to a partner ability by name, it means only that partner ability and not any others. If an effect refers to the partner ability or cards with partner and doesn't mention a specific variant of the partner ability by name, it is referring only to partner, partner-[text], partner with [name], or cards with any of those abilities, and it does not refer to any other partner variant.","de":"Partner von"},{"name":"Perpetually","cat":"Keyword Action","cr":"","crtitle":"","crshort":"","reminder":"A perpetual effect changes a card for the rest of the game, in every zone, even if the card changes zones.","beginner":"A digital-only (Alchemy) change that sticks to the card forever, wherever it goes.","desc":"Alchemy / digital-only. The modification stays with the card for the rest of the game and survives zone changes  -  unlike normal continuous effects.","crfull":"","de":""},{"name":"Persist","cat":"Keyword Ability","cr":"702.79","crtitle":"Persist","crshort":"Persist is a triggered ability. \"Persist\" means \"When this permanent is put into a graveyard from the battlefield, if it had no -1/-1 counters on it, return it to the battlefield under its owner's control with a -1/-1 counter on it.\"","reminder":"Persist (When this permanent dies, if it had no -1/-1 counters on it, return it to the battlefield under its owner's control with a -1/-1 counter on it.)","beginner":"When this dies, it comes back once with a -1/-1 counter.","desc":"When this dies, if it had no -1/-1 counters, return it with a -1/-1 counter.","crfull":"702.79a Persist is a triggered ability. \"Persist\" means \"When this permanent is put into a graveyard from the battlefield, if it had no -1/-1 counters on it, return it to the battlefield under its owner's control with a -1/-1 counter on it.\"","de":"Beharrlichkeit"},{"name":"Phasing","cat":"Keyword Ability","cr":"702.26","crtitle":"Phasing","crshort":"Phasing is a static ability that modifies the rules of the untap step. During each player's untap step, before the active player untaps permanents, all phased-in permanents with phasing that player controls \"phase out.\" Simultaneously, all phased-out permanent...","reminder":"Phasing (This phases in or out before you untap during each of your untap steps. While it's phased out, it's treated as though it doesn't exist.)","beginner":"Disappears and reappears every other turn.","desc":"Phases out/in during untap. Treated as if it doesn't exist while phased out.","crfull":"702.26a Phasing is a static ability that modifies the rules of the untap step. During each player's untap step, before the active player untaps permanents, all phased-in permanents with phasing that player controls \"phase out.\" Simultaneously, all phased-out permanents that had phased out under that player's control \"phase in.\"\n702.26b If a permanent phases out, its status changes to \"phased out.\" Except for rules and effects that specifically mention phased-out permanents, a phased-out permanent is treated as though it does not exist. It can't affect or be affected by anything else in the game. A permanent that phases out is removed from combat. (See rule 506.4.)\n702.26c If a permanent phases in, its status changes to \"phased in.\" The game once again treats it as though it exists.\n702.26d The phasing event doesn't actually cause a permanent to change zones or control, even though it's treated as though it's not on the battlefield and not under its controller's control while it's phased out. Zone-change triggers don't trigger when a permanent phases in or out. Tokens continue to exist on the battlefield while phased out. Counters and stickers remain on a permanent while it's phased out. Effects that check a phased-in permanent's history won't treat the phasing event as having caused the permanent to leave or enter the battlefield or its controller's control.\n702.26e If a continuous effect generated by the resolution of a spell or ability modifies the characteristics or changes the controller of any objects, a phased-out permanent won't be included in the set of affected objects. This includes continuous effects that reference the permanent specifically, unless they also specifically refer to the permanent as phased out.\n702.26f Continuous effects that affect a phased-out permanent may expire while that permanent is phased out. If so, they will no longer affect that permanent once it's phased in. In particular, effects with \"for as long as\" durations that track that permanent (see rule 611.2b) end when that permanent phases out because they can no longer see it.\n702.26g When a permanent phases out, any Auras, Equipment, or Fortifications attached to that permanent phase out at the same time. This alternate way of phasing out is known as phasing out \"indirectly.\" An Aura, Equipment, or Fortification that phased out indirectly won't phase in by itself, but instead phases in along with the permanent it's attached to.\n702.26h If an object would simultaneously phase out directly and indirectly, it just phases out indirectly.\n702.26i An Aura, Equipment, or Fortification that phased out directly will phase in attached to the object or player it was attached to when it phased out, if that object is still in the same zone or that player is still in the game. If not, that Aura, Equipment, or Fortification phases in unattached. State-based actions apply as appropriate. (See rules 704.5m and 704.5n.)\n702.26j Abilities that trigger when a permanent becomes attached or unattached from an object or player don't trigger when that permanent phases in or out.\n702.26k Phased-out permanents owned by a player who leaves the game also leave the game. This doesn't cause zone-change abilities to trigger. See rule 800.4.\n702.26m If an effect causes a player to skip their untap step, the phasing event simply doesn't occur that turn.\n702.26n In a multiplayer game, game rules may cause a phased-out permanent to leave the game or to be exiled once a player leaves the game. (See rules 800.4a and 800.4c.) If a phased-out permanent phased out under the control of a player who has left the game, that permanent phases in during the next untap step after that player's next turn would have begun.\n702.26p Multiple instances of phasing on the same permanent are redundant.","de":"Instabilität"},{"name":"Plainswalk","cat":"Keyword Ability","cr":"Glossary","crtitle":"","crshort":"See Landwalk.","reminder":"Plainswalk (This creature can't be blocked as long as defending player controls a Plains.)","beginner":"Can't be blocked if your opponent has a Plains.","desc":"This creature is unblockable if defending player controls a Plains.","crfull":"See Landwalk.","de":"Ebenentarnung"},{"name":"Planeswalk","cat":"Keyword Action","cr":"701.31","crtitle":"Planeswalk","crshort":"A player may planeswalk only during a Planechase game. Only the planar controller may planeswalk. See rule 901, \"Planechase.\"","reminder":"Planeswalk (Put each face-up plane card and phenomenon card on the bottom of its owner's planar deck, then move the top card of your planar deck off that deck and turn it face up.)","beginner":"Move to a new plane in Planechase format.","desc":"Put each face-up plane card on the bottom of its owner's planar deck, then move the top card of your planar deck off that deck and turn it face up.","crfull":"701.31a A player may planeswalk only during a Planechase game. Only the planar controller may planeswalk. See rule 901, \"Planechase.\"\n701.31b To planeswalk is to put each face-up plane card and phenomenon card on the bottom of its owner's planar deck face down, then move the top card of your planar deck off that planar deck and turn it face up.\n701.31c A player may planeswalk as the result of the \"planeswalking ability\" (see rule 901.8), because the owner of a face-up plane card or phenomenon card leaves the game (see rule 901.10), or because a phenomenon's triggered ability leaves the stack (see rule 704.6f). Abilities may also instruct a player to planeswalk.\n701.31d The plane card that's turned face up is the plane the player planeswalks to. The plane card that's turned face down or that leaves the game is the plane the player planeswalks away from. The same is true with respect to phenomena.","de":""},{"name":"Play","cat":"Keyword Action","cr":"701.18","crtitle":"Play","crshort":"To play a land means to put it onto the battlefield from the zone it's in (usually the hand). A player may play a land if they have priority, it's the main phase of their turn, the stack is empty, and they haven't played a land this turn.","reminder":"To play a land or cast a spell.","beginner":"The general term for either casting a spell or playing a land.","desc":"To cast a spell or play a land.","crfull":"701.18a To play a land means to put it onto the battlefield from the zone it's in (usually the hand). A player may play a land if they have priority, it's the main phase of their turn, the stack is empty, and they haven't played a land this turn. Playing a land is a special action (see rule 116), so it doesn't use the stack; it simply happens. Putting a land onto the battlefield as the result of a spell or ability isn't the same as playing a land. See rule 305, \"Lands.\"\n701.18b To play a card means to play that card as a land or to cast that card as a spell, whichever is appropriate.\n701.18c Some effects instruct a player to \"play\" with a certain aspect of the game changed, such as \"Play with the top card of your library revealed.\" \"Play\" in this sense means to play the Magic game.\n701.18d Previously, the action of casting a spell, or casting a card as a spell, was referred to on cards as \"playing\" that spell or that card. Cards that were printed with that text have received errata in the Oracle card reference so they now refer to \"casting\" that spell or that card.\n701.18e Previously, the action of using an activated ability was referred to on cards as \"playing\" that ability. Cards that were printed with that text have received errata in the Oracle card reference so they now refer to \"activating\" that ability.","de":"Spielen"},{"name":"Plot","cat":"Keyword Ability","cr":"702.170","crtitle":"Plot","crshort":"Plot is a keyword ability that functions while the card with plot is in a player's hand. \"Plot [cost]\" means \"Any time you have priority during your main phase while the stack is empty, you may exile this card from your hand and pay [cost].","reminder":"Plot [cost] ([Cost], Exile this card from your hand: You may cast it on a later turn without paying its mana cost. Plot only as a sorcery.)","beginner":"Pay to exile this from your hand, then cast it for free on a later turn.","desc":"Exile for Plot cost. Cast it as a sorcery on a later turn without paying mana cost.","crfull":"702.170a Plot is a keyword ability that functions while the card with plot is in a player's hand. \"Plot [cost]\" means \"Any time you have priority during your main phase while the stack is empty, you may exile this card from your hand and pay [cost]. It becomes a plotted card.\"\n702.170b Exiling a card using its plot ability is a special action, which doesn't use the stack. See rule 116, \"Special Actions.\"\n702.170c In addition to the plot special action, some spells and abilities cause a card in exile to become plotted.\n702.170d A plotted card's owner may cast it from exile without paying its mana cost during their main phase while the stack is empty during any turn after the turn in which it became plotted. Casting a spell this way follows the rules for paying alternative costs in rules 601.2b and 601.2f-h. A plotted card may be cast this way even if it doesn't have the plot ability while in exile.\n702.170e If an effect refers to plotting a card, it means performing the special action associated with a plot ability.\n702.170f An effect may allow the plot ability of a card to function in a zone other than a player's hand. In that case, the card is exiled from the zone it is in as the action is taken rather than from its owner's hand.","de":"Aushecken"},{"name":"Poison","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Poison counters are a counter type that can be given to players. A player with ten or more poison counters loses the game.","beginner":"Counters on players - get 10 poison counters and you lose the game.","desc":"Counter on player. If you have 10, you lose the game.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Gift; Giftmarke"},{"name":"Poisonous","cat":"Keyword Ability","cr":"702.70","crtitle":"Poisonous","crshort":"Poisonous is a triggered ability. \"Poisonous N\" means \"Whenever this creature deals combat damage to a player, that player gets N poison counters.\" (For information about poison counters, see rule 104.3d.)","reminder":"Poisonous N (Whenever this creature deals combat damage to a player, that player gets N poison counters.)","beginner":"Gives poison counters when it deals combat damage to a player.","desc":"Whenever this deals combat damage to a player, that player gets N poison counters.","crfull":"702.70a Poisonous is a triggered ability. \"Poisonous N\" means \"Whenever this creature deals combat damage to a player, that player gets N poison counters.\" (For information about poison counters, see rule 104.3d.)\n702.70b If a creature has multiple instances of poisonous, each triggers separately.","de":"Gift"},{"name":"Populate","cat":"Keyword Action","cr":"701.36","crtitle":"Populate","crshort":"To populate means to choose a creature token you control and create a token that's a copy of that creature token. If you control no creature tokens when instructed to populate, you won't create a token.","reminder":"Populate (Create a token that's a copy of a creature token you control.)","beginner":"Copy one of your creature tokens.","desc":"Create a token that is a copy of a creature token you control.","crfull":"701.36a To populate means to choose a creature token you control and create a token that's a copy of that creature token.\n701.36b If you control no creature tokens when instructed to populate, you won't create a token.","de":"Bevölkern"},{"name":"Power-Up","cat":"Keyword Ability","cr":"702.193","crtitle":"Power-up","crshort":"Power-up is a keyword that adds additional rules to the activated ability that follows it. \"Power-up - [Cost]: [Effect]\" means \"[Cost]: [Effect]. If this permanent entered this turn, this ability's cost is reduced by this permanent's mana cost.","reminder":"Power-up  -  [Cost]: [Effect]. (Activate each power-up ability only once. Reduce the cost by its mana cost if it entered this turn.)","beginner":"A once-per-game boost ability; cheaper if the permanent came down this turn.","desc":"Activated ability usable only once each. Its cost is reduced by the permanent's mana cost if the permanent entered the battlefield this turn.","crfull":"702.193a Power-up is a keyword that adds additional rules to the activated ability that follows it. \"Power-up - [Cost]: [Effect]\" means \"[Cost]: [Effect]. If this permanent entered this turn, this ability's cost is reduced by this permanent's mana cost. Activate this ability only once.\"\n702.193b Generic mana in the permanent's mana cost reduces generic mana in the cost to activate its power-up ability. Colored and colorless mana in the permanent's mana cost reduces mana of the same type, and any excess reduces that much generic mana. (See rule 118.7.)","de":"Superladung"},{"name":"Powerstone","cat":"Token","cr":"111.1","crtitle":"","crshort":"Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card. The player who creates a token is its owner. The token enters the battlefield under that player's control.","reminder":"Powerstone tokens have '{T}: Add {C}. This mana can't be spent to cast a nonartifact spell.'","beginner":"An artifact token that taps for colorless mana, but only for artifact spells.","desc":"Artifact Token. {T}: Add {C}. Can't be spent on nonartifact spells.","crfull":"111.1. Some effects put tokens onto the battlefield. A token is a marker used to represent any permanent that isn't represented by a card.\n111.2. The player who creates a token is its owner. The token enters the battlefield under that player's control.\n111.3. The spell or ability that creates a token may define the values of any number of characteristics for the token. This becomes the token's \"text.\" The characteristic values defined this way are functionally equivalent to the characteristic values that are printed on a card; for example, they define the token's copiable values. A token doesn't have any characteristics not defined by the spell or ability that created it.\n111.4. A spell or ability that creates a token sets both its name and its subtype(s). If the spell or ability doesn't specify the name of the token, its name is the same as its subtype(s) plus the word \"Token.\" Once a token is on the battlefield, changing its name doesn't change its subtype(s), and vice versa.\n111.5. If a spell or ability would create a token, but a rule or effect states that a permanent with one or more of that token's characteristics can't enter the battlefield, the token is not created. Similarly, if an effect would create a token that is a copy of an instant or sorcery card, no token is created.\n111.6. A token is subject to anything that affects permanents in general or that affects the token's card type or subtype. A token isn't a card (even if represented by a card that has a Magic back or that came from a Magic booster pack).\n111.7. A token that's in a zone other than the battlefield ceases to exist. This is a state-based action; see rule 704. (Note that if a token changes zones, applicable triggered abilities will trigger before the token ceases to exist.)\n111.8. A token that has left the battlefield can't move to another zone or come back onto the battlefield. If such a token would change zones, it remains in its current zone instead. It ceases to exist the next time state-based actions are checked; see rule 704.","de":"Kraftstein"},{"name":"Prepared","cat":"Keyword Action","cr":"Glossary","crtitle":"","crshort":"A designation a permanent may have that allows you to cast a copy of that card with its alternative characteristics. See rule 722, \"Preparation Cards.\"","reminder":"(While it's prepared, you may cast a copy of its spell. Doing so unprepares it.)","beginner":"When this creature meets a condition, it becomes prepared  -  you can then cast a free copy of its associated spell, which unprepares it.","desc":"Named mechanic. A creature becomes prepared via a trigger condition. While prepared, you may cast a free copy of its paired spell. Casting it unprepares the creature.","crfull":"A designation a permanent may have that allows you to cast a copy of that card with its alternative characteristics. See rule 722, \"Preparation Cards.\"","de":"Vorbereitet"},{"name":"Proliferate","cat":"Keyword Action","cr":"701.34","crtitle":"Proliferate","crshort":"To proliferate means to choose any number of permanents and/or players that have a counter, then give each one additional counter of each kind that permanent or player already has.","reminder":"Proliferate (Choose any number of permanents and/or players, then give each another counter of each kind already there.)","beginner":"Add one more of each type of counter already on any permanents or players you choose.","desc":"Choose any players/permanents with counters. Give them one more of each kind.","crfull":"701.34a To proliferate means to choose any number of permanents and/or players that have a counter, then give each one additional counter of each kind that permanent or player already has.\n701.34b In a Two-Headed Giant game, poison counters are shared by the team. If more than one player on a team is chosen this way, only one of those players can be given an additional poison counter. The player who proliferates chooses which player that is. See rule 810, \"Two-Headed Giant Variant.\"","de":"Wucherung"},{"name":"Protection","cat":"Keyword Ability","cr":"702.16","crtitle":"Protection","crshort":"Protection is a static ability, written \"Protection from [quality].\" This quality is usually a color (as in \"protection from black\") but can be any characteristic value or information.","reminder":"Protection from [quality] (This can't be blocked, targeted, dealt damage, enchanted, or equipped by anything [quality].)","beginner":"Can't be blocked, targeted, damaged, enchanted, or equipped by the specified quality.","desc":"Can't be damaged, enchanted, equipped, blocked, or targeted by anything with specified quality.","crfull":"702.16a Protection is a static ability, written \"Protection from [quality].\" This quality is usually a color (as in \"protection from black\") but can be any characteristic value or information. If the quality happens to be a card name, it is treated as such only if the protection ability specifies that the quality is a name. If the quality is a card type, subtype, or supertype, the ability applies to sources that are permanents with that card type, subtype, or supertype and to any sources not on the battlefield that are of that card type, subtype, or supertype. This is an exception to rule 109.2.\n702.16b A permanent or player with protection can't be targeted by spells with the stated quality and can't be targeted by abilities from a source with the stated quality.\n702.16c A permanent or player with protection can't be enchanted by Auras that have the stated quality. Such Auras attached to the permanent or player with protection will be put into their owners' graveyards as a state-based action. (See rule 704, \"State-Based Actions.\")\n702.16d A permanent with protection can't be equipped by Equipment that have the stated quality or fortified by Fortifications that have the stated quality. Such Equipment or Fortifications become unattached from that permanent as a state-based action, but remain on the battlefield. (See rule 704, \"State-Based Actions.\")\n702.16e Any damage that would be dealt by sources that have the stated quality to a permanent or player with protection is prevented.\n702.16f Attacking creatures with protection can't be blocked by creatures that have the stated quality.\n702.16g \"Protection from [quality A] and from [quality B]\" is shorthand for \"protection from [quality A]\" and \"protection from [quality B]\"; it behaves as two separate protection abilities.\n702.16h \"Protection from each [characteristic]\" is shorthand for \"protection from [quality A],\" \"protection from [quality B],\" and so on for each possible quality the listed characteristic could have; it behaves as multiple separate protection abilities.\n702.16i \"Protection from each [set of characteristics, qualities, or players]\" is shorthand for \"protection from [A],\" \"protection from [B],\" and so on for each characteristic, quality, or player in the set. It behaves as multiple separate protection abilities.\n702.16j \"Protection from everything\" is a variant of the protection ability. A permanent or player with protection from everything has protection from each object regardless of that object's characteristic values. Such a permanent or player can't be targeted by spells or abilities and can't be enchanted by Auras. Such a permanent can't be equipped by Equipment, fortified by Fortifications, or blocked by creatures. All damage that would be dealt to such a permanent or player is prevented.\n702.16k \"Protection from [a player]\" is a variant of the protection ability. A permanent or player with protection from a specific player has protection from each object that player controls and protection from each object that player owns not controlled by another player, regardless of that object's characteristic values. Such a permanent or player can't be targeted by spells or abilities the specified player controls and can't be enchanted by Auras that player controls. Such a permanent can't be equipped by Equipment that player controls, fortified by Fortifications that player controls, or blocked by creatures that player controls. All damage that would be dealt to such a permanent or player by sources controlled by the specified player or owned by that player but not controlled by another player is prevented.\n702.16m Multiple instances of protection from the same quality on the same permanent or player are redundant.\n702.16n Some Auras both give the enchanted creature protection from a quality and say \"this effect doesn't remove\" either that specific Aura or all Auras. This means that the specified Auras aren't put into their owners' graveyards as a state-based action. If the creature has other instances of protection from the same quality, those instances affect Auras as normal.\n702.16p One Aura (Benevolent Blessing) gives the enchanted creature protection from a quality and says the effect doesn't remove certain permanents that are \"already attached to\" that creature. This means that, when the protection effect starts to apply, any objects with the stated quality that are already attached to that creature (including the Aura giving that creature protection) will not be put into their owners' graveyards as a state-based action. Other permanents with the stated quality can't become attached to the creature. If the creature has other instances of protection from the same quality, those instances affect attached permanents as normal.","de":"Schutz; Schutz vor"},{"name":"Prototype","cat":"Keyword Ability","cr":"702.160","crtitle":"Prototype","crshort":"Prototype is a static ability that appears on prototype cards that have a secondary set of power, toughness, and mana cost characteristics.","reminder":"Prototype [mana cost]  -  [power]/[toughness] (You may cast this spell with different mana cost, color, and size. It keeps its abilities and types.)","beginner":"Cast this cheaper as a smaller creature with the same abilities.","desc":"You may cast this spell with different mana cost, color, and size.","crfull":"702.160a Prototype is a static ability that appears on prototype cards that have a secondary set of power, toughness, and mana cost characteristics. A player who casts a spell with prototype can choose to cast that card \"prototyped.\" If they do, the alternative set of its power, toughness, and mana cost characteristics are used. See 718, \"Prototype Cards.\"","de":""},{"name":"Provoke","cat":"Keyword Ability","cr":"702.39","crtitle":"Provoke","crshort":"Provoke is a triggered ability. \"Provoke\" means \"Whenever this creature attacks, you may choose to have target creature defending player controls block this creature this combat if able. If you do, untap that creature.\"","reminder":"Provoke (Whenever this creature attacks, you may have target creature defending player controls untap and block it if able.)","beginner":"Forces an opponent's creature to untap and block this when it attacks.","desc":"When this attacks, you may have target creature untap and block it.","crfull":"702.39a Provoke is a triggered ability. \"Provoke\" means \"Whenever this creature attacks, you may choose to have target creature defending player controls block this creature this combat if able. If you do, untap that creature.\"\n702.39b If a creature has multiple instances of provoke, each triggers separately.","de":"Provozieren"},{"name":"Prowess","cat":"Keyword Ability","cr":"702.108","crtitle":"Prowess","crshort":"Prowess is a triggered ability. \"Prowess\" means \"Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.\" If a creature has multiple instances of prowess, each triggers separately.","reminder":"Prowess (Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.)","beginner":"Gets +1/+1 until end of turn when you cast instant or sorcery spells.","desc":"Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.","crfull":"702.108a Prowess is a triggered ability. \"Prowess\" means \"Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.\"\n702.108b If a creature has multiple instances of prowess, each triggers separately.","de":"Bravour"},{"name":"Prowl","cat":"Keyword Ability","cr":"702.76","crtitle":"Prowl","crshort":"Prowl is a static ability that functions on the stack. \"Prowl [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if a player was dealt combat damage this turn by a source that, at the time it dealt that damage, was under your control and...","reminder":"Prowl [cost] (You may cast this for its prowl cost if you dealt combat damage to a player this turn with a [creature type].)","beginner":"Cast this cheaper if you dealt combat damage with a creature of the specified type this turn.","desc":"You may cast for Prowl cost if you dealt combat damage with a creature of same type.","crfull":"702.76a Prowl is a static ability that functions on the stack. \"Prowl [cost]\" means \"You may pay [cost] rather than pay this spell's mana cost if a player was dealt combat damage this turn by a source that, at the time it dealt that damage, was under your control and had any of this spell's creature types.\" Casting a spell for its prowl cost follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.","de":"Beutezug"},{"name":"Rad (Radiation)","cat":"Counter","cr":"122.1","crtitle":"","crshort":"A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter.","reminder":"Rad counters are a counter type on players. At the beginning of your precombat main phase, mill cards equal to the number of rad counters you have. For each nonland card milled this way, you lose 1 life and a rad counter.","beginner":"Counters that make you mill cards and lose life during your precombat main phase.","desc":"Counter on player. At precombat main: Mill cards equal to rads. For each nonland milled, lose 1 life and 1 rad.","crfull":"122.1. A counter is a marker placed on an object or player that modifies its characteristics and/or interacts with a rule, ability, or effect. Counters are not objects and have no characteristics. Notably, a counter is not a token, and a token is not a counter. Counters with the same name or description are interchangeable.\n122.1a A +X/+Y counter on a creature or on a creature card in a zone other than the battlefield, where X and Y are numbers, adds X to that object's power and Y to that object's toughness. Similarly, -X/-Y counters subtract from power and toughness. See rule 613.4c.\n122.1b A keyword counter on a permanent or on a card in a zone other than the battlefield causes that object to gain that keyword. The keywords that a keyword counter can be are flying, first strike, double strike, deathtouch, decayed, exalted, haste, hexproof, indestructible, lifelink, menace, reach, shadow, trample, and vigilance, as well as any variants of those keywords. See rule 613.1f.\n122.1c One or more shield counters on a permanent create a single replacement effect and a single prevention effect that protect the permanent. These effects are \"If this permanent would be destroyed as the result of an effect, instead remove a shield counter from it\" and \"If damage would be dealt to this permanent, prevent that damage and remove a shield counter from it.\" See rule 614, \"Replacement Effects,\" and rule 615, \"Prevention Effects.\"\n122.1d One or more stun counters on a permanent create a single replacement effect that stops the permanent from untapping. That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"\n122.1e The number of loyalty counters on a planeswalker on the battlefield indicates how much loyalty it has. A planeswalker with 0 loyalty is put into its owner's graveyard as a state-based action. See rule 704.\n122.1f If a player has ten or more poison counters, that player loses the game as a state-based action. See rule 704. A player is \"poisoned\" if they have one or more poison counters. (See rule 810 for additional rules for Two-Headed Giant games.)\n122.1g The number of defense counters on a battle on the battlefield indicates how much defense it has. A battle with 0 defense is put into its owner's graveyard if it isn't the source of an ability that has triggered but not yet left the stack. This state-based action doesn't use the stack. See rule 704.","de":"Verstrahlung"},{"name":"Radiance","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Radiance  -  [Effect] target permanent and each other permanent that shares a color with it.","beginner":"Affects the target and all other permanents that share any color with it.","desc":"Target and each other permanent that shares a color with it.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, spell mastery, strive, survival, sweep, tempting offer, threshold, undergrowth, valiant, vivid, void, and will of the council.\n207.2d Similar to ability words, flavor words appear in italics at the beginning of some abilities. Flavor words provide a flavorful description of abilities, but they have no special rules meaning and are not listed in the Comprehensive Rules. While an ability word ties together several abilities with similar functionality, each flavor word is tailored to the specific ability it appears with.\n207.3. Some cards have decorative icons in the background of their text boxes. For example, a guild icon appears in the text box of many cards associated with the guilds of Ravnica, and a faction icon appears in the text box of most Scars of Mirrodin(TM) block cards. Similarly, many promotional cards include decorative icons. These icons have no effect on game play.\n207.4. The chaos symbol appears in the text box of each plane card to the left of a triggered ability that triggers whenever chaos ensues. The symbol itself has no special rules meaning. See rule 901, \"Planechase.\"\n207.5. One card (Cryptic Spires) has a set of symbols below the text box that represent each color and an ability that instructs a player to circle two of those colors as they create their deck. To circle a color, the player circles (or otherwise clearly indicates) that color's symbol. The mana symbol of each circled color is considered part of that card's printed rules text (see rule 613.1) and affects that card's color identity (see rule 903.4).","de":"Ausstrahlung"},{"name":"Raid","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Raid  -  [Effect] if you attacked this turn.","beginner":"Bonus effect if you attacked with a creature this turn.","desc":"Effect active if you attacked with a creature this turn.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special ru ers Step.\")\n702.23b The rampage bonus is calculated only once per combat, when the triggered ability resolves. Adding or removing blockers later in combat won't change the bonus.\n702.23c If a creature has multiple instances of rampage, each triggers separately.","de":"Raserei"},{"name":"Ravenous","cat":"Keyword Ability","cr":"702.156","crtitle":"Ravenous","crshort":"Ravenous is a keyword found on some creature cards with {X} in their mana cost. Ravenous represents both a replacement effect and a triggered ability.","reminder":"Ravenous (This creature enters the battlefield with X +1/+1 counters on it. If X is 5 or more, draw a card when it enters.)","beginner":"Enters with X +1/+1 counters and draws a card if X is 5 or more.","desc":"Enters with X +1/+1 counters. If X is 5 or more, draw a card.","crfull":"702.156a Ravenous is a keyword found on some creature cards with {X} in their mana cost. Ravenous represents both a replacement effect and a triggered ability. \"Ravenous\" means \"This permanent enters with X +1/+1 counters on it\" and \"When this permanent enters, if X is 5 or more, draw a card.\" See rule 107.3m.","de":"Unersättlich"},{"name":"Reach","cat":"Keyword Ability","cr":"702.17","crtitle":"Reach","crshort":"Reach is a static ability. A creature with flying can't be blocked except by creatures with flying and/or reach. (See rule 509, \"Declare Blockers Step,\" and rule 702.9, \"Flying.\") Multiple instances of reach on the same creature are redundant.","reminder":"Reach (This creature can block creatures with flying.)","beginner":"Can block flying creatures.","desc":"Can block creatures with flying.","crfull":"702.17a Reach is a static ability.\n702.17b A creature with flying can't be blocked except by creatures with flying and/or reach. (See rule 509, \"Declare Blockers Step,\" and rule 702.9, \"Flying.\")\n702.17c Multiple instances of reach on the same creature are redundant.","de":"Reichweite"},{"name":"Read Ahead","cat":"Keyword Ability","cr":"702.155","crtitle":"Read Ahead","crshort":"Read ahead is a keyword found on some Saga cards. \"Read ahead\" means \"Chapter abilities of this Saga can't trigger the turn it entered the battlefield unless it has exactly the number of lore counters on it specified in the chapter symbol of that ability.\" See...","reminder":"Read ahead (Choose a chapter and start with that many lore counters. Add one after your draw step. Skipped chapters don't trigger. Sacrifice after the last chapter.)","beginner":"Start this Saga at a later chapter of your choice.","desc":"Start a Saga at any chapter you choose.","crfull":"702.155a Read ahead is a keyword found on some Saga cards. \"Read ahead\" means \"Chapter abilities of this Saga can't trigger the turn it entered the battlefield unless it has exactly the number of lore counters on it specified in the chapter symbol of that ability.\" See rule 714, \"Saga Cards.\"\n702.155b Each Saga with read ahead has the intrinsic abilities \"As this Saga enters, choose a number between one and this Saga's final chapter number\" and \"This Saga enters with the chosen number of lore counters on it.\" See rule 714.3b.\n702.155c Multiple instances of read ahead on the same object are redundant.","de":"Überblättern"},{"name":"Rebound","cat":"Keyword Ability","cr":"702.88","crtitle":"Rebound","crshort":"Rebound appears on some instants and sorceries. It represents a static ability that functions while the spell is on the stack and may create a delayed triggered ability.","reminder":"Rebound (If you cast this spell from your hand, exile it as it resolves. At the beginning of your next upkeep, you may cast this card from exile without paying its mana cost.)","beginner":"Cast it again for free next turn.","desc":"Exile as it resolves. Cast again for free at your next upkeep.","crfull":"702.88a Rebound appears on some instants and sorceries. It represents a static ability that functions while the spell is on the stack and may create a delayed triggered ability. \"Rebound\" means \"If this spell was cast from your hand, instead of putting it into your graveyard as it resolves, exile it and, at the beginning of your next upkeep, you may cast this card from exile without paying its mana cost.\"\n702.88b Casting a spell as an effect of its rebound ability follows the rules for paying alternative costs in rules 601.2b and 601.2f-h.\n702.88c Multiple instances of rebound on the same spell are redundant.","de":"Abprall"},{"name":"Reconfigure","cat":"Keyword Ability","cr":"702.151","crtitle":"Reconfigure","crshort":"Reconfigure represents two activated abilities. Reconfigure [cost] means \"[Cost]: Attach this permanent to another target creature you control. Activate only as a sorcery\" and \"[Cost]: Unattach this permanent.","reminder":"Reconfigure [cost] ([Cost]: Attach to target creature you control; or unattach from a creature. Reconfigure only as a sorcery. While attached, this isn't a creature.)","beginner":"Can be either a creature or an Equipment - switch modes at sorcery speed.","desc":"{Cost}: Attach to creature / Unattach (becomes creature). Sorcery speed.","crfull":"702.151a Reconfigure represents two activated abilities. Reconfigure [cost] means \"[Cost]: Attach this permanent to another target creature you control. Activate only as a sorcery\" and \"[Cost]: Unattach this permanent. Activate only if this permanent is attached to a creature and only as a sorcery.\"\n702.151b Attaching an Equipment with reconfigure to another creature causes the Equipment to stop being a creature until it becomes unattached from that creature.","de":"Rekonfigurieren"},{"name":"Recover","cat":"Keyword Ability","cr":"702.59","crtitle":"Recover","crshort":"Recover is a triggered ability that functions only while the card with recover is in a player's graveyard. \"Recover [cost]\" means \"When a creature is put into your graveyard from the battlefield, you may pay [cost].","reminder":"Recover [cost] (When a creature is put into your graveyard from the battlefield, you may pay [cost]. If you do, return this card from your graveyard to your hand. Otherwise, exile this card.)","beginner":"When a creature dies, pay to return this from graveyard to hand or exile it.","desc":"{Cost}: Return from graveyard when a creature dies. If not, exile this.","crfull":"702.59a Recover is a triggered ability that functions only while the card with recover is in a player's graveyard. \"Recover [cost]\" means \"When a creature is put into your graveyard from the battlefield, you may pay [cost]. If you do, return this card from your graveyard to your hand. Otherwise, exile this card.\"","de":"Bergung"},{"name":"Recruit","cat":"Keyword Action","cr":"701.70","crtitle":"Recruit","crshort":"\"Recruit\" means \"Draw a card, then discard a card. If you discarded a nonland card this way, create a 1/1 white Human Soldier creature token.\"","reminder":"To recruit, draw a card, then discard a card. If you discarded a nonland card, create a 1/1 white Human Soldier creature token.","beginner":"Loot one card, and get a 1/1 Soldier if what you pitched wasn't a land.","desc":"Draw a card, then discard a card. If the discarded card was a nonland card, create a 1/1 white Human Soldier creature token.","crfull":"701.70a \"Recruit\" means \"Draw a card, then discard a card. If you discarded a nonland card this way, create a 1/1 white Human Soldier creature token.\"","de":"Rekrutieren"},{"name":"Regenerate","cat":"Keyword Action","cr":"701.19","crtitle":"Regenerate","crshort":"If the effect of a resolving spell or ability regenerates a permanent, it creates a replacement effect that protects the permanent the next time it would be destroyed this turn.","reminder":"Regenerate (The next time this permanent would be destroyed this turn, it isn't. Instead tap it, remove all damage from it, and remove it from combat.)","beginner":"Create a shield that prevents this from being destroyed once - taps it instead.","desc":"Creates a replacement effect that protects a permanent the next time it would be destroyed this turn. Tapped, removed from combat, damage removed.","crfull":"701.19a If the effect of a resolving spell or ability regenerates a permanent, it creates a replacement effect that protects the permanent the next time it would be destroyed this turn. In this case, \"Regenerate [permanent]\" means \"The next time [permanent] would be destroyed this turn, instead remove all damage marked on it and its controller taps it. If it's an attacking or blocking creature, remove it from combat.\"\n701.19b If the effect of a static ability regenerates a permanent, it replaces destruction with an alternate effect each time that permanent would be destroyed. In this case, \"Regenerate [permanent]\" means \"Instead remove all damage marked on [permanent] and its controller taps it. If it's an attacking or blocking creature, remove it from combat.\"\n701.19c Neither activating an ability that creates a regeneration shield nor casting a spell that creates a regeneration shield is the same as regenerating a permanent. Effects that say that a permanent can't be regenerated don't preclude such abilities from being activated or such spells from being cast; rather, they cause regeneration shields to not be applied.","de":"Regenerieren"},{"name":"Reinforce","cat":"Keyword Ability","cr":"702.77","crtitle":"Reinforce","crshort":"Reinforce is an activated ability that functions only while the card with reinforce is in a player's hand. \"Reinforce N-[cost]\" means \"[Cost], Discard this card: Put N +1/+1 counters on target creature.\"","reminder":"Reinforce N - [cost] ([Cost], Discard this card: Put N +1/+1 counters on target creature.)","beginner":"Discard this to put +1/+1 counters on a creature.","desc":"{Cost}, Discard this card: Put N +1/+1 counters on target creature.","crfull":"702.77a Reinforce is an activated ability that functions only while the card with reinforce is in a player's hand. \"Reinforce N-[cost]\" means \"[Cost], Discard this card: Put N +1/+1 counters on target creature.\"\n702.77b Although the reinforce ability can be activated only if the card is in a player's hand, it continues to exist while the object is on the battlefield and in all other zones. Therefore objects with reinforce will be affected by effects that depend on objects having one or more activated abilities.","de":"Unterstützung"},{"name":"Renew","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Renew  -  [Cost], Exile this card from your graveyard: [Effect]. Activate only as a sorcery.","beginner":"Burn this card out of your graveyard to put counters or keyword counters on a creature.","desc":"Tarkir: Dragonstorm (2025). Graveyard activated ability, sorcery speed only, that exiles the card as part of its cost. Typically puts +1/+1 counters and keyword counters such as trample or lifelink on a target creature.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, celebration, channel, chroma, cohort, constellation, converge, council's dilemma, coven, delirium, descend 4, descend 8, disappear, domain, eerie, eminence, enrage, fateful hour, fathomless descent, ferocious, flurry, formidable, grandeur, hellbent, heroic, imprint, infusion, inspired, join forces, kinship, landfall, lieutenant, magecraft, metalcraft, morbid, opus, pack tactics, paradox, parley, radiance, raid, rally, renew, repartee, revolt, secret council, .)","beginner":"Deal combat damage to a player once to get +1/+1 counters and become renowned.","desc":"When deals combat damage to player, if not renowned, put +1/+1 counter on it.","crfull":"702.112a Renown is a triggered ability. \"Renown N\" means \"When this creature deals combat damage to a player, if it isn't renowned, put N +1/+1 counters on it and it becomes renowned.\"\n702.112b Renowned is a designation that has no rules meaning other than to act as a marker that the renown ability and other spells and abilities can identify. Only permanents can be or become renowned. Once a permanent becomes renowned, it stays renowned until it leaves the battlefield. Renowned is neither an ability nor part of the permanent's copiable values.\n702.112c If a creature has multiple instances of renown, each triggers separately. The first such ability to resolve will cause the creature to become renowned, and subsequent abilities will have no effect. (See rule 603.4)","de":"Ruhm"},{"name":"Repartee","cat":"Ability Word","cr":"207.2c","crtitle":"","crshort":"An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive...","reminder":"Repartee  -  Whenever you cast an instant or sorcery spell that targets a creature, [effect].","beginner":"Whenever you cast an instant or sorcery spell that targets a creature, something happens.","desc":"Ability word. Triggers whenever you cast an instant or sorcery spell that targets a creature.","crfull":"207.2c An ability word appears in italics at the beginning of some abilities. Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning and no individual entries in the Comprehensive Rules. The ability words are adamant, addendum, alliance, battalion, bloodrush, c
